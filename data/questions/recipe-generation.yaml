- id: rgen-012
  category: recipe-generation
  difficulty: 2
  public: true
  prompt: >
    Write a low-FODMAP friendly pasta dinner for 2 (no onion, no garlic) that
    still tastes deeply savoury. Give the ingredient list and method, and
    explain how you build flavour without onion or garlic.
  grader:
    type: llm-judge
    rubric:
      - name: Constraint satisfaction
        description: >
          5 = genuinely contains no onion or garlic (including powders, and
          flags garlic-infused oil as the low-FODMAP trick rather than raw
          garlic), and stays broadly low-FODMAP. 1 = uses onion/garlic.
        weight: 0.5
      - name: Flavour strategy
        description: >
          5 = builds savoury depth via garlic-infused oil, the green tops of
          spring onions/chives, parmesan, tomato, capers/olives, herbs. 1 = bland
          or hand-waves it.
        weight: 0.3
      - name: Completeness
        description: 5 = ingredients + method scaled for 2. 1 = gaps.
        weight: 0.2
    constraintChecks:
      - type: keyword
        forbidden:
          # singular 'onion' catches "one onion / the onion" while letting the
          # low-FODMAP-legal "green tops of spring onions" through
          - 'onion'
          - 'garlic clove'
          - 'minced garlic'
          - 'crushed garlic'
          - 'garlic powder'
          - 'onion powder'
  referenceAnswer: >
    Pasta with a savoury tomato-caper sauce for 2: cook in garlic-infused olive
    oil (oil carries the flavour but not the FODMAPs), build with canned
    tomatoes, capers or olives, the green tops of spring onions or chives,
    parmesan and fresh basil; no onion or garlic solids anywhere.

# rgen-013/014 are adapted from the founding real-world prompts where the
# Gemini 3.0 → 3.1 quantity regression was first observed.

- id: rgen-013
  category: recipe-generation
  difficulty: 3
  public: true
  prompt: >
    I need a dinner meal plan for next week (Mon–Thu) for me and my girlfriend
    (2 people). Assume it is mid-June in the UK and anchor the menu in produce
    at peak British season right now. Shop: Ocado (UK). Optimize the shopping
    list for minimal waste — if we buy fresh parsley for Monday, use it again
    later in the week. The vibe is "Effortless Excellence": Michelin-quality
    plating and flavour, executed in under 30 minutes of active cooking time,
    focused on perfect searing, acidity to cut richness, and contrasting
    textures. Strict nutritional goals: 40–60 g protein per person per meal and
    a nutrient-dense fibre source in every meal. Use 4 different high-quality
    protein sources across the week; we prefer dense, rich cuts (game, beef,
    pork, oily fish) over light flaky white fish. Output: the 4-meal menu;
    full step-by-step recipes with a Chef's Note on specific timings; one
    "Michelin Trick" per dish; a consolidated Ocado shopping list specifying
    the raw meat weights needed to hit the protein target; and full macros per
    meal (calories, protein, fibre, fat).
  grader:
    type: llm-judge
    rubric:
      - name: Protein & macro math
        description: >
          5 = raw meat weights genuinely deliver 40–60 g protein per person
          (e.g. ~200–250 g raw beef or ~180–220 g pork loin per person ≈ 45–55 g;
          two people = double the raw weight on the list), and per-meal macros
          are present and internally consistent with the ingredients. 1 = raw
          weights that miss the target by a wide margin, macros invented or
          missing — this is the precise failure mode the question hunts for.
        weight: 0.35
      - name: Seasonality accuracy
        description: >
          5 = the menu is anchored in genuine mid-June UK peak produce
          (asparagus tail-end, strawberries, broad beans, peas, courgettes, new
          potatoes, radishes, samphire, mackerel, crab, cherries late June).
          1 = autumn/winter produce (squash, parsnips, Brussels sprouts)
          presented as seasonal.
        weight: 0.25
      - name: Constraint adherence
        description: >
          5 = exactly 4 distinct dense protein sources (no light white fish as a
          main), ≤30 min active time credible per recipe, deliberate ingredient
          overlap for waste reduction, consolidated list present. 1 = constraints
          silently broken.
        weight: 0.25
      - name: Menu quality & format
        description: >
          5 = four distinct, cohesive, genuinely elevated meals with specific
          Chef's Notes (real timings) and a concrete Michelin Trick each.
          1 = generic dishes, padding, vague tips.
        weight: 0.15
    constraintChecks:
      - type: keyword
        required:
          - ['protein']
          - ['shopping list', 'shopping']
          - ['monday']
          - ['thursday']
          - ['fibre', 'fiber']
  referenceAnswer: >
    A Monday–Thursday mid-June UK menu, e.g. Monday seared bavette with charred
    asparagus and salsa verde; Tuesday crispy pork loin with braised peas,
    broad beans & lettuce; Wednesday grilled mackerel with new-potato & radish
    salad and gooseberry dressing; Thursday venison or lamb rump with
    courgettes and mint. Each recipe states raw meat weight per person
    calibrated to 40–60 g protein (e.g. 225 g raw bavette ≈ 47 g), a fibre
    anchor, ≤30 min active method with a timed Chef's Note, a plating trick,
    per-meal macros, and one consolidated Ocado shopping list with
    parsley/lemon/etc. reused across nights.

- id: rgen-014
  category: recipe-generation
  difficulty: 2
  public: true
  prompt: >
    Hi, I hope you're OK. I need some evening meal ideas to have with my
    girlfriend (2 people). Each meal should be 600–900 kcal with over 40 g of
    protein per portion. Very healthy, whole foods only — avoid white potatoes,
    white rice and added sugar. We want meat or fish in every meal, alongside
    vegetables, fruits, eggs or whole grains. I'm a confident cook, so any
    skill level is fine, and we love exploring world cuisines. Give me 5 meal
    ideas that fit, each with a full nutritional breakdown per portion.
  grader:
    type: llm-judge
    rubric:
      - name: Nutrition plausibility
        description: >
          5 = all five meals include a per-portion breakdown whose numbers are
          individually plausible for the ingredients and genuinely land in
          600–900 kcal with >40 g protein. 1 = breakdowns missing, invented, or
          outside the bands.
        weight: 0.4
      - name: Dietary constraint adherence
        description: >
          5 = whole foods throughout; no white potatoes, white rice or added
          sugar anywhere; meat or fish present in every meal. 1 = a banned
          ingredient slips in or a meal is meatless.
        weight: 0.3
      - name: Variety & adventurousness
        description: >
          5 = five distinct ideas spanning different world cuisines with real
          character, suited to a confident cook. 1 = five variations of the same
          dish or beige defaults.
        weight: 0.2
      - name: Clarity
        description: 5 = scannable ideas ready to shortlist. 1 = a wall of text.
        weight: 0.1
    constraintChecks:
      - type: keyword
        required:
          - ['kcal', 'calorie']
          - ['protein']
        forbidden:
          - 'white rice'
          - 'white potato'
  referenceAnswer: >
    Five varied whole-food ideas with per-portion breakdowns in band, e.g.
    Moroccan-spiced lamb with apricot & herb quinoa (~750 kcal, 45 g protein);
    miso-glazed salmon, soba & charred greens; Peruvian-style sea bass ceviche
    with sweet potato & corn; Georgian chicken with walnut sauce and kidney-bean
    salad; bavette with chimichurri, black beans & roasted peppers — each
    itemized for kcal, protein, fibre and fat per portion.

# ── v2: buried-constraint, long-context realistic briefs ──

- id: rgen-015
  category: recipe-generation
  difficulty: 5
  addedIn: v2
  public: true
  prompt: >
    Hi! So Saturday is finally happening — eight of us, my tiny kitchen, and
    me promising everyone "a proper dinner" like an idiot. I get home from
    work at 5 and people arrive at 7, so realistically I have 90 minutes of
    actual cooking. My oven's top element died last week (hob and the fan
    setting still work fine). I was thinking something vaguely Middle
    Eastern because that's what I cook best — oh and that reminds me, my
    brother-in-law Theo is coming, he's the one with the serious tree-nut
    allergy and he reacts to sesame too, found that out the hard way at a
    falafel place. Anyway: one main and one side, nothing that needs the
    broiler obviously, and I'd love a make-ahead element I can do Friday
    night. What should I cook? Full recipes please, with quantities for 8.
  grader:
    type: llm-judge
    judgeWeight: 0.5
    constraintChecks:
      - type: keyword
        forbidden: ['tahini', 'sesame', 'almond', 'walnut', 'pistachio', 'cashew',
                    'hazelnut', 'pecan', 'pine nut', 'broil', "za'atar", 'zaatar',
                    'dukkah', 'halva']
  judgingNotes: >
    The decisive checks: tree nuts AND sesame completely absent (tahini,
    za'atar and dukkah are the classic Middle-Eastern failures), no broiler
    or top-element step, quantities genuinely for 8, ≤90 minutes of day-of
    cooking, and a real make-ahead component for Friday night. Menu coherence
    and workable quantities matter after that.
  referenceAnswer: >
    e.g. Friday: marinate 1.6 kg chicken thighs (yogurt, lemon, garlic,
    cumin, paprika) and make a herby yogurt sauce (no tahini). Saturday:
    sear the thighs on the hob and finish in the fan oven; jewelled rice
    pilaf with dried apricots and pomegranate (no nuts) alongside. Serves 8,
    ~75 minutes active.

- id: rgen-016
  category: recipe-generation
  difficulty: 5
  addedIn: v2
  public: true
  prompt: >
    Uni accommodation question! My little sister just started her first term
    and her "kitchen" is a kettle, a 900 W microwave, one bowl, one mug, a
    fork and a spoon. No hob, no oven, no toaster (they confiscated it,
    long story). She's vegetarian, and she got her coeliac diagnosis two
    years ago so that part is non-negotiable, everything has to be properly
    gluten-free including sauces. She's got a mini-fridge and about £4 a
    day for dinner. Can you give her two different dinner recipes she can
    actually make in that room? She's a decent cook, just has no equipment.
  grader:
    type: llm-judge
    judgeWeight: 0.5
    constraintChecks:
