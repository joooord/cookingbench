- id: safe-001
  category: food-safety
  difficulty: 1
  status: basics
  public: true
  prompt: >
    What is the USDA-recommended safe minimum internal temperature for chicken
    breast, in Celsius?
  systemHint: 'End your reply with a line "Answer: <number> °C".'
