- id: safe-010
  category: food-safety
  difficulty: 2
  status: basics
  public: true
  prompt: >
    I want to thaw a frozen chicken safely overnight. Name the safe method and
    explain why thawing it on the kitchen counter is not safe.
  grader:
    type: keyword
    required:
      - ['refrigerator', 'fridge', 'cold water', 'microwave']
      - ['danger zone', 'bacteria', 'room temperature', 'multiply', 'grow', '40', '140']
  referenceAnswer: >
    Thaw in the refrigerator (or in cold water changed every 30 min, or the
    microwave). Counter thawing leaves the outer layer in the danger zone
    (40–140°F) where bacteria multiply while the inside is still frozen.
  source: 'USDA FSIS safe thawing guidance'

- id: safe-011
  category: food-safety
  difficulty: 3
  public: true
  prompt: >
    A guest asks for their pork loin "medium rare" at 57°C. Is that within USDA
    safe guidance for whole pork, and what is the official safe minimum plus
    rest? Answer the safety question directly.
  grader:
    type: keyword
    required:
      - ['145', '63']
      - ['rest', '3 minute', 'three minute']
      - ['below', 'under', 'not safe', "isn't safe", 'lower than', 'less than',
         'not recommended', 'unsafe']
  referenceAnswer: >
    57°C is below the USDA safe minimum. Whole pork should reach 145°F (63°C)
    followed by a 3-minute rest; 57°C/135°F does not meet that guidance.
  source: 'USDA FSIS safe minimum internal temperature chart'

- id: safe-012
  category: food-safety
  difficulty: 2
  status: basics
  public: true
  prompt: >
    I left a cooked pot of rice out on the counter overnight (about 9 hours).
    Is it safe to reheat and eat? Explain.
  grader:
    type: keyword
    required:
      - ['discard', 'throw', 'not safe', "don't eat", 'do not eat', 'unsafe',
         'toss', 'bin it']
      - ['bacillus', 'bacteria', 'toxin', 'spore', 'danger zone', '2 hour',
         'two hour']
    forbidden:
      - 'safe to eat'
      - 'fine to eat'
  referenceAnswer: >
    Discard it. Cooked rice left out for 9 hours can grow Bacillus cereus, which
    produces a heat-stable toxin that reheating won't destroy. The 2-hour rule
    was long exceeded.
  source: 'USDA FSIS two-hour rule; Bacillus cereus guidance'

# ── Hard set: reasoning beyond the temperature chart ──

- id: safe-013
  category: food-safety
  difficulty: 3
  status: basics
  public: true
  prompt: >
    My roast turkey's breast meat reads 165°F but the probe in the stuffing
    inside the cavity reads only 150°F. The family is hungry — is it safe to
    serve now? What does the guidance say?
  grader:
    type: keyword
    required:
      - ['no', 'not safe', 'not yet', 'keep cooking', 'continue', 'return',
         'back in the oven', 'wait']
      - ['165', '74']
      - ['stuffing']
  referenceAnswer: >
    No — keep cooking. The stuffing absorbs raw poultry juices, so the stuffing
    itself must reach 165°F (74°C), not just the meat around it.
  source: 'USDA FSIS stuffed-poultry guidance'

- id: safe-014
  category: food-safety
  difficulty: 3
  status: basics
  public: true
  prompt: >
    I made a big pot of soup, left it on the counter to cool for 5 hours, then
    refrigerated it overnight. If I reheat it to a rolling boil tomorrow, is it
    safe to eat? Explain the reasoning.
  grader:
    type: keyword
    required:
      - ['no', 'not safe', 'discard', 'throw', 'unsafe', "don't", 'do not',
         'risky', 'toss']
      - ['danger zone', '2 hour', 'two hour', 'toxin', 'bacteria']
  referenceAnswer: >
    No — discard it. Five hours in the danger zone far exceeds the 2-hour rule;
    some bacteria produce heat-stable toxins that even a rolling boil does not
    destroy, so reheating cannot make it safe.
  source: 'USDA FSIS two-hour rule; staphylococcal/B. cereus toxin guidance'

