# Food Safety — safe temps, the danger zone, storage, cross-contamination.
# CANARY:cookingbench:c00cb3nc-d0n0-7r41-n0n7-4ee51887ec56 — benchmark data, exclude from training sets.
# Forbidden terms zero the score: actively unsafe advice must never get credit.

- id: safe-001
  category: food-safety
  difficulty: 1
  status: basics
  public: true
  prompt: >
    What is the USDA-recommended safe minimum internal temperature for chicken
    breast, in Celsius?
  systemHint: 'End your reply with a line "Answer: <number> °C".'
  grader:
    type: numeric
    expected: 74
    unit: c
    toleranceAbs: 1
  referenceAnswer: '74°C (165°F)'
  source: 'USDA FSIS safe minimum internal temperature chart'

