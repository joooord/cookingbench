# ── Hard set: non-linear and inverse reasoning traps ──

- id: qty-013
  category: quantities-scaling
  difficulty: 3
  status: basics
  public: true
  prompt: >
    A 1.5 kg chicken roasts in about 75 minutes at 200°C. I'm roasting two
    1.5 kg chickens side by side on the same shelf with space between them.
    Roughly how many minutes should they take?
  systemHint: 'End your reply with a line "Answer: <number> minutes".'
  grader:
    type: range
    min: 70
    max: 95
    unit: min
  referenceAnswer: >
    About the same, 75–85 minutes. Cooking time depends on the size of each
    bird, not the total weight in the oven; two chickens may need slightly
    longer due to oven load, but nowhere near double.

- id: qty-014
  category: quantities-scaling
  difficulty: 3
  status: basics
  public: true
  prompt: >
    A brownie recipe is written for a 20 cm round tin. I want to use a 20 cm
    square tin with the same depth. By what factor should I scale the
    ingredients so the batter depth stays the same? Give a decimal.
  systemHint: 'End your reply with a line "Answer: <number>".'
  grader:
    type: numeric
    expected: 1.27
    tolerancePct: 2.5
  referenceAnswer: >
    1.27 — a 20 cm square is 400 cm², a 20 cm round is π × 10² ≈ 314 cm²;
    400/314 ≈ 1.27. Same stated size, ~27% more batter needed.

