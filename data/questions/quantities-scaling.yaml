- id: qty-009
  category: quantities-scaling
  difficulty: 3
  public: true
  prompt: >
    A dough formula in baker's percentages: flour 100%, water 68%, salt 2%,
    yeast 1.2%. I want exactly 1712 g of total dough. How many grams of each
    ingredient?
  systemHint: >
    End your reply with one line per ingredient in the form
    "<ingredient>: <number> g".
  grader:
    type: numeric-multi
    scoring: proportional
    targets:
      - { label: flour, expected: 1000, unit: g, tolerancePct: 1 }
      - { label: water, expected: 680, unit: g, tolerancePct: 1 }
      - { label: salt, expected: 20, unit: g, tolerancePct: 3 }
      - { label: yeast, expected: 12, unit: g, tolerancePct: 5 }
  referenceAnswer: >
    Total percentage is 171.2%, so flour = 1712 / 1.712 = 1000 g, water 680 g,
    salt 20 g, yeast 12 g.

