# ── v2: compound chains (error compounds across steps) and locale traps ──

- id: qty-018
  category: quantities-scaling
  difficulty: 4
  addedIn: v2
  public: true
  prompt: >
    My banana bread recipe serves 6 and calls for 1½ sticks of butter. I'm
    baking for 10 people, and I'm out of butter so I'll use olive oil at the
    standard swap of ¾ the volume of the butter. How many millilitres of
    olive oil do I need?
  systemHint: 'End your reply with a line "Answer: <number> ml".'
  grader:
    type: numeric
    # 1.5 sticks = 12 tbsp = 177.4 ml; ×10/6 = 295.7 ml; ×0.75 = 221.8 ml
    expected: 221.8
    unit: ml
    bands:
      - { tolerancePct: 3, score: 100 }
      - { tolerancePct: 8, score: 60 }
      - { tolerancePct: 15, score: 25 }
  referenceAnswer: >
    1½ sticks = 12 tbsp ≈ 177 ml of butter for 6; scaled ×10/6 ≈ 296 ml;
    olive oil at ¾ volume ≈ 222 ml (a 220 ml rounding is fine).

- id: qty-019
  category: quantities-scaling
  difficulty: 4
  addedIn: v2
  public: true
  prompt: >
    My sourdough formula: 450 g bread flour and 90 g whole-wheat flour, plus
    100 g of ripe levain at 100% hydration (i.e. 50 g flour, 50 g water).
    Total added water besides the levain is 350 g. What is the overall
    hydration percentage, counting the levain's flour and water?
  systemHint: 'End your reply with a line "Answer: <number> %".'
  grader:
    type: numeric
    # water (350+50)=400; flour (450+90+50)=590; 400/590 = 67.8%
    expected: 67.8
    bands:
      - { toleranceAbs: 1, score: 100 }
      - { toleranceAbs: 3, score: 60 }
      - { toleranceAbs: 6, score: 25 }
  referenceAnswer: >
    Flour 450+90+50 = 590 g; water 350+50 = 400 g; 400/590 ≈ 67.8% hydration.
    Ignoring the levain's split (350/540 = 64.8%) is the common slip.

- id: qty-020
  category: quantities-scaling
  difficulty: 4
  addedIn: v2
  public: true
  prompt: >
    My brownie recipe fills an 8-inch square pan and uses 320 g of dark
    chocolate. I want to bake it in a 9×13-inch pan with the brownies just as
    thick as before. How many grams of chocolate do I need?
  systemHint: 'End your reply with a line "Answer: <number> g".'
  grader:
    type: numeric
    # area ratio (9×13)/(8×8) = 117/64 = 1.828 → 585 g
    expected: 585
    unit: g
    bands:
      - { tolerancePct: 3, score: 100 }
      - { tolerancePct: 8, score: 60 }
      - { tolerancePct: 15, score: 25 }
  referenceAnswer: >
    Same thickness means scaling by pan area: (9×13)/(8×8) = 117/64 ≈ 1.83,
    so 320 g × 1.83 ≈ 585 g.

- id: qty-021
  category: quantities-scaling
  difficulty: 4
  addedIn: v2
  public: true
  prompt: >
    A sponge recipe is written for a 20 cm round tin and uses 180 g of caster
    sugar. I only have a 26 cm round tin and want the same cake depth. How
    many grams of sugar should I use?
  systemHint: 'End your reply with a line "Answer: <number> g".'
  grader:
    type: numeric
    # (26/20)² = 1.69 → 304 g (depth equal → scale by area)
    expected: 304
    unit: g
    bands:
      - { tolerancePct: 3, score: 100 }
      - { tolerancePct: 8, score: 60 }
      - { tolerancePct: 15, score: 25 }
  referenceAnswer: >
    Equal depth → scale by area: (26/20)² = 1.69, so 180 g × 1.69 ≈ 304 g.
    Scaling linearly by diameter (234 g) underfills the tin.

