- id: qty-016
  category: quantities-scaling
  difficulty: 3
  status: basics
  public: true
  prompt: >
    Beef burgers lose about 25% of their weight during cooking. I want to serve
    6 cooked patties of 150 g each. How many grams of raw mince do I need?
  systemHint: 'End your reply with a line "Answer: <number> g".'
  grader:
    type: numeric
    expected: 1200
    unit: g
    tolerancePct: 1
  referenceAnswer: >
    1200 g — each cooked 150 g patty needs 150/0.75 = 200 g raw; ×6 = 1200 g.
    (Adding 25% to the cooked weight gives 1125 g, which is wrong.)

