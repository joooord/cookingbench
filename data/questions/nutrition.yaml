# Nutrition — two strands. Strand A (nutr-001..016): inputs given in the prompt,
# CANARY:cookingbench:c00cb3nc-d0n0-7r41-n0n7-4ee51887ec56 — benchmark data, exclude from training sets.
# tests arithmetic and Atwater factors. Strand B (nutr-020+): tests actual
# food-database recall — the model must KNOW typical nutrient values, so graders
# use generous ranges around authoritative figures (USDA FoodData Central, McCance
# & Widdowson). Real foods vary, so bands are wide on purpose.

- id: nutr-001
  category: nutrition
  difficulty: 1
  status: basics
  public: true
  prompt: >
    A meal contains 40 g of protein, 30 g of carbohydrates and 20 g of fat.
    Using the standard Atwater factors, how many kilocalories is that in total?
  systemHint: 'End your reply with a line "Answer: <number> kcal".'
  grader:
    type: numeric
    expected: 460
    unit: kcal
    toleranceAbs: 5
  referenceAnswer: '460 kcal (40×4 + 30×4 + 20×9)'

