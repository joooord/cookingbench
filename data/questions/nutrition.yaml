# Nutrition — calorie and macro math. Deterministic: inputs are given in the
# prompt so the question tests arithmetic and Atwater factors, not food-database recall.

- id: nutr-001
  category: nutrition
  difficulty: 1
  public: true
  prompt: >
    A meal contains 40 g of protein, 30 g of carbohydrates and 20 g of fat.
    Using the standard Atwater factors, how many kilocalories is that in total?
  systemHint: 'End your reply with a line "Answer: <number> kcal".'
  grader:
    type: numeric
    expected: 460
    unit: kcal
    toleranceAbs: 5
  referenceAnswer: '460 kcal (40×4 + 30×4 + 20×9)'

- id: nutr-002
  category: nutrition
  difficulty: 1
  public: true
  prompt: >
    A whole lasagna contains 2,400 kcal and is cut into 6 equal servings. How
    many kilocalories per serving?
  systemHint: 'End your reply with a line "Answer: <number> kcal".'
  grader:
    type: numeric
    expected: 400
    unit: kcal
    toleranceAbs: 1
  referenceAnswer: '400 kcal per serving'

- id: nutr-003
  category: nutrition
  difficulty: 2
  public: true
  prompt: >
    Cooked white rice has about 130 kcal per 100 g. How many kilocalories are
    in a 250 g portion?
  systemHint: 'End your reply with a line "Answer: <number> kcal".'
  grader:
    type: numeric
    expected: 325
    unit: kcal
    toleranceAbs: 5
  referenceAnswer: '325 kcal (130 × 2.5)'

- id: nutr-004
  category: nutrition
  difficulty: 2
  public: true
  prompt: >
    One tablespoon of olive oil weighs about 13.5 g and is essentially 100% fat.
    Roughly how many kilocalories does it contain?
  systemHint: 'End your reply with a line "Answer: <number> kcal".'
  grader:
    type: numeric
    expected: 121.5
    unit: kcal
    toleranceAbs: 8
  referenceAnswer: '≈120 kcal (13.5 g × 9 kcal/g)'

- id: nutr-005
  category: nutrition
  difficulty: 2
  public: true
  prompt: >
    A serving of soup contains 690 mg of sodium. Using the FDA daily value of
    2,300 mg, what percent of the daily value is that?
  systemHint: 'End your reply with a line "Answer: <number> %".'
  grader:
    type: numeric
    expected: 30
    toleranceAbs: 1
  referenceAnswer: '30% DV (690 / 2300)'

- id: nutr-006
  category: nutrition
  difficulty: 1
  public: false
  prompt: >
    A protein powder label says one 40 g scoop provides 12 g of protein. How
    much protein is in 150 g of the powder?
  systemHint: 'End your reply with a line "Answer: <number> g".'
  grader:
    type: numeric
    expected: 45
    unit: g
    toleranceAbs: 1
  referenceAnswer: '45 g (12 × 150/40)'
