  systemHint: 'Give the milk and the cream each in millilitres.'
  grader:
    type: numeric-multi
    scoring: proportional
    targets:
      - { label: milk, expected: 118, unit: ml, toleranceAbs: 12 }
      - { label: cream, expected: 118, unit: ml, toleranceAbs: 12 }
  referenceAnswer: >
    Half-and-half is about 10–12% fat, roughly equal parts whole milk and single
    cream. For 1 US cup (237 ml), combine about 118 ml of whole milk with 118 ml
    of single cream.
