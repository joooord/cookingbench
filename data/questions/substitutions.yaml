    not 3 tablespoons, which would be medicinal.

- id: subs-020
  category: substitutions
  difficulty: 5
  addedIn: v2
  public: true
  prompt: >
    Making my grandmother's beef-and-pork meatballs Sunday for my partner's
    whole family — it's the first time I'm hosting them, so it actually
    matters. Nonna's recipe is beef mince, pork mince, day-old bread soaked
    in milk, a mountain of parmesan, parsley, garlic and two eggs. The
    complication: my partner's father keeps kosher (meat and dairy never mix,
    and no pork at all), and now I remember his sister mentioned her
    sesame allergy when we got gelato. I still want them to taste as close
    to Nonna's as possible. How would you adapt the recipe?
  grader:
    type: llm-judge
    judgeWeight: 0.5
    constraintChecks:
      - type: keyword
        forbidden: ['parmesan', 'pecorino', 'romano', 'sesame', 'tahini']
        required:
          - ['beef', 'veal', 'lamb', 'turkey', 'chicken']
  judgingNotes: >
    Decisive checks: no pork (replace the pork mince), no dairy anywhere
    (the milk-soaked bread AND the parmesan must both be replaced — bread
    soaked in water/stock, umami from anchovy-free sources is fine), no
    sesame, and the answer should preserve the dish's character (e.g.
    nutritional yeast or extra seasoning for the cheese's umami). Bonus
    rigour: kosher meat note. Suggesting "just leave out the cheese" with no
    umami replacement is a missing element.
  referenceAnswer: >
    Replace pork mince with extra beef (or veal/lamb), soak the bread in
    water or chicken stock instead of milk, drop the parmesan and recover
    umami with nutritional yeast or porcini powder plus extra salt, keep
    parsley/garlic/eggs, and check nothing contains sesame. The result stays
    close to Nonna's texture and savouriness while being kosher-style
    (meat, no dairy) and sesame-free.

- id: subs-021
  category: substitutions
  difficulty: 4
  addedIn: v2
  trap: true
  public: true
  prompt: >
    I'm baking my famous vegan chocolate-chip cookies for the school fair —
    they usually rely on coconut oil instead of butter. Just found out one of
    the kids has a coconut allergy on top of the school's dairy-free rule,
    because of course. What should I swap the coconut oil for, and roughly
    how much, if the recipe takes 200 g of it?
  grader:
    type: keyword
    required:
      - ['vegan margarine', 'vegan butter', 'plant-based butter', 'plant butter',
         'vegetable shortening', 'shortening', 'sunflower oil', 'canola', 'rapeseed',
         'vegetable oil', 'olive oil']
      - ['200', 'same amount', 'same weight', '1:1', 'equal', '180']
    # 'coconut' itself can't be forbidden: a correct answer must discuss the
    # allergy ("make sure it's truly coconut-free"). The required groups carry
    # the check; only an explicit coconut-oil recommendation is wrong.
    forbidden:
      - 'use coconut oil'
      - 'stick with coconut oil'
      - 'dairy butter'
      - 'regular butter'
  referenceAnswer: >
    Use a solid plant fat that is not coconut-based: vegan margarine/baking
    block or vegetable shortening, swapped roughly 1:1 (200 g) — check the
    label, since many vegan butters are coconut-oil based. A liquid oil
    (~180 g) works but spreads the cookies thinner. Dairy butter is out
    (school is dairy-free).
