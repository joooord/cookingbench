- id: subs-015
  category: substitutions
  difficulty: 3
  status: basics
  public: true
  prompt: >
    A chocolate cake recipe leavened only with baking soda calls for natural
    cocoa powder, but I only have Dutch-processed cocoa. What is the problem
    with a straight swap, and how do I fix it?
  grader:
    type: keyword
    required:
      - ['acid', 'alkal', 'ph']
      - ['baking powder', 'cream of tartar', 'buttermilk', 'vinegar', 'lemon',
         'add an acid', 'add acid']
  referenceAnswer: >
    Baking soda needs an acid to react, and natural cocoa supplies it.
    Dutch-processed cocoa is alkalized (the acidity is neutralized), so the
    soda won't fully activate — flat cake, soapy taste. Fix: swap the soda for
    baking powder (which carries its own acid), or add an acid such as
    buttermilk, cream of tartar or a little vinegar.

# ── v2: substitution chains, premise traps and buried constraints ──

- id: subs-016
  category: substitutions
  difficulty: 4
  addedIn: v2
  public: true
  prompt: >
    My pancake recipe needs 2 US cups of buttermilk. I'm making the standard
    substitute: milk soured with 1 tablespoon of lemon juice per cup. Since
    the lemon juice takes up volume too, how many millilitres of milk do I
    actually pour before adding the juice?
  systemHint: 'End your reply with a line "Answer: <number> ml".'
  grader:
    type: numeric
    # 2 cups = 473.2 ml total − 2 tbsp (29.6 ml) juice = 443.6 ml milk
    expected: 444
    unit: ml
    bands:
      - { toleranceAbs: 10, score: 100 }
      - { toleranceAbs: 25, score: 60 }
  referenceAnswer: >
    2 US cups = 473 ml total; minus 2 tbsp (≈30 ml) of lemon juice leaves
    ≈443 ml of milk. Pouring the full 473 ml of milk over-thins the batter.

- id: subs-017
  category: substitutions
  difficulty: 4
  addedIn: v2
  public: true
  prompt: >
    A shortbread recipe uses 150 g of butter. I'm substituting refined
    coconut oil, matching the FAT content rather than total weight — butter
    is only about 80% fat (the rest is mostly water), while coconut oil is
    100% fat. How many grams of coconut oil should I use?
  systemHint: 'End your reply with a line "Answer: <number> g".'
  grader:
    type: numeric
    # 150 × 0.80 = 120 g fat → 120 g coconut oil
    expected: 120
    unit: g
    bands:
      - { toleranceAbs: 4, score: 100 }
      - { toleranceAbs: 12, score: 50 }
  referenceAnswer: >
    150 g butter × 80% fat = 120 g of fat, so 120 g of coconut oil.
    Swapping 150 g for 150 g makes shortbread greasy.

- id: subs-018
  category: substitutions
  difficulty: 3
  addedIn: v2
  trap: true
  public: true
  prompt: >
    Halfway through a cake batter I realised I'm out of baking powder. The
    recipe wants 3 teaspoons of it, but baking soda is the same thing under
    a different name, so I'll just spoon in 3 teaspoons of soda. The batter
    has milk, flour, sugar, eggs and vanilla. All good?
  grader:
    type: keyword
    required:
      # Group 0 asks for the refutation: soda and powder are not the same
      # thing, because soda needs an acid the batter does not have.
      #
      # Run 2026-07-v2.1 scored gpt-5.4-mini and grok-4.5 50 here on answers
      # that made exactly that argument. Both wrote "are **not** the same
      # thing" — markdown emphasis inside the phrase, so 'not the same' cannot
      # match across it — and both stated the acid point as "doesn't have
      # enough acid" / "needs enough acid", a quantifier the old list did not
      # anticipate. Hence 'enough acid', which matches either, plus the two
      # answers' other distinctive formulations. Nothing here can be satisfied
      # by an answer that accepts the swap: 'enough acid' is only reachable via
      # a claim about how much acid the batter has, which is the whole point.
      - ['not the same', 'not interchangeable', 'not a substitute', 'much stronger',
         '3 to 4 times', 'three to four times', '3-4 times', '4 times', 'four times',
         'needs an acid', 'requires an acid', 'requires acid', 'without an acid',
         'no acid', 'enough acid', 'complete leavening', 'pure sodium bicarbonate',
         'way too much']
      - ['cream of tartar', 'buttermilk', 'lemon juice', 'vinegar', 'yogurt',
         '1 teaspoon', '¾ teaspoon', '3/4 teaspoon', 'soapy', 'metallic', 'bitter']
  referenceAnswer: >
    They're not the same: soda is 3–4× stronger and needs an acid to react,
    and this batter has none. Three teaspoons of soda would taste soapy and
    metallic. Use ~1 tsp soda plus ~2 tsp cream of tartar (or swap the milk
    for buttermilk), or just use ¾–1 tsp soda with an added acid.
  failingAnswer: >
    Yes, that's fine — they do the same job, so 3 teaspoons of bicarb in place
    of 3 teaspoons of baking powder will give you the same lift. Sift it
    through the flour so it distributes evenly and bake as normal.

- id: subs-019
