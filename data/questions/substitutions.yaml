- id: subs-018
  category: substitutions
  difficulty: 3
  addedIn: v2
  trap: true
  public: true
  prompt: >
    Halfway through a cake batter I realised I'm out of baking powder. The
    recipe wants 3 teaspoons of it, but baking soda is the same thing under
    a different name, so I'll just spoon in 3 teaspoons of soda. The batter
    has milk, flour, sugar, eggs and vanilla. All good?
  grader:
    type: keyword
    required:
      - ['not the same', 'not interchangeable', 'much stronger', '3 to 4 times',
         'three to four times', '3-4 times', '4 times', 'four times', 'needs an acid',
         'requires an acid', 'requires acid', 'without an acid', 'no acid']
      - ['cream of tartar', 'buttermilk', 'lemon juice', 'vinegar', 'yogurt',
         '1 teaspoon', '¾ teaspoon', '3/4 teaspoon', 'soapy', 'metallic', 'bitter']
  referenceAnswer: >
    They're not the same: soda is 3–4× stronger and needs an acid to react,
    and this batter has none. Three teaspoons of soda would taste soapy and
    metallic. Use ~1 tsp soda plus ~2 tsp cream of tartar (or swap the milk
    for buttermilk), or just use ¾–1 tsp soda with an added acid.

