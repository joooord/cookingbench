# ── Hard set: chemistry-aware swaps ──

- id: subs-013
  category: substitutions
  difficulty: 3
  public: true
  prompt: >
    My recipe needs 1 teaspoon of baking soda but I only have baking powder.
    How much baking powder should I use, and what else in the recipe should I
    adjust?
  grader:
    type: keyword
    required:
      - ['3 teaspoon', '3 tsp', 'three teaspoon', '4 teaspoon', '4 tsp',
         '1 tablespoon', '1 tbsp']
      - ['salt']
  referenceAnswer: >
    Use about 3 teaspoons (1 tablespoon) of baking powder per teaspoon of
    baking soda — powder is roughly a third as strong. Also cut back the added
    salt (powder contains sodium) and expect the recipe's acid to go
    un-neutralized, which can subtly change flavour.

