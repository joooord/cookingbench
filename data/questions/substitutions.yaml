    compensate — maybe 3 tablespoons of the dried stuff?
  grader:
    type: keyword
    required:
      - ['other way', 'backwards', 'reverse', 'opposite', 'more concentrated',
         'more potent', 'stronger', 'three times as strong', '3x as strong']
      - ['1/3', '⅓', 'one-third', 'a third', '2 teaspoons', 'two teaspoons', '3:1']
  referenceAnswer: >
    It's the other way round: drying concentrates the herb, so dried rosemary
