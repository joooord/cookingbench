# Substitutions — swaps with correct ratios, allergen-aware alternatives.

- id: subs-001
  category: substitutions
  difficulty: 1
  public: true
  prompt: >
    I'm out of buttermilk and need 1 cup for pancakes. What's the standard
    substitute, with exact quantities and method?
  grader:
    type: keyword
    required:
      - ['lemon juice', 'vinegar']
      - ['1 tablespoon', '1 tbsp', 'one tablespoon']
      - ['milk']
      - ['sit', 'rest', 'stand', 'curdle', '5 minutes', '10 minutes']
  referenceAnswer: >
    Stir 1 tablespoon of lemon juice or white vinegar into 1 cup of milk and
    let it stand 5–10 minutes until slightly curdled.

- id: subs-002
  category: substitutions
  difficulty: 2
  public: true
  prompt: >
    I have baking soda and cream of tartar but no baking powder. How do I make
    the equivalent of 1 teaspoon of baking powder? Give exact quantities.
  grader:
    type: keyword
    required:
      - ['cream of tartar']
      - ['baking soda', 'bicarbonate']
      - ['1/4 tsp', '1/4 teaspoon', '¼ tsp', '¼ teaspoon', 'quarter teaspoon']
      - ['1/2 tsp', '1/2 teaspoon', '½ tsp', '½ teaspoon', 'half teaspoon']
  referenceAnswer: >
    Mix ¼ teaspoon baking soda with ½ teaspoon cream of tartar (1:2 ratio).

- id: subs-003
  category: substitutions
  difficulty: 2
  public: true
  prompt: >
    Suggest a vegan substitute for one egg as a binder in baking, including the
    exact quantities to replace a single egg.
  grader:
    type: keyword
    required:
      - ['flax', 'chia', 'aquafaba', 'applesauce', 'banana', 'egg replacer']
      - ['1 tablespoon', '1 tbsp', '3 tablespoons', '3 tbsp', '¼ cup', '1/4 cup',
         '60 ml', '45 ml', '50 g', '60 g']
  referenceAnswer: >
    A flax egg: 1 tablespoon ground flaxseed mixed with 3 tablespoons water,
    rested ~5 minutes. (Chia egg, 3 tbsp aquafaba, or ¼ cup applesauce also work.)

- id: subs-004
  category: substitutions
  difficulty: 2
  public: true
  prompt: >
    A recipe calls for 1 cup of cake flour but I only have all-purpose flour
    and cornstarch. How do I make the substitute? Give exact quantities.
  grader:
    type: keyword
    required:
      - ['cornstarch', 'corn starch', 'cornflour', 'corn flour']
      - ['2 tablespoons', '2 tbsp', 'two tablespoons']
  referenceAnswer: >
    Measure 1 cup of all-purpose flour, remove 2 tablespoons, and replace them
    with 2 tablespoons of cornstarch; sift together.

- id: subs-005
  category: substitutions
  difficulty: 1
  public: true
  prompt: >
    My guest is coeliac. What do I use instead of regular soy sauce in a
    stir-fry?
  grader:
    type: keyword
    required:
      - ['tamari', 'coconut aminos']
      - ['gluten-free', 'gluten free', 'certified']
  referenceAnswer: >
    Gluten-free tamari (check the label for certification) or coconut aminos.

- id: subs-006
  category: substitutions
  difficulty: 1
  public: false
  prompt: >
    A recipe calls for 1 tablespoon of fresh thyme but I only have dried thyme.
    How much dried thyme should I use?
  grader:
    type: keyword
    required:
      - ['1 teaspoon', '1 tsp', 'one teaspoon', '3:1', '1/3', '⅓', 'a third']
  referenceAnswer: >
    1 teaspoon — dried herbs are roughly 3× as concentrated as fresh, so use a
    third of the fresh amount.

- id: subs-007
  category: substitutions
  difficulty: 2
  public: true
  prompt: >
    I'm out of self-raising flour and need 200 g. I have plain flour and baking
    powder. How do I make the substitute, with quantities?
  grader:
    type: keyword
    required:
      - ['plain flour', 'all-purpose', 'all purpose']
      - ['baking powder']
      - ['2 tsp', '2 teaspoon', 'two teaspoon', '4 tsp', '4 teaspoon']
  referenceAnswer: >
    Use 200 g plain flour plus about 2 teaspoons of baking powder (roughly
    2 tsp per 150–200 g flour); whisk to distribute.

- id: subs-008
  category: substitutions
  difficulty: 1
  public: true
  prompt: >
    A recipe calls for 1 cup of sour cream but I have plain Greek yogurt. Can I
    substitute it, and in what ratio?
  grader:
    type: keyword
    required:
      - ['1:1', 'one to one', 'equal', 'same amount', 'directly', '1 cup',
         'one cup']
  referenceAnswer: >
    Yes — substitute plain Greek yogurt 1:1 for sour cream (1 cup for 1 cup);
    it behaves almost identically in most recipes.

- id: subs-009
  category: substitutions
  difficulty: 2
  public: true
  prompt: >
    I need 1 cup of honey for a recipe but only have granulated sugar. What's
    the substitution, including any liquid adjustment?
  grader:
    type: keyword
    required:
      - ['1 1/4 cup', '1¼ cup', '1.25 cup', 'cup and a quarter']
      - ['liquid', 'water', 'reduce', 'less']
  referenceAnswer: >
    Use about 1¼ cups sugar per cup of honey and add ~¼ cup extra liquid (or
    reduce other liquids), since honey carries moisture.

- id: subs-010
  category: substitutions
  difficulty: 2
  public: true
  prompt: >
    A curry recipe calls for coconut milk but my guest is allergic to coconut.
    Suggest a non-coconut substitute that keeps the dish creamy and dairy-free.
  grader:
    type: keyword
    required:
      - ['cashew', 'oat', 'soy', 'almond', 'silken tofu', 'sunflower']
      - ['cream', 'milk', 'blend', 'puree', 'pureed', 'creamy']
  referenceAnswer: >
    Use a dairy-free alternative such as blended cashew cream, oat cream, or
    unsweetened soy cream; cashew cream best mimics coconut milk's richness.

- id: subs-011
  category: substitutions
  difficulty: 3
  public: true
  prompt: >
    My recipe needs 1 cup of cake flour and I have only bread flour. Is that a
    good swap? If not, explain what would happen and a better fix.
  grader:
    type: keyword
    required:
      - ['no', 'not ideal', "wouldn't", 'avoid', 'not recommended', 'poor swap',
         'tough', 'dense', 'chewy', 'too much gluten', 'higher protein']
      - ['all-purpose', 'all purpose', 'plain flour', 'cornstarch', 'corn starch',
         'cornflour']
  referenceAnswer: >
    Bread flour is the opposite of what you want — its high protein makes cakes
    tough. Better: use all-purpose flour with 2 tbsp per cup replaced by
    cornstarch to mimic cake flour's lower protein.

