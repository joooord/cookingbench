- id: subs-007
  category: substitutions
  difficulty: 2
  public: true
  prompt: >
    I'm out of self-raising flour and need 200 g. I have plain flour and baking
    powder. How do I make the substitute, with quantities?
  grader:
    type: keyword
    required:
      - ['plain flour', 'all-purpose', 'all purpose']
      - ['baking powder']
      # Group 2 is a quantity band expressed as strings, which is what a keyword
      # grader can do and no more. The published list held five exact spellings
      # and scored two right answers 66.7 in run 2026-07-v2.1:
      #   gpt-5.4-mini    "2 level tsp baking powder"  — an intervening
      #                   adjective, so '2 tsp' cannot match
      #   gpt-5.6-terra-pro "2½–2⅔ tsp (about 10–11 g)" — a defensible
      #                   quantity that simply was not enumerated
      # Both are correct; roughly 2–4 tsp per 200 g plain flour is the whole
      # published range (UK ~2 tsp/200 g, US ~1½ tsp/cup ≈ 2.4 tsp/200 g, and
      # some references go to 4). The band below is that range plus the
      # qualifiers cooks actually write, and the gram equivalents, since a
      # grader that only knows one spelling of a right answer is testing
      # phrasing rather than knowledge.
      - ['2 tsp', '2 level tsp', '2 rounded tsp', '2 heaped tsp', '2 teaspoon',
         'two teaspoon', 'two tsp', 'two level tsp',
         '2½', '2 1/2 tsp', '2 1/2 teaspoon', '2.5 tsp', '2.5 teaspoon',
         '2¾', '2 3/4 tsp',
         '3 tsp', '3 level tsp', '3 teaspoon', 'three teaspoon', 'three tsp',
         '4 tsp', '4 level tsp', '4 teaspoon', 'four teaspoon', 'four tsp',
         '8 g', '9 g', '10 g', '11 g', '12 g']
  referenceAnswer: >
    Use 200 g plain flour plus about 2 teaspoons of baking powder (roughly
    2 tsp per 150–200 g flour); whisk to distribute.
  # Right base, wrong raising agent (bicarb has no acid to react with here) and
  # wrong dose. It clears group 0 on purpose: a failing answer that fell over at
  # the first gate would leave groups 1 and 2 untested.
  failingAnswer: >
    Easy — stir 1 teaspoon of bicarbonate of soda into your 200 g of plain
    flour. Self-raising flour is just flour with a raising agent in it, and
    bicarb is the raising agent, so that gets you there.

