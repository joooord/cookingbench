- id: subs-024
  category: substitutions
  difficulty: 4
  addedIn: v3
  public: true
  prompt: >
    A dense chocolate cake uses 3 eggs, which both bind the batter and give it
    lift. I need it fully egg-free (vegan). What do I use, and roughly how much,
    to cover BOTH jobs?
  grader:
    type: llm-judge
    constraintChecks:
      - type: keyword
        required:
          - ['flax', 'aquafaba', 'chia', 'apple sauce', 'applesauce', 'yogurt', 'banana']
          - ['baking powder', 'baking soda', 'bicarb', 'vinegar', 'lemon', 'leaven']
  judgingNotes: >
    The key insight is that eggs do two jobs here — binding/moisture AND leavening
    — and a single one-to-one swap only covers the first. A strong answer splits
    the functions: a binder such as a flax egg (1 tbsp ground flax + 3 tbsp
    water) or aquafaba (~3 tbsp per egg) for structure and moisture, PLUS extra
    chemical lift (about ½–1 tsp baking powder, or ¼ tsp bicarbonate of soda with
    an acid like vinegar or lemon) to replace the leavening. A critical fault is
    recommending only a binder (e.g. "just use 3 flax eggs") and ignoring the
    lost lift, which yields a dense brick.
  referenceAnswer: >
    Split the two jobs. For binding and moisture, replace each egg with a flax
    egg (1 tablespoon ground flaxseed plus 3 tablespoons water, rested until
    gloopy) or about 3 tablespoons of aquafaba — three of them for the 3 eggs.
    Those don't leaven, so also add lift: roughly ½ to 1 teaspoon of baking
    powder, or ¼ teaspoon of bicarbonate of soda plus an acid such as a spoon of
    vinegar or lemon juice. That keeps the crumb from turning into a dense brick.

