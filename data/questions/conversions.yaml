# ── Hard set: unit-identity and chained-conversion traps ──

- id: conv-015
  category: conversions
  difficulty: 3
  public: true
  prompt: >
    An old British cookbook calls for 1 pint of milk. How many millilitres is
    an imperial (UK) pint?
  systemHint: 'End your reply with a line "Answer: <number> ml".'
  grader:
    type: numeric
    expected: 568
    unit: ml
    toleranceAbs: 6
    acceptEquivalentUnits: false
  referenceAnswer: '568 ml — the UK pint, not the 473 ml US pint.'

- id: conv-016
  category: conversions
  difficulty: 3
  public: true
  prompt: >
    A US recipe calls for 8 oz of honey measured BY WEIGHT. Honey's density is
    about 1.42 g/ml. How many millilitres of honey is that?
  systemHint: 'End your reply with a line "Answer: <number> ml".'
  grader:
    type: numeric
    expected: 159.7
    unit: ml
    tolerancePct: 3
    acceptEquivalentUnits: false
  referenceAnswer: >
    ≈160 ml — 8 oz by weight is 226.8 g; 226.8 ÷ 1.42 ≈ 160 ml. Treating it
    as 8 fluid ounces (237 ml) is the trap.

- id: conv-017
  category: conversions
  difficulty: 3
  public: true
  prompt: >
    An Australian recipe says to add 2 tablespoons (Australian standard) of
    fish sauce. How many millilitres is that?
  systemHint: 'End your reply with a line "Answer: <number> ml".'
  grader:
    type: numeric
    expected: 40
    unit: ml
    toleranceAbs: 2
    acceptEquivalentUnits: false
  referenceAnswer: '40 ml — the Australian tablespoon is 20 ml (US/UK is 15 ml).'

- id: conv-018
  category: conversions
