- id: conv-014
  category: conversions
  difficulty: 2
  public: false
  prompt: >
    A European recipe lists 250 g of caster sugar. Roughly how many US cups is
    that, given granulated sugar is about 200 g per cup?
  systemHint: 'End your reply with a line "Answer: <number> cups".'
  grader:
    type: numeric
    expected: 1.25
    unit: cup
    tolerancePct: 8
  referenceAnswer: '≈1.25 cups (250 ÷ 200)'
