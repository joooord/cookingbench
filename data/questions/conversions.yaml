- id: conv-035
  category: conversions
  difficulty: 4
  addedIn: v3
  public: true
  prompt: >
    A German bread recipe calls for one level Esslöffel (the standard 15 ml
    tablespoon) of fine salt per 500 g of flour. I'm using a whole 2 kg bag of
    flour and an Australian tablespoon measure. How many Australian
    tablespoons of salt do I add?
  systemHint: 'End your reply with a line "Answer: <number> tablespoons".'
  grader:
    type: numeric
    # 15 ml x (2000/500) = 60 ml of salt; AU tbsp = 20 ml -> 3 AU tbsp
    expected: 3
    unit: tbsp
    acceptEquivalentUnits: false
    bands:
      - { toleranceAbs: 0.2, score: 100 }
      - { toleranceAbs: 0.6, score: 50 }
  referenceAnswer: >
    2 kg is four times 500 g, so 4 x 15 ml = 60 ml of salt. The Australian
    tablespoon is 20 ml, so 60 / 20 = 3 Australian tablespoons.