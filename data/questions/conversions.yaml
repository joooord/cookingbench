    bands:
      - { toleranceAbs: 0.06, score: 100 }
      - { toleranceAbs: 0.15, score: 50 }
  referenceAnswer: '2 US cups = 473 ml; ÷250 ≈ 1.9 Australian metric cups.'

- id: conv-028
  category: conversions
  difficulty: 4
  addedIn: v2
  public: true
  prompt: >
    My Polish grandmother's recipe calls for "1 szklanka" (the standard
