- id: conv-008
  category: conversions
  difficulty: 2
  public: true
  prompt: >
    Convert a fan (convection) oven setting of 180°C to the equivalent
    conventional oven temperature in Celsius. Fan ovens typically run about
    20°C lower than conventional.
  systemHint: 'End your reply with a line "Answer: <number> °C".'
  grader:
    type: numeric
    expected: 200
    unit: c
    toleranceAbs: 6
    acceptEquivalentUnits: false
  referenceAnswer: '≈200°C conventional (fan setting + ~20°C)'

