  systemHint: 'End your reply with a line "Answer: <number> oz".'
  grader:
    type: numeric
    # 3.333 cups x 120 g = 400 g; 400 / 28.35 = 14.1 oz
    expected: 14.1
    unit: oz
    bands:
      - { toleranceAbs: 0.4, score: 100 }
      - { toleranceAbs: 1.2, score: 50 }
  referenceAnswer: >
    3⅓ x 120 g = 400 g of flour; 400 g ÷ 28.35 g/oz ≈ 14.1 oz.

- id: conv-032
  category: conversions
  difficulty: 4
  addedIn: v3
  public: true
  prompt: >
    A Japanese recipe says 3 gō of uncooked short-grain rice serves 6. I'm
    cooking for 4 and want to weigh the rice instead — my jug has no ml marks.
    Uncooked short-grain rice weighs about 0.85 g/ml. How many grams of rice
    do I need?
  systemHint: 'End your reply with a line "Answer: <number> g".'
  grader:
    type: numeric
    # 1 gō = 180.4 ml; 3 gō = 541.2 ml; x 4/6 = 360.8 ml; x 0.85 = 306.7 g
    expected: 307
    unit: g
    bands:
      - { tolerancePct: 5, score: 100 }
      - { tolerancePct: 12, score: 50 }
  referenceAnswer: >
    A gō is ~180 ml (the rice-cooker cup). 3 gō = 541 ml for 6, so 361 ml for
    4; at 0.85 g/ml that is ≈ 305–310 g.

- id: conv-033
  category: conversions
  difficulty: 4
  addedIn: v3
  public: true
  prompt: >
