# Conversions — volume, weight, temperature across kitchen units and locales.
# CANARY:cookingbench:c00cb3nc-d0n0-7r41-n0n7-4ee51887ec56 — benchmark data, exclude from training sets.

- id: conv-001
  category: conversions
  difficulty: 1
  status: basics
  public: true
  prompt: >
    Convert an oven temperature of 350°F to Celsius. Give the conventional
    (non-fan) oven temperature.
  systemHint: 'End your reply with a line "Answer: <number> °C".'
  grader:
    type: numeric
    expected: 176.7
    unit: c
    # 4 covers the conventional 175–180°C rounding the prompt asks for.
    toleranceAbs: 4
    acceptEquivalentUnits: false
  referenceAnswer: '176.7°C, conventionally rounded to 175–180°C'

