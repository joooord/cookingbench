- id: conv-019
  category: conversions
  difficulty: 3
  status: basics
  public: true
  prompt: >
    A UK recipe says to bake at 160°C in a fan oven. My American oven is
    conventional (no fan) and shows Fahrenheit. What temperature should I set?
  systemHint: 'End your reply with a line "Answer: <number> °F".'
  grader:
    type: numeric
    expected: 356
    unit: f
    toleranceAbs: 10
    acceptEquivalentUnits: false
  referenceAnswer: >
    ≈350–355°F. Two steps: 160°C fan ≈ 180°C conventional, and 180°C = 356°F.
    Converting 160°C directly to 320°F misses the fan adjustment.

# ── v2: chained conversions and locale traps ──

- id: conv-020
  category: conversions
  difficulty: 3
  addedIn: v2
  public: true
  prompt: >
    A British recipe says gas mark 7, but my oven is fan-only. What
    temperature in Celsius should I set the fan oven to?
  systemHint: 'End your reply with a line "Answer: <number> °C".'
  grader:
    type: numeric
    # gas mark 7 = 220°C conventional; fan ≈ −20°C → 200°C
    expected: 200
    unit: c
    acceptEquivalentUnits: false
    bands:
      - { toleranceAbs: 7, score: 100 }
      - { toleranceAbs: 15, score: 50 }
  referenceAnswer: 'Gas mark 7 = 220°C conventional; fan ovens run ~20°C lower → 200°C fan.'

- id: conv-021
  category: conversions
  difficulty: 4
  status: basics
  addedIn: v2
  public: true
  prompt: >
    A French sauce recipe calls for 25 cl of crème fraîche, but my measuring
    spoons are US tablespoons. Roughly how many tablespoons is that?
  systemHint: 'End your reply with a line "Answer: <number> tbsp".'
  grader:
    type: numeric
    # 25 cl = 250 ml; ÷14.79 = 16.9 tbsp
    expected: 16.9
    unit: tbsp
    bands:
      - { toleranceAbs: 0.6, score: 100 }
      - { toleranceAbs: 1.7, score: 60 }
  referenceAnswer: '25 cl = 250 ml; 250 ÷ 14.79 ≈ 17 US tablespoons.'

- id: conv-022
  category: conversions
  difficulty: 3
  status: basics
  addedIn: v2
  public: true
  prompt: >
    A Danish recipe lists 2 dl of cream. My jug is marked in US fluid ounces.
    How many fluid ounces should I pour?
  systemHint: 'End your reply with a line "Answer: <number> fl oz".'
  grader:
    type: numeric
    # 2 dl = 200 ml; ÷29.57 = 6.76 fl oz
    expected: 6.76
    unit: floz
    bands:
      - { toleranceAbs: 0.25, score: 100 }
      - { toleranceAbs: 0.7, score: 60 }
  referenceAnswer: '2 dl = 200 ml; 200 ÷ 29.57 ≈ 6.8 US fl oz.'

- id: conv-023
  category: conversions
  difficulty: 3
  status: basics
  addedIn: v2
  public: true
  prompt: >
    I'm following an Australian Anzac biscuit recipe that calls for 3
    tablespoons of golden syrup, but all I have are US measuring spoons. How
    many US tablespoons should I measure?
  systemHint: 'End your reply with a line "Answer: <number> tbsp".'
  grader:
    type: numeric
    # AU tbsp = 20 ml; 3×20 = 60 ml; ÷14.79 = 4.06 US tbsp
    expected: 4.06
    unit: tbsp
    bands:
      - { toleranceAbs: 0.2, score: 100 }
      - { toleranceAbs: 0.6, score: 50 }
  referenceAnswer: >
    Australian tablespoons are 20 ml (not 15), so 3 AU tbsp = 60 ml ≈ 4 US
    tablespoons (4.06). Answering "3" misses the locale difference.

- id: conv-024
  category: conversions
  difficulty: 4
  addedIn: v2
  public: true
  prompt: >
    An American recipe calls for 1 quart of stock. My British measuring jug
    is marked in (imperial) pints. How many UK pints is 1 US quart?
  systemHint: 'End your reply with a line "Answer: <number> pints".'
  grader:
    type: numeric
    # 946.35 ml ÷ 568.26 ml = 1.67 UK pints
    expected: 1.67
    bands:
      - { toleranceAbs: 0.07, score: 100 }
      - { toleranceAbs: 0.2, score: 50 }
  referenceAnswer: >
    1 US quart = 946 ml; a UK pint is 568 ml, so 946 ÷ 568 ≈ 1.67 UK pints.
    Answering 2 pints treats US and UK pints as the same size.

