- id: conv-029
  category: conversions
  difficulty: 5
  addedIn: v3
  public: true
  prompt: >
    An Australian barbecue-sauce recipe calls for 6 tablespoons (Australian
    standard) of Worcestershire sauce per litre of finished sauce. I'm scaling
    the batch to fill an old imperial quart bottle (2 UK pints), and the only
    measuring spoon I own is a US tablespoon. How many US tablespoons of
    Worcestershire do I need?
  systemHint: 'End your reply with a line "Answer: <number> tablespoons".'
  grader:
    type: numeric
    # 6 AU tbsp = 6 x 20 ml = 120 ml per litre; imperial quart = 2 x 568.3 ml
    # = 1136.5 ml -> 120 x 1.1365 = 136.4 ml; / 14.79 ml (US tbsp) = 9.2
    expected: 9.2
    unit: tbsp
    bands:
      - { toleranceAbs: 0.5, score: 100 }
      - { toleranceAbs: 1.5, score: 50 }
  referenceAnswer: >
    AU tbsp is 20 ml, so 6 tbsp = 120 ml per litre. An imperial quart is
    2 x 568 ml = 1137 ml, needing about 136 ml; at 14.8 ml per US tablespoon
    that is just over 9 US tablespoons (~9.2).

