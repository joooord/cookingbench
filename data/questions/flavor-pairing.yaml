# Flavour Pairing — pairing logic, balance, cuisine coherence. Judge-graded.
# CANARY:cookingbench:c00cb3nc-d0n0-7r41-n0n7-4ee51887ec56 — benchmark data, exclude from training sets.

- id: flav-001
  category: flavor-pairing
  difficulty: 2
  public: true
  prompt: >
    I'm serving a silky butternut squash soup. Design a three-element garnish
    for it and explain how each element balances the dish.
  grader:
    type: llm-judge
    rubric:
      - name: Balance logic
        description: >
          5 = garnish deliberately counters the soup's sweetness and uniform
          texture: an acid or fresh element, a fat or richness accent, and a
          textural crunch — each justified. 1 = three random toppings with no
          reasoning about sweetness/texture.
        weight: 0.5
      - name: Pairing soundness
        description: >
          5 = flavours genuinely complement squash (sage, brown butter, chili,
          toasted seeds, crème fraîche, apple…). 1 = clashing or implausible
          pairings.
        weight: 0.3
      - name: Clarity
        description: 5 = specific quantities/preparations. 1 = vague.
        weight: 0.2
  referenceAnswer: >
    Example: toasted pumpkin seeds (crunch against the purée), a swirl of crème
    fraîche or yogurt (cool fat and gentle acidity against the sweetness), and
    crisp-fried sage or a few drops of chili oil (aromatic lift/heat).

- id: flav-002
  category: flavor-pairing
  difficulty: 1
  public: true
  prompt: >
    My slow-simmered tomato pasta sauce tastes flat and dull, even though it's
    well salted. What single ingredient would you add to fix it, and why does
    that work?
  grader:
    type: llm-judge
    rubric:
      - name: Correct identification
        description: >
          5 = identifies acidity as the missing element (vinegar, lemon, splash
          of wine) — or umami depth (parmesan rind, anchovy, fish sauce) with a
          clear argument why salt alone isn't enough. 1 = suggests just more
          salt, sugar with no rationale, or an irrelevant ingredient.
        weight: 0.6
      - name: Mechanism explanation
        description: >
          5 = explains how acid brightens and defines flavours that long
          simmering muted, or how glutamates add savoury depth. 1 = no why.
        weight: 0.4
  referenceAnswer: >
    A small splash of acid — red wine vinegar or lemon juice — added at the end.
    Long simmering mutes the tomatoes' brightness; acid re-sharpens and defines
    the flavours that salt alone can't lift. (Umami boosters like a parmesan
    rind or anchovy are also strong answers.)

- id: flav-003
  category: flavor-pairing
  difficulty: 1
  public: true
  prompt: >
    I'm making a salad of ripe pears, toasted walnuts and bitter leaves. Which
    cheese would you add, and why does it work with these ingredients?
  grader:
    type: llm-judge
    rubric:
      - name: Pairing soundness
        description: >
          5 = a classic, defensible choice — blue cheese (gorgonzola, roquefort,
          stilton) or aged goat/pecorino — with reasoning. 1 = a clashing choice
          with no rationale.
        weight: 0.5
      - name: Reasoning quality
        description: >
          5 = articulates the contrast: salt and sharp funk against sweet pear,
          creaminess against crisp leaves and tannic walnuts. 1 = "it tastes
          good" with no mechanism.
        weight: 0.5
  referenceAnswer: >
    Blue cheese — gorgonzola or roquefort. Its salt and sharpness cut the pear's
    sweetness, the creamy texture bridges crisp leaves and crunchy walnuts, and
    blue + pear + walnut is a canonical trio.

- id: flav-004
  category: flavor-pairing
  difficulty: 2
  public: true
  prompt: >
    Build a five-spice rub (exactly five spices) for a roasted leg of lamb and
    justify each choice.
  grader:
    type: llm-judge
    rubric:
      - name: Pairing soundness
        description: >
          5 = five spices that genuinely flatter lamb (e.g. cumin, coriander,
          rosemary, garlic, black pepper, smoked paprika, fennel, oregano, mint,
          cinnamon in Middle Eastern direction) forming a coherent flavour
          direction. 1 = incoherent mix or spices that fight lamb.
        weight: 0.4
      - name: Justification quality
        description: >
          5 = each spice gets a reason tied to lamb's rich, slightly gamey
          character. 1 = list with no reasoning.
        weight: 0.4
      - name: Constraint adherence
        description: 5 = exactly five spices. 1 = ignores the count.
        weight: 0.2
  referenceAnswer: >
    Example: cumin (earthy backbone for gamey richness), coriander (citrus lift),
    rosemary (resinous classic with lamb fat), garlic (sweet pungency),
    black pepper (heat that ties it together) — a coherent Mediterranean rub.

- id: flav-005
  category: flavor-pairing
  difficulty: 3
  public: true
  prompt: >
    Why do basil and tomato work so well together? Then suggest one
    unconventional but defensible pairing for basil outside Italian cooking,
    with your reasoning.
  grader:
    type: llm-judge
    rubric:
      - name: Mechanism explanation
        description: >
          5 = real explanation: basil's sweet-anise/peppery aromatics complement
          tomato's acidity and umami; shared/complementary volatile compounds;
          seasonal affinity. 1 = "they're classic" with no why.
        weight: 0.5
      - name: Creative pairing quality
        description: >
          5 = an unconventional pairing with culinary logic (strawberry, peach,
          watermelon, lime/coconut in Thai direction, lemon desserts…). 1 = either
          a cliché (tomato again, pesto) or an indefensible clash.
        weight: 0.5
  referenceAnswer: >
    Basil's sweet, anise-like, lightly peppery volatiles lift tomato's
    acid-umami body — aroma contrast over a shared sweetness. Unconventional but
    sound: basil with strawberries (shared esters, the anise note flatters
    berries) or in a peach sorbet.

- id: flav-006
  category: flavor-pairing
  difficulty: 2
  public: true
  prompt: >
    I'm serving a rich, coconut-heavy Thai green curry as the main course.
    Recommend a dessert to follow it and explain why it's the right call.
  grader:
    type: llm-judge
    rubric:
      - name: Menu logic
        description: >
          5 = recognizes the curry is rich, spicy and coconut-laden, so the
          dessert should be light, cold and acidic/fruity (sorbet, fresh mango,
          citrus granita) — or makes a deliberate, argued case for a regional
          continuation (mango sticky rice) while addressing the richness. 1 =
          heavy cream-on-cream choice with no awareness of the clash.
        weight: 0.6
      - name: Reasoning quality
        description: 5 = explains palate relief, temperature and acidity. 1 = no why.
        weight: 0.4
  referenceAnswer: >
    Something cold, light and acidic: lime or passion-fruit sorbet, or fresh
    mango with lime. After heat and coconut fat, cold acidity resets the palate;
    mango sticky rice is the classic regional choice if portioned small.

- id: flav-007
  category: flavor-pairing
  difficulty: 2
  public: true
  prompt: >
    I've made a rich, fatty braised pork belly. Suggest an acidic accompaniment
    and explain how it balances the dish.
  grader:
    type: llm-judge
    rubric:
      - name: Balance logic
        description: >
          5 = chooses an acidic/pickled/sharp element (pickled vegetables, apple
          slaw, mustard, citrus, quick-pickled onions) and explains how acidity
          cuts the fat and resets the palate. 1 = another rich element or no
          reasoning.
        weight: 0.6
      - name: Pairing soundness
        description: 5 = genuinely pairs with pork belly. 1 = clashing.
        weight: 0.4
  referenceAnswer: >
    Something sharp and acidic — quick-pickled vegetables, a crisp apple slaw, or
    a mustard sauce. The acidity cuts through the rendered fat and resets the
    palate between rich bites.

- id: flav-008
  category: flavor-pairing
  difficulty: 1
  public: true
  prompt: >
    My dark chocolate dessert tastes one-dimensional. Name a single pantry
    ingredient (not sugar) that would deepen and round out the chocolate flavour,
    and explain why.
  grader:
    type: llm-judge
    rubric:
      - name: Correct identification
        description: >
          5 = salt, coffee/espresso, or vanilla — with a clear reason (salt
          suppresses bitterness and lifts perceived sweetness; coffee amplifies
          cocoa notes). 1 = irrelevant or sugar.
        weight: 0.6
      - name: Mechanism explanation
        description: 5 = explains the perceptual mechanism. 1 = none.
        weight: 0.4
  referenceAnswer: >
    A pinch of salt — it suppresses bitterness and heightens perceived sweetness
    and chocolate aroma. (A little instant espresso, which amplifies cocoa notes,
    is an equally strong answer.)

- id: flav-009
  category: flavor-pairing
  difficulty: 2
  public: true
  prompt: >
    I'm building a cheese board with one soft, one hard, and one blue cheese.
    Recommend a fruit, a preserve, and a crunchy element, and justify how they
    play against the cheeses.
  grader:
    type: llm-judge
    rubric:
      - name: Pairing soundness
        description: >
          5 = classic, defensible accompaniments (grapes/figs/apple; fig jam,
          honey, quince; walnuts, crackers, candied nuts) matched thoughtfully to
          the cheese styles. 1 = random or clashing.
        weight: 0.5
      - name: Reasoning quality
        description: >
          5 = explains sweet/salty contrast, acidity, and texture against creamy
          vs firm vs pungent cheese. 1 = a list with no logic.
        weight: 0.5
  referenceAnswer: >
    Fresh figs or grapes (sweet acidity against the blue's salt and the soft
    cheese's cream), fig jam or honey (sweetness to tame the blue), and walnuts
    or seeded crackers (tannic crunch against creamy textures).

- id: flav-010
  category: flavor-pairing
  difficulty: 3
  public: true
  prompt: >
    Explain the principle behind pairing fatty, oily fish like mackerel with
    sharp ingredients such as gooseberry, rhubarb or lemon. Then name one more
    pairing that follows the same principle.
  grader:
    type: llm-judge
    rubric:
      - name: Principle explanation
        description: >
          5 = articulates that high acidity cuts and balances the rich oils and
          cleanses the palate (and can tame fishiness). 1 = no real principle.
        weight: 0.5
      - name: Consistent new pairing
        description: >
          5 = offers another oily-fish-plus-acid or rich-plus-acid pairing that
          follows the same logic (e.g. sardines + tomato/lemon, salmon + dill-
          lemon, herring + pickles). 1 = unrelated or contradictory.
        weight: 0.5
  referenceAnswer: >
    Oily fish is rich; high-acid partners cut through the fat, refresh the palate
    and balance any strong fishy notes. Same principle: sardines with tomato and
    lemon, or herring with sharp pickles.

- id: flav-011
  category: flavor-pairing
  difficulty: 2
  public: true
  prompt: >
    A vegetable soup I made is one-note and bland despite seasoning with salt.
    Beyond salt, name three different levers (not specific ingredients but
    categories of flavour) I could pull to add depth, with an example of each.
  grader:
    type: llm-judge
    rubric:
      - name: Coverage of levers
        description: >
          5 = names distinct categories such as acid (lemon/vinegar), umami
          (miso/parmesan/soy/tomato), and aromatics/heat or fat/richness or
          browning (caramelize the onions), each with an example. 1 = repeats one
          lever or just "add herbs".
        weight: 0.6
      - name: Soundness
        description: 5 = each lever genuinely adds depth and the examples fit. 1 = off.
        weight: 0.4
  referenceAnswer: >
    Acid (a squeeze of lemon or splash of vinegar to brighten), umami (miso, soy,
    parmesan rind or tomato paste for savoury depth), and browning/aromatics
    (caramelize the onions, bloom spices, or finish with fresh herbs and good oil).

- id: flav-012
  category: flavor-pairing
  difficulty: 1
  public: true
  prompt: >
    What classic herb pairs with lamb, and why is it such a reliable match?
  grader:
    type: llm-judge
    rubric:
      - name: Correct pairing
        description: >
          5 = rosemary (or mint) with a reason. 1 = a herb that fights lamb or no
          reasoning.
        weight: 0.6
      - name: Reasoning quality
        description: >
          5 = explains how the resinous/piney aromatics cut and complement lamb's
          rich, gamey fat. 1 = "it just works".
        weight: 0.4
  referenceAnswer: >
    Rosemary — its piney, resinous aromatics stand up to and cut through lamb's
    rich, slightly gamey fat. Mint (as a sharp sauce) works on the same logic.

# ── v2: buried-constraint pairing and flavour numbers ──

- id: flav-013
  category: flavor-pairing
  difficulty: 4
  addedIn: v2
  public: true
  prompt: >
    Putting together a cheese board for Friday — we're finally opening the
    vintage port my brother brought back from Porto. There'll be six of us:
    me, my partner, my brother and his wife (she's about five months
    pregnant now, so exciting!), and two friends from work who eat
    everything. I want maybe four cheeses that genuinely sing with port,
    plus accompaniments. What should I buy?
  grader:
    type: llm-judge
    judgeWeight: 0.5
    constraintChecks:
      - type: keyword
        forbidden: ['brie', 'camembert', 'gorgonzola', 'roquefort', 'taleggio',
                    'unpasteurised', 'unpasteurized', 'raw milk', 'raw-milk']
        required:
          - ['pasteuris', 'pasteuriz', 'pregnan']
  judgingNotes: >
    The buried constraint: a pregnant guest. Soft mould-ripened cheeses
    (brie, camembert), soft blues and anything unpasteurised are NHS-listed
    risks in pregnancy — the classic port pairing (Stilton) is itself a
    soft-ish blue, so a strong answer either notes hard pasteurised options
    for her (aged cheddar, gouda, manchego, parmesan-style) or explicitly
    flags which board items she should skip. Pairing quality with port still
    matters: aged/hard, salty-sweet logic, dried fruit, walnuts fine.
  referenceAnswer: >
    Port-friendly board built around hard, pasteurised cheeses: aged cheddar,
    aged gouda, manchego and a parmesan-style hard cheese, with quince paste,
    dried figs and oat crackers. Flag for the pregnant guest: skip soft
    mould-ripened and unpasteurised cheeses; if Stilton appears for the
    others, label it clearly.
  source: 'NHS guidance on cheese in pregnancy'

- id: flav-014
  category: flavor-pairing
  difficulty: 4
  addedIn: v2
  public: true
  prompt: >
    My best mate is hosting taco night and asked me to bring my "famous"
    taco seasoning. Last time half of us were crying from my habanero blend
    — brilliant night. Anyway, his new girlfriend is coming and apparently
    she genuinely cannot handle ANY heat at all, like zero chilli, gets
    actual stomach pain. He still wants the seasoning to taste big and
    Mexican, not bland. What blend should I make?
  # Was a pure keyword item and was the worst grader in the dataset: mean 33.3,
  # sd 45.4, discrimination −9.5, nine of fourteen models zeroed in run
  # 2026-07-v2.1 — including the best answer in the set. Three separate
  # authoring faults, two of them fatal to the keyword approach:
  #
  # 1. 'habanero' was forbidden and appears in the PROMPT. The user's own
  #    habanero blend is part of the scenario, so the correct answer — keep
  #    your blend, serve it separately, don't share the grinder, trace
  #    capsaicin is enough to hurt her — names it by necessity. It zeroed
  #    fable-5, opus-5, sonnet-5, gemini-3.6-flash, sol-pro and terra-pro.
  # 2. 'hot sauce' was forbidden. Putting hot sauce on the table for the other
  #    guests is correct hospitality; the constraint is on the blend.
  # 3. The paprika group forced a capsicum into the answer, so deepseek-v4-pro
  #    scored 66.7 for the MOST cautious blend in the run — annatto, smoked
  #    salt and tomato for colour and smoke, no capsicum at all — which is the
  #    right call for someone who reacts to the fruit and not just the heat.
  #
  # The deeper problem is that 'cayenne' and 'chili powder' cannot be forbidden
  # terms here at all. A correct answer must be able to say "supermarket chili
  # powder almost always contains cayenne — buy single spices and mix them
  # yourself", and kimi-k3's version of that warning ("some blends sneak in
  # cayenne") carries no negation cue whatsoever, so no matcher improvement can
  # rescue it. Recommending an ingredient and warning against it are the same
  # string. That is the case CLAUDE.md names for moving an item to llm-judge.
  #
  # What stays deterministic is what keywords can actually decide: the positive
  # ingredients, and a recipe line that puts a quantity in front of a chilli,
  # which is only ever a use and never a warning.
  grader:
    type: llm-judge
    rubric:
      - name: Heat constraint
        description: >
          5 = the blend carries no capsaicin at all, and the answer knows the
          difference between capsicum and capsaicin — sweet or smoked paprika
          used and flagged as capsaicin-free, or dropped entirely for a guest
          who may react to the fruit. 1 = chilli heat in the blend, including
          heat smuggled in as "mild", "just a pinch" or supermarket chili
          powder.
        weight: 0.45
      - name: Flavour construction
        description: >
          5 = real Mexican depth without heat: toasted cumin and coriander,
          Mexican oregano, garlic and onion powder, annatto/achiote or tomato
          for colour, cocoa or cinnamon for roundness, smoke from smoked
          paprika or smoked salt, lime to finish, and blooming the blend in
          fat. 1 = a thin list, or "just leave the chilli out".
        weight: 0.35
      - name: Guest safety and the rest of the table
        description: >
          5 = keeps her exposure at zero and still feeds everyone else — warns
          that shop-bought taco packets and "chili powder" contain chilli, and
          serves the heat separately (shaker, side bowl, separate spoon, no
          shared grinder or pan). 1 = ignores cross-contamination, or makes one
          compromise blend for the whole table.
        weight: 0.2
    # The distinction the keyword grader could not draw, stated for the judge so
    # it does not re-import the same fault.
    constraintChecks:
      - type: keyword
        required:
          - ['cumin']
          - ['oregano', 'coriander', 'garlic', 'onion powder', 'lime', 'cocoa',
             'annatto', 'achiote', 'cinnamon', 'allspice']
          # Colour and smoke without capsaicin. A fully capsicum-free build is a
          # better answer than a paprika one, not a worse one, so its
          # ingredients belong in the same group.
          - ['smoked paprika', 'sweet paprika', 'mild paprika', 'pimentón dulce',
             'annatto', 'achiote', 'tomato powder', 'smoked salt', 'liquid smoke',
             'dried mushroom', 'porcini']
        # A quantity immediately before a chilli is a recipe line. No warning is
        # ever written "1 tsp cayenne", so these catch a blatant violation
        # without punishing the answer that names cayenne to rule it out. This
        # is a backstop, not the constraint: the judge owns the constraint,
        # because an ingredient list can be laid out in ways this cannot see.
        forbidden:
          - 'tsp cayenne'
          - 'tsp of cayenne'
          - 'teaspoon cayenne'
          - 'teaspoons cayenne'
          - 'tbsp cayenne'
          - 'tablespoon cayenne'
          - 'tablespoons cayenne'
          - 'tsp chilli powder'
          - 'tsp chili powder'
          - 'tbsp chilli powder'
          - 'tbsp chili powder'
          - 'teaspoon chilli powder'
          - 'teaspoon chili powder'
          - 'teaspoons chilli powder'
          - 'teaspoons chili powder'
          - 'tablespoon chilli powder'
          - 'tablespoon chili powder'
          - 'tablespoons chilli powder'
          - 'tablespoons chili powder'
          - 'tsp chipotle'
          - 'tbsp chipotle'
          - 'teaspoon chipotle'
          - 'tablespoon chipotle'
          - 'tsp chilli flakes'
          - 'tsp chili flakes'
          - 'tsp red pepper flakes'
          - 'tbsp chilli flakes'
          - 'tbsp chili flakes'
          - 'tbsp red pepper flakes'
          - 'tsp hot paprika'
          - 'tsp habanero'
          - 'tbsp habanero'
  judgingNotes: >
    Naming cayenne, chipotle, habanero or shop-bought "chili powder" in order
    to warn the cook away from them is correct and must never be scored as
    using them — only an ingredient given a quantity in the blend counts as
    used. The user's own habanero blend is in the prompt; advising that it be
    kept, made separately and served on the side, with no shared grinder or
    pan, is the right answer and not a constraint violation. Sweet and smoked
    paprika are capsicum-derived but essentially capsaicin-free, so using them
    is defensible; so is avoiding all capsicum for a guest who may react to the
    fruit rather than the heat. Do not require both readings.
  referenceAnswer: >
    Build depth without capsaicin: cumin, smoked sweet paprika (capsaicin-
    free), Mexican oregano, garlic and onion powder, ground coriander, a
    pinch of cinnamon or cocoa for roundness, salt, and finish with lime
    zest. All chilli-derived heat (cayenne, chipotle, flakes, hot sauce)
    stays out. Make your habanero blend separately for everyone else and keep
    it off her spoon — trace capsaicin is enough.
  # Deliberately built to satisfy every required group — cumin, garlic powder,
  # oregano, smoked paprika are all there — so the only thing standing between
  # it and 100 is the quantity-anchored forbidden list. If that list is ever
  # weakened this answer jumps to 100 and `bench validate` blocks the commit,
  # which is the alarm this pairing exists to raise.
  failingAnswer: >
    Keep it simple: 2 tbsp ground cumin, 1 tbsp garlic powder, 1 tbsp onion
    powder, 1 tbsp dried oregano, 2 tsp chilli powder, 1 tsp cayenne, 1 tsp
    hot smoked paprika and salt. That is gentle enough that nobody will really
    notice, and a little heat is what makes it taste Mexican.

- id: flav-015
  category: flavor-pairing
  difficulty: 3
  addedIn: v2
  public: true
  prompt: >
    How many grams of salt per litre of pasta-cooking water hits the
    "well-seasoned, tastes like broth" level most chefs aim for?
  systemHint: 'End your reply with a line "Answer: <number> g".'
  grader:
    type: numeric
    # ~1% — 10 g/L (the old "sea water" 35 g/L is far too much)
    expected: 10
    unit: g
    bands:
      - { toleranceAbs: 3, score: 100 }
      - { toleranceAbs: 7, score: 50 }
  referenceAnswer: >
    ≈10 g per litre (about 1%). Literal seawater salinity (35 g/L) is the
    overshoot the cliché suggests.

- id: flav-016
  category: flavor-pairing
  difficulty: 3
  addedIn: v2
  public: true
  prompt: >
    For a classic French vinaigrette, how many parts oil per 1 part vinegar?
  systemHint: 'End your reply with a line "Answer: <number>".'
  grader:
    type: numeric
    expected: 3
    bands:
      - { toleranceAbs: 0.5, score: 100 }
      - { toleranceAbs: 1, score: 50 }
  referenceAnswer: 'The classic ratio is 3 parts oil to 1 part vinegar.'
