# CookingBench model roster.
# ids are OpenRouter slugs. IMPORTANT: run `pnpm bench models --check` before a
# paid run — it validates every slug against the live OpenRouter catalog and
# flags newly released flagship-class models worth adding.
# Same-family pairs (e.g. Fable 5 vs Opus 4.8) are deliberate: version-regression
# comparison is a headline feature of this benchmark.
#
# ---------------------------------------------------------------------------
# Two identity fields, and they are NOT the same thing (JUDGE-001)
# ---------------------------------------------------------------------------
#
# `family` is a MARKETING TIER — where the lab positions the model. It is what
# the version-regression pairs are drawn from. `claude-frontier` covers Fable 5,
# Opus 4.8 and Opus 5: three different models. Seating read this field as a
# base-model identity until WP-0, which meant the judge-conflict rule was
# comparing tiers and its cross-provider arm could never fire.
#
# `baseModel` is the UNDERLYING TRAINED MODEL — what actually answers, as
# opposed to `id`, which only says where the request is routed. Two entries
# carry the same `baseModel` only when they are the same model underneath. A
# rebadge — one vendor serving another's weights — keeps its own reseller slug
# in `id` and names the originator here; that divergence is the entire reason
# the field exists, because neither the slug prefix nor the tier can see it.
#
# How the values below were established, and the bar for adding one:
#
#   1. The entry names a real served model. Evidence: the id appears as a
#      candidate or judge route in a preserved run artifact under data/runs/.
#      Slugs rot and v1 shipped six wrong guesses, so an unexecuted slug is a
#      hypothesis about a model, not a model.
#   2. It is served by the lab that trained it. Evidence: the OpenRouter vendor
#      prefix matches the declared provider, so there is no reseller in the
#      chain that could be hiding a different base.
#
# Both hold → the base model is that model's own published identity. Either
# fails → `unknown`, which every reader must treat as NO identity, so the
# conflict rule refuses to seat it in either direction. Failing closed on an
# honest unknown is correct. Inventing a lineage is not: do not derive this
# field from a name that looks similar.
#
# Nothing in this repository establishes that any two entries below share a
# base model, so none of them do. That split is safe here and would not be
# everywhere: an over-fine split is fail-OPEN in general (two entries that
# really are one model would be seated against each other), and it is harmless
# only because every entry below is first-party, so any pair that could
# plausibly share weights also shares a provider — and the provider arm of the
# rule conflicts them regardless. The day a reseller entry appears, its
# `baseModel` is the only thing standing between it and grading itself.
#
# `unknown` on an ACTIVE model means that model cannot be judged and cannot
# judge — every seat conflicts with it. Establish the identity before flipping
# `active: true`; there is a test that says so.

