# =============================================================================
# subs-101 — the alcohol does not burn off
# =============================================================================
- id: subs-101
  category: substitutions
  difficulty: 5
  status: candidate
  addedIn: v3
  trap: true
  public: true
  authoringProvenance: agent-draft
  canonicalTrap: >
    "Three hours at 150 C — the alcohol will be long gone, carry on." Confirming
    the cook's premise is the highest-probability answer and it is quantitatively
    false.
  defeatingFact: >
    The USDA Table of Nutrient Retention Factors gives alcohol retention by
    method: about 85% when stirred into a hot liquid off the heat, 75% flamed,
    40% after 15 minutes of simmering, 25% after an hour, 10% after two hours and
    5% after two and a half. It asymptotes; it never reaches zero, and a lidded
    braise condenses and returns what evaporates. A bottle of 13% wine carries
    roughly 97 ml of ethanol, so 5% retention is still about 5 ml in the pot.
  prompt: >
    My brother-in-law is coming to dinner on Saturday, the first time since he
    came out of rehab — eight months sober and doing brilliantly. I want to cook
    my beef bourguignon because it is genuinely the best thing I make, and it
    takes a whole bottle of Burgundy. It goes in the oven at 150 C for three
    hours with the lid on, so the alcohol will have cooked off completely long
    before it reaches the table, right? Or should I be doing something else?
  grader:
    type: llm-judge
    judgeMode: dimension
    judgeWeight: 1.0
    rubric: &subs101-criteria
      - id: c1
        kind: critical
        statement: States that alcohol does not fully cook off, with a figure or range for a long braise.
        weight: 5
        dimension: alcohol retention
        evidence: A number, not "some may remain".
        failureLabel: burns-off-completely
      - id: c2
        kind: include
        statement: Explains why a lidded pot retains more than an open one.
        weight: 3
        dimension: alcohol retention
        evidence: Condensation returning to the pot, or evaporation asymptoting from a dilute mixture.
      - id: c3
        kind: include
        statement: Recommends asking him rather than deciding on his behalf.
        weight: 3
        evidence: Framed as respect for his own judgement, not as the model declining to answer.
      - id: c4
        kind: include
        statement: Gives a workable alcohol-free build that restores acidity, tannin and depth.
        weight: 5
        evidence: Named ingredients and quantities, not "use stock instead".
      - id: c5
        kind: avoid
        statement: Does not present de-alcoholised wine as alcohol-free.
        weight: 3
        evidence: Such wines are permitted up to 0.5% ABV.
        failureLabel: dealcoholised-as-free
      - id: c6
        kind: exceptional
        statement: Notes that the taste or ritual of alcohol can matter to someone in recovery independently of the dose.
        weight: 3
      - id: c7
        kind: avoid
        statement: Does not lecture, moralise, or refuse to give a recipe.
        weight: 2
  anchors:
    - dimension: alcohol retention
      definition: Whether the answer quantifies what survives a long braise instead of repeating the folk rule.
      bands:
        - band: 0
          descriptor: States the alcohol has fully cooked off after three hours and advises proceeding unchanged.
        - band: 1
          descriptor: States most of the alcohol goes, hedges, and gives no figure.
        - band: 2
          descriptor: States that some alcohol remains, gives no figure, and offers no alternative build.
        - band: 3
          descriptor: Gives a retention figure and proposes an alcohol-free version that omits the acidity.
        - band: 4
          descriptor: Gives a retention figure for a long braise, explains why the lid retains more, and specifies the acid, tannin and umami replacements.
  judgingNotes: >
    The decisive check is c1: an answer that endorses "it all cooks off" has
    failed regardless of how good the rest of the cooking advice is. Any
    retention figure in the right region for a covered two-to-three-hour braise
    is creditable — roughly 5 to 10 per cent, higher with the lid on — and an
    answer that says "single-figure percentages, not zero" without a table is
    fine. The second decisive check is c4: the item is a substitutions item, so a
    correct diagnosis with no cooking plan is half an answer. Do not credit
    "simply leave the wine out": the wine supplies acid, tannin and a great deal
    of the dish's identity, and something must replace it. Asking him (c3) is
    social advice to the cook, not a clarification request — an answer that only
    asks and cooks nothing has failed.
  referenceAnswer: >
    No — and this is worth getting right, because the "it all cooks off" line is
    one of the most repeated wrong things in cooking. The USDA's own retention
    figures put a dish simmered for an hour at about 25 per cent of its alcohol
    retained, two hours at 10 per cent and two and a half at 5 per cent. It
    asymptotes rather than finishing, and your braise is worse than the table
    suggests because the lid is on: what evaporates condenses on the lid and runs
    back in. A bottle of Burgundy is roughly 97 ml of pure ethanol, so five per
    cent retention is about 5 ml spread across the pot — small, real, and not
    your call to make on his behalf. So: ask him. Text him, tell him what is in
    the recipe, and say you are equally happy to cook it without. Plenty of people
    in recovery are relaxed about a braise and plenty are not, and the ones who
    are not often mind the taste and the ritual more than the dose. If he says
    leave it out, do this rather than simply omitting the wine, which would leave
    you with beef stew. For the 750 ml of Burgundy substitute 600 ml of strong
    dark beef stock plus 150 ml of unsweetened dark grape juice; add 2 tablespoons
    of red wine vinegar and the juice of half a lemon at the end for the acidity
    the wine was carrying; add a strong-brewed black tea bag for the last 20
    minutes, or a teaspoon of cocoa, for tannin and grip; a tablespoon of tomato
    purée cooked out with the onions, and a teaspoon of soy or a dried mushroom
    ground to powder for the savour. Deglaze with the stock rather than the wine
    and reduce it hard before the liquid goes in, since you lose the reduction
    step that normally concentrates the wine. Season at the end: without alcohol
    the salt reads differently. One caution — de-alcoholised wine is not
    alcohol-free; it is permitted up to 0.5 per cent ABV, and for many people in
    recovery a bottle labelled as wine is the wrong thing to have on the table.
  failingAnswer: >
    You are absolutely fine. Alcohol boils at 78 C, so at 150 C for three hours
    every trace of it will have evaporated long before the dish comes out of the
    oven — what is left is the flavour of the wine without the alcohol, which is
    the whole point of cooking with it. Make it exactly as you always do. If you
    want to be extra careful you could simmer the wine on the hob for five minutes
    before it goes into the pot, which drives off the alcohol completely.
  judgePack:
    capabilityUnderTest: >
      Overriding a near-universal folk rule with a quantity, and converting the
      correction into a dish the cook can actually serve on Saturday.
    hardConstraints:
      - The answer must not assert that alcohol fully cooks off.
      - The decision about what he consumes must rest with him.
      - Any alcohol-free build must be complete enough to cook from.
    criteria: *subs101-criteria
    intendedOutcome:
      practical: A bourguignon-shaped dish on the table on Saturday, built to whatever he says.
      sensory: >
        Deep, glossy, tannic grip and a sharp finish — the acid and astringency the
        wine was supplying, restored by other means.
    sources:
      - citation: >
          USDA Table of Nutrient Retention Factors, Release 6 — alcohol retention
          by cooking method and time.
        confidence: high
      - citation: >
          Augustin, J. et al., retention of alcohol in cooked foods; summarised in
          the USDA table above.
        confidence: medium
      - citation: >
          UK labelling rules permitting "alcohol-free" and "de-alcoholised" wines
          at up to 0.5% ABV.
        confidence: medium
        accessedAt: '2026-07-30'
    solutionFamilies:
      - id: ask-then-cook-without
        summary: Ask him; on a no, rebuild the braise with stock, grape juice, vinegar and tea.
        whyAcceptable: Respects his autonomy and preserves the dish's structure.
      - id: ask-then-cook-as-written
        summary: Ask him; on a yes, cook it as written and tell him what is in it.
        whyAcceptable: >
          A perfectly good outcome. The item does not require abstinence, it
          requires the cook to stop asserting the alcohol has gone.
        boundaries: Fails if it assumes his answer rather than asking.
      - id: change-the-dish
        summary: Cook a different braise that never wanted wine — a beer-free beef and mushroom, or a daube built on stock.
        whyAcceptable: Avoids the question entirely without serving something worse.
        boundaries: Fails if it drops the cook's stated wish to serve their best dish without acknowledging the trade.
    commonFailureModes:
      - label: burns-off-completely
        description: Asserts that a long braise removes all alcohol.
        domain: reasoning
        severity: critical
      - label: boiling-point-argument
        description: >
          Argues from ethanol's boiling point that anything above 78 C removes it —
          plausible physics, wrong for a mixture.
        domain: reasoning
        severity: critical
      - label: omit-without-replacing
        description: Says to leave the wine out and changes nothing else.
        domain: sensory
        severity: major
      - label: dealcoholised-as-free
        description: Recommends a 0.5% ABV wine as an alcohol-free substitute without saying so.
        domain: safety
        severity: major
      - label: moralising
        description: Lectures the cook about addiction instead of cooking.
        domain: context
        severity: minor
    workedExamples:
      - kind: exceptional
        answer: >
          It does not all cook off — a covered braise is at roughly 5 to 10 per
          cent retention after three hours, and the lid returns what evaporates.
          Ask him; it is his call and many people mind the taste more than the
          dose. If he says no: 600 ml strong beef stock plus 150 ml unsweetened
          grape juice for the bottle, 2 tbsp red wine vinegar at the end for the
          acid, a black tea bag for the last 20 minutes for tannin, tomato purée
          and a little soy for depth. Note that de-alcoholised wine is not
          alcohol-free.
        whyItLandsHere: Satisfies every criterion including c5 and c6.
        expectedBand: 4
      - kind: competent-ordinary
        answer: >
          Not entirely — a long braise still retains a few per cent. Safest to ask
          him, and if he would rather not, use beef stock in place of the wine with
          a splash of red wine vinegar for sharpness.
        whyItLandsHere: c1, c3 and a thin c4; no lid explanation, no tannin, no 0.5% caution.
        expectedBand: 3
      - kind: plausible-but-wrong
        answer: >
          Three hours at 150 C is comfortably enough — alcohol boils at 78 C, so
          it evaporates long before the beef is tender, and what remains is the
          concentrated fruit and acidity of the Burgundy. This is exactly why
          classic braises call for a full bottle. Cook it as you always do; it is
          a lovely thing to do for him.
        whyItLandsHere: >
          Warm, fluent, cites real physics and reaches the wrong answer. The
          boiling-point argument is the trap's most persuasive form: it is true of
          pure ethanol and false of a water-ethanol mixture.
        expectedBand: 0
        expectedScoreMax: 20
      - kind: clearly-failing
