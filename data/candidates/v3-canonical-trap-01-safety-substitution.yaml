# =============================================================================
# subs-102 — the conversion chart that does not know what creaming is
# =============================================================================
- id: subs-102
  category: substitutions
  difficulty: 4
  status: candidate
  addedIn: v3
  trap: true
  public: true
  authoringProvenance: agent-draft
  canonicalTrap: >
    Apply the chart: three-quarters the volume of maple syrup, reduce the liquid,
    add a quarter-teaspoon of bicarbonate of soda, drop the oven by 15 C. Every
    substitution table says this, it is correct for muffins and quick breads, and
    it destroys a creamed sponge.
  defeatingFact: >
    Creaming works mechanically: the hard, sharp-edged sucrose crystals are
    dragged through the butter and shear air cells into it, and those cells are
    the cake's leavening. A liquid sweetener has no crystals, so it cannot cream —
    the loss is the aeration mechanism, not just the sweetness. Maple syrup is
    also about a third water and its fructose browns at a lower temperature than
    sucrose.
  prompt: >
    Trying to cut refined sugar out of my baking. My standard Victoria sponge is
    225 g each of butter, caster sugar, self-raising flour and egg — cream the
    butter and sugar, beat the eggs in, fold the flour through, two tins, 20
    minutes. I want to use maple syrup instead. The conversion chart I found says
    use three-quarters of the volume of syrup and take out 3 tablespoons of liquid
    per cup replaced, which works out at about 170 g of syrup for my 225 g of
    sugar, and it says to drop the oven 15 C. Will that give me my sponge back,
    and is there anything else I need to change?
  grader:
    type: llm-judge
    judgeMode: dimension
    judgeWeight: 1.0
    rubric: &subs102-criteria
      - id: c1
        kind: critical
        statement: Identifies that creaming depends on sugar crystals, so a liquid sweetener removes the aeration.
        weight: 5
        dimension: ingredient function
        evidence: The mechanism, not just "the texture will differ".
        failureLabel: chart-without-mechanism
      - id: c2
        kind: include
        statement: Predicts the specific outcome — a denser, wetter, flatter crumb.
        weight: 3
        dimension: ingredient function
      - id: c3
        kind: include
        statement: Gives at least one route that keeps the cake a risen sponge.
        weight: 5
        dimension: ingredient function
        evidence: Maple sugar (crystalline) at about 1:1, or replacing only part of the caster sugar.
      - id: c4
        kind: include
        statement: States that maple syrup is roughly one third water and adjusts for it.
        weight: 3
      - id: c5
        kind: include
        statement: Confirms the lower oven temperature and attributes it to faster browning.
        weight: 2
        evidence: Fructose and invert sugars brown at a lower temperature than sucrose.
      - id: c6
        kind: exceptional
        statement: Notes that maple syrup is nutritionally close to sucrose, so the stated goal is barely served.
        weight: 3
      - id: c7
        kind: avoid
        statement: Does not endorse the chart for this method.
        weight: 4
  anchors:
    - dimension: ingredient function
      definition: Whether the answer reasons from what the ingredient does in this method, or from a table.
      bands:
        - band: 0
          descriptor: Applies the chart and predicts a sponge of the same rise and texture.
        - band: 1
          descriptor: Applies the chart and warns only that the cake will taste sweeter or maple-flavoured.
        - band: 2
          descriptor: Mentions that creaming may suffer without naming the crystals as the mechanism.
        - band: 3
          descriptor: Names the crystal mechanism and gives one route back to a risen sponge.
        - band: 4
          descriptor: Names the crystal mechanism, quantifies the water in the syrup, and gives two routes including a crystalline maple sugar swap.
  judgingNotes: >
    The chart the cook quotes is real and is correct for chemically-leavened
    batters; the item turns on whether the model asks what the sugar is doing in
    this particular method. An answer that endorses the chart has failed c1 and
    c7 even if every number in it is right. Credit any route that restores
    aeration: maple sugar at roughly 1:1, keeping half the caster sugar for the
    creaming stage, or switching to a melted-butter or oil batter and accepting a
    different cake — but the last must say out loud that it is no longer a
    Victoria sponge. c6 is a genuine bonus, not a moral: maple syrup is about
    two-thirds sucrose, glucose and fructose, so "cutting refined sugar" this way
    changes very little nutritionally, and saying so respectfully is the honest
    answer.
  referenceAnswer: >
    The chart is not wrong, it is answering a different question — it is written
    for muffins, loaf cakes and anything else mixed by the all-in-one or
    melted-butter method, and your sponge is creamed. That matters more than any
    of the numbers. Creaming is mechanical: the sharp edges of the caster sugar
    crystals are dragged through cold-ish butter and cut air cells into it, and
    those air cells are what the eggs and the flour then set around. It is the
    cake's leavening, not just its sweetness. Maple syrup has no crystals, so
    there is nothing to do the cutting; you can beat it into butter all afternoon
    and get an emulsion rather than a foam. Follow the chart and you will get a
    flat, dense, slightly gummy cake that tastes pleasant and is not a Victoria
    sponge — made worse by the syrup being about a third water, which loosens the
    batter, and by its fructose browning early, which is why the chart tells you
    to drop the oven 15 C. That part is right. Two ways to get what you want.
    Simplest: buy maple sugar rather than syrup. It is crystalline, it creams, and
    it goes in at roughly 1:1 by weight, so 225 g, with no other change. Or keep
    150 g of the caster sugar so the creaming still works, replace the remaining
    75 g with about 60 g of syrup added with the eggs, and take 15 to 20 g out of
    the flour to compensate for the extra water — the crumb will be a shade
    denser and noticeably more maple. Either way, lower the oven to 165 C and
    expect it to bake a couple of minutes faster than you think. One thing worth
    saying plainly: maple syrup is about two-thirds sugars by weight — mostly
    sucrose, the same molecule as your caster sugar — so if the aim is less sugar
    rather than a different flavour, this swap will not get you there. Making the
    sponge smaller, or eating it less often, will.
  failingAnswer: >
    That chart is spot on. Use 170 g of maple syrup in place of the 225 g of
    caster sugar, hold back about 3 tablespoons of the liquid — with only eggs in
    there, take out one egg white — add a quarter-teaspoon of bicarbonate of soda
    to counter the syrup's acidity, and bake at 165 C rather than 180 C so it does
    not over-brown. Cream the butter and syrup together until pale and fluffy just
    as you would with sugar, then carry on as normal. You will get the same light,
    even crumb with a lovely maple note running through it.
  judgePack:
    capabilityUnderTest: >
      Asking what an ingredient does in a specific method before applying a
      general substitution rule.
    hardConstraints:
      - The answer must not endorse creaming butter with a liquid sweetener.
      - Any route offered must be executable from the cook's existing recipe.
    criteria: *subs102-criteria
    intendedOutcome:
      practical: A sponge that rises, or an explicit and accepted change of cake.
      sensory: Fine, even, springy crumb; maple present as flavour rather than as wetness.
    sources:
      - citation: McGee, On Food and Cooking, 2nd ed. — creaming, sugar crystals and aeration.
        confidence: high
      - citation: Corriher, BakeWise — the function of sugar in creamed batters.
        confidence: high
      - citation: >
          USDA FoodData Central — maple syrup, approximately 32% water and 67%
          total sugars.
        confidence: high
    solutionFamilies:
      - id: crystalline-maple
        summary: Use maple sugar at roughly 1:1 by weight.
        whyAcceptable: Restores the crystals, so the method is unchanged.
        boundaries: Fails if it does not note that maple sugar is a different purchase from syrup.
      - id: partial-replacement
        summary: Keep enough caster sugar to cream, add syrup with the eggs, take flour out for the water.
        whyAcceptable: Keeps the mechanism and delivers the flavour, with an honest texture cost.
      - id: change-the-method
        summary: Switch to an all-in-one or melted-butter batter where chemical leavening does the work.
        whyAcceptable: The chart then applies as written.
        boundaries: Must say the result is no longer a Victoria sponge.
    commonFailureModes:
      - label: chart-without-mechanism
        description: Applies a substitution table without checking what the ingredient does here.
        domain: reasoning
        severity: critical
      - label: creaming-a-liquid
        description: Instructs the cook to cream butter and syrup until pale and fluffy, which cannot happen.
        domain: feasibility
        severity: critical
      - label: water-ignored
        description: Does not account for the syrup being about a third water.
        domain: reasoning
        severity: minor
      - label: health-claim-unchallenged
        description: Accepts that maple syrup is meaningfully less sugar.
        domain: context
        severity: minor
    workedExamples:
      - kind: exceptional
        answer: >
          The chart is for muffin-method batters; yours is creamed, and creaming
          needs crystals — the sugar's sharp edges cut air cells into the butter,
          and that is your leavening. Syrup cannot do it. Use maple sugar at 1:1
          (225 g) and change nothing else, or keep 150 g caster for the creaming,
          add 60 g syrup with the eggs and drop 20 g of flour for the water. Oven
          to 165 C either way. Worth knowing maple is two-thirds sugars, so this
          is a flavour change rather than a sugar cut.
        whyItLandsHere: All seven criteria; two routes, quantified.
        expectedBand: 4
      - kind: competent-ordinary
        answer: >
          It will not cream properly with a liquid sweetener, so expect a denser
