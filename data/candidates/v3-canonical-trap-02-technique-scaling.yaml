      certified: false
    context:
      locale: en-GB
      kitchen: domestic
      equipment: [single domestic oven, probe thermometer]
      toolConditions: { browsing: false, images: false, followUpQuestions: false }
    shortcutBlocked: >
      Doing the arithmetic the user has set up. Minutes-per-kilo is a proxy for
