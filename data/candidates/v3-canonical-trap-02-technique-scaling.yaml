    stratumHypothesis:
      stratum: chef-frontier
      rationale: >
        The cook names the technique and the kit, so agreeing is the path of least
        resistance; the defeating fact is first-page confectionery science.
      certified: false
    context:
      locale: en-GB
      kitchen: domestic
      equipment: [probe thermometer, marble slab, microwave]
      skillLevel: keen amateur
      toolConditions: { browsing: false, images: false, followUpQuestions: false }
    shortcutBlocked: >
      Producing the tempering curve on seeing the word "temper", without
      establishing whether the material contains cocoa butter.
    failureTaxonomy:
      - domain: reasoning
        label: curve-on-compound
      - domain: reasoning
        label: technique-follows-the-word
      - domain: feasibility
        label: overheats
  provenance:
