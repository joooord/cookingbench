# =============================================================================
# tech-102 — the steak that never came to room temperature
# =============================================================================
- id: tech-102
  category: technique
  difficulty: 4
  status: candidate
  addedIn: v3
  trap: true
  public: true
  authoringProvenance: agent-draft
  canonicalTrap: >
    Answer the question as posed — "an hour, maybe two for a piece that thick" —
    endorsing an instruction that appears in almost every recipe and whose actual
    effect on the core is a couple of degrees.
  defeatingFact: >
    Meat's thermal diffusivity is about 1.4 x 10^-7 m^2/s and still air is a poor
    heat-transfer medium, so the core of a 4 cm steak gains only a few degrees in
    two hours at ambient — it does not reach room temperature and the cooking-time
    difference is a minute or so. Meanwhile the surface, where the bacteria are,
    spends that time in the danger zone. The real effect the practice is credited
    with — a better crust — comes from surface drying, which is achieved faster
    and safely by leaving the steak uncovered on a rack in the fridge.
  prompt: >
    Doing a 4 cm-thick sirloin on Saturday for a special dinner, and I want to get
    it right. Everything I read says take it out of the fridge and let it come to
    room temperature first — some say an hour, some say two, one blog said three
    for a steak that thick. Our kitchen runs warm, about 24 C. How long should I
    actually give it, and does it matter if the surface dries out while it is
    sitting there?
  grader:
    type: llm-judge
    judgeMode: dimension
    judgeWeight: 1.0
    rubric: &tech102-criteria
      - id: c1
        kind: critical
        statement: States that the core temperature gain over an hour or two is small, with a figure.
        weight: 5
        dimension: magnitude estimation
        evidence: A few degrees, or a stated end temperature well below ambient.
        failureLabel: endorses-long-ambient-hold
      - id: c2
        kind: include
        statement: Names low thermal diffusivity or poor still-air heat transfer as the reason.
        weight: 3
        dimension: magnitude estimation
      - id: c3
        kind: include
        statement: Flags two to three hours at 24 C as a surface food-safety problem.
        weight: 4
        evidence: The two-hour ambient limit, and that the surface is where the bacteria are.
      - id: c4
        kind: include
        statement: Redirects the real benefit to surface drying, salted and uncovered in the fridge.
        weight: 5
        dimension: magnitude estimation
      - id: c5
        kind: exceptional
        statement: Gives a pull temperature and carryover rather than a timing rule.
        weight: 3
        evidence: Around 48-50 C pulled for medium-rare, resting to 54-55 C.
      - id: c6
        kind: avoid
        statement: Does not recommend two or three hours at ambient.
        weight: 4
      - id: c7
        kind: exceptional
        statement: Answers the drying half of the question directly, as a benefit rather than a risk.
        weight: 2
  anchors:
    - dimension: magnitude estimation
      definition: Whether the answer estimates the size of the effect it is being asked to schedule.
      bands:
        - band: 0
          descriptor: Recommends two or three hours at ambient and predicts an evenly warmed centre.
        - band: 1
          descriptor: Recommends an hour and repeats that the steak will cook more evenly, giving no figure.
        - band: 2
          descriptor: States the effect is smaller than commonly claimed but gives no number and no alternative.
        - band: 3
          descriptor: Quantifies the core gain as a few degrees and still recommends an hour on the counter.
        - band: 4
          descriptor: Quantifies the core gain as a few degrees, cites the two-hour ambient limit, and moves the drying step into the fridge.
  judgingNotes: >
    Two things are being tested and both are about size. First, does the model
    estimate the effect of the practice it is being asked to schedule, rather than
    scheduling it? Second, does it notice that the cook has handed it the useful
    half of the folk wisdom — surface drying — in the second sentence? An answer
    that says "45 minutes is plenty" without a figure sits at band 1: it has
    negotiated the time down, not reasoned about it. Credit any defensible
    quantification (a few degrees, or "it will still be under 10 C in the middle").
    Do not require the exact diffusivity figure. An answer that recommends taking
    it out for a short period and is otherwise correct should not be failed —
    the fault worth penalising is endorsing two or three hours at 24 C.
  referenceAnswer: >
    Give it none, or as long as it takes you to salt it and get the pan hot. The
    instruction is nearly universal and the effect is nearly nothing: meat conducts
    heat badly — thermal diffusivity around 1.4 x 10^-7 m^2/s — and still air
    transfers it badly too, so a 4 cm sirloin taken out of the fridge at 4 C is
    still around 8 to 10 C in the middle two hours later. It has not come to room
    temperature; it has come to slightly-less-cold, and the difference to your
    cooking time is on the order of a minute. Three hours at 24 C, on the other
    hand, is a real food-safety cost, because the surface — which is where the
    bacteria actually are — sits in the danger zone the whole time, and two hours
    is the usual limit. So the trade is a minute of cooking against three hours of
    warm surface, which is not a trade. What is true is the part in your second
    question. A dry surface sears far better: water has to be driven off before the
    crust can form, and a wet steak steams itself grey. But you get that better in
    the fridge than on the counter. Salt it generously on both sides now, sit it
    uncovered on a rack over a plate, and leave it in the fridge overnight, or at
    least 45 minutes. The fridge is dry and cold, so the surface dehydrates while
    the interior stays out of the danger zone, and the salt has time to dissolve and
    penetrate. Take it out, pat it dry, straight into a very hot pan. Cook to
    temperature rather than to time: pull it at 48-50 C in the centre for
    medium-rare, and let carryover take it to 54-55 C over a 10-minute rest.
  failingAnswer: >
    For a steak that thick I would give it a good two hours out of the fridge, and
    in a kitchen at 24 C it will come up nicely and evenly — this is the single
    biggest thing people skip, and it is why home steaks come out with a cold grey
    band around a raw centre. Cover it loosely with foil while it sits so the
    surface does not dry out, then season just before it goes in the pan. Get the
    pan screaming hot and it will cook far more evenly than one straight from the
    fridge.
  judgePack:
    capabilityUnderTest: >
      Estimating the magnitude of a widely-repeated practice's effect, and
      redirecting to the mechanism that actually delivers the benefit claimed.
    hardConstraints:
      - No recommendation of two or more hours at 24 C ambient.
      - The crust question must be answered, not deferred.
    criteria: *tech102-criteria
    intendedOutcome:
      practical: A steak cooked to temperature from a dry, salted surface, with no long ambient hold.
      sensory: Deep even crust, no grey band, medium-rare throughout.
    sources:
      - citation: >
          López-Alt, The Food Lab — measured core temperature of steaks held at
          ambient; the rise over two hours is a few degrees.
        confidence: medium
      - citation: Thermal diffusivity of lean beef, approximately 1.3-1.5 x 10^-7 m^2/s.
        confidence: high
      - citation: FSA guidance — chilled food should not be held above 8 C ambient for over two hours.
        confidence: high
      - citation: Dry brining — salt dissolves, is drawn in, and the surface dehydrates uncovered in the fridge.
        confidence: high
    solutionFamilies:
      - id: fridge-to-pan
        summary: Salt and dry uncovered in the fridge, then cook straight from cold.
        whyAcceptable: Delivers the crust benefit without the ambient hold.
      - id: short-temper-then-dry
        summary: Twenty to thirty minutes out while the pan heats, with the surface already dried in the fridge.
        whyAcceptable: >
          Harmless, within the ambient limit, and matches what many cooks will do
          anyway; acceptable provided the answer says the core effect is negligible.
        boundaries: Fails if it presents the ambient time as doing the work.
      - id: sous-vide
        summary: Cook to temperature in a bath and sear at the end.
        whyAcceptable: Makes the starting temperature irrelevant, which is the honest resolution.
        boundaries: Requires kit the cook has not mentioned; must be offered as an alternative, not the answer.
    commonFailureModes:
      - label: endorses-long-ambient-hold
        description: Recommends two or three hours on the counter for even cooking.
        domain: safety
        severity: critical
      - label: no-magnitude
        description: Debates the duration without ever estimating the temperature change.
        domain: reasoning
        severity: major
      - label: covers-the-steak
        description: Advises covering it to stop the surface drying, losing the one real benefit.
        domain: sensory
        severity: major
      - label: cooks-to-time
        description: Gives minutes per side instead of a pull temperature.
        domain: feasibility
        severity: minor
    workedExamples:
      - kind: exceptional
        answer: >
          Effectively none. Meat conducts heat badly, so two hours out takes the
          centre of a 4 cm steak from 4 C to about 8-10 C — a minute of cooking
          time — while the surface sits in the danger zone, and two hours ambient is
          the limit anyway. The part worth keeping is the drying: salt it and leave
          it uncovered on a rack in the fridge overnight. Dry surface, hot pan, pull
          at 48-50 C and rest to 55 C.
        whyItLandsHere: Quantifies, corrects, redirects, and answers the drying question directly.
        expectedBand: 4
      - kind: competent-ordinary
        answer: >
          The room-temperature step does much less than people think — the centre
          barely moves. Half an hour is plenty, and drying the surface matters far
          more than warming it, so pat it dry before it goes in the pan.
        whyItLandsHere: c1 without a figure, c4 partially; no safety note, no pull temperature.
        expectedBand: 3
      - kind: plausible-but-wrong
        answer: >
          For 4 cm, give it a full two hours — this is the step that separates a
          restaurant steak from a home one, because a cold centre forces you to
          overcook the outside while you wait for the middle. Cover it loosely so
          the surface does not dry out, season just before cooking, and use a very
          hot pan.
        whyItLandsHere: >
          Confident, standard, and wrong twice: it endorses the long hold and then
          covers the steak, discarding the only real benefit. Fails c1, c3, c4 and c6.
        expectedBand: 0
        expectedScoreMax: 20
      - kind: clearly-failing
        answer: Three hours, as the blog said. Thicker steaks need longer to equalise.
        whyItLandsHere: Endorses the longest ambient hold with no estimate at all.
        expectedBand: 0
        expectedScoreMax: 5
  outputContract:
    format: prose
    maxWords: 400
  classification:
    primaryCapability: technical-reasoning
    secondaryCapabilities: [execution-service]
    evidenceLayer: craft-prose
    taskFamily: magnitude-of-a-received-practice
    scenarioFamily: steak-tempering-and-surface-drying
    stratumHypothesis:
      stratum: chef-frontier
      rationale: >
        The instruction is in every recipe, and the item asks only how long — a
        framing that invites a number rather than a check on whether it works.
      certified: false
    context:
      locale: en-GB
      kitchen: domestic
      equipment: [heavy pan, probe thermometer, fridge]
      toolConditions: { browsing: false, images: false, followUpQuestions: false }
    shortcutBlocked: >
      Scheduling a received practice instead of estimating its effect. The
      question is phrased as "how long", and picking a number scores well with a
      judge that is not looking for the estimate.
    failureTaxonomy:
      - domain: safety
        label: endorses-long-ambient-hold
      - domain: reasoning
        label: no-magnitude
      - domain: sensory
        label: covers-the-steak
  provenance:
    itemVersion: 0.1.0
    author: agent-draft (claude-opus-5)
    authoringChain:
      - stage: agent-draft
        actor: claude-opus-5
        actorVersion: claude-opus-5, 2026-07-30 authoring session
        at: '2026-07-30'
        transformation: Authored to docs/authoring/frontier-item-principle.md. No model was called.
        notes: >
