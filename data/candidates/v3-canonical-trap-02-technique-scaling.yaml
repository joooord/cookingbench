# =============================================================================
# conv-101 — an ounce of yeast in 1955 is not an ounce of yeast now
# =============================================================================
- id: conv-101
  category: conversions
  difficulty: 5
  status: candidate
  addedIn: v3
  trap: true
  public: true
  authoringProvenance: agent-draft
  canonicalTrap: >
    Convert the units literally: 1 oz is 28 g, so weigh out 28 g of instant yeast.
    That is four sachets and about two per cent of the flour weight, roughly three
    times a normal dose — the dough over-proves, tastes of beer and collapses. The
    trap is strong because the whole question is framed as a units exercise, and
    the model is in conversion mode.
  defeatingFact: >
    A British domestic recipe written in the 1950s means fresh (compressed) baker's
    yeast, which is roughly 70 per cent water. The conversion between yeast forms
    is by activity, not by mass: fresh to active dried to instant runs at roughly
    3 : 1.5 : 1 by weight. So 1 oz of fresh yeast is about 10 g of instant, not
    28 g. The imperial pint in the same recipe is 568 ml, not the US 473 ml.
  prompt: >
    Baking my grandmother's Yorkshire teacakes from her handwritten book for a
    family get-together. She wrote it in the mid-1950s and it is all in old
    measures: 3 lb of flour, 1 oz of yeast, 1 pint of milk, 4 oz of lard, 4 oz of
    sugar, currants, and it just says "set to rise in a warm place". I have a bag
    of instant dried yeast and digital scales. How much yeast do I actually use,
    and is there anything else in there I should be converting rather than
    reading straight across?
  grader:
    type: llm-judge
    judgeMode: dimension
    judgeWeight: 0.9
    rubric: &conv101-criteria
      - id: c1
        kind: critical
        statement: States that the recipe's ounce of yeast means fresh yeast, not dried.
        weight: 5
        dimension: unit provenance
        evidence: Dated to the period, or inferred from the dose being impossible as dried.
        failureLabel: mass-for-mass-yeast
      - id: c2
        kind: include
        statement: Gives an instant-yeast quantity of roughly 9 to 11 g.
        weight: 5
        dimension: unit provenance
      - id: c3
        kind: include
        statement: States the conversion ratio between fresh, active dried and instant.
        weight: 3
        dimension: unit provenance
        evidence: Approximately 3 to 1.5 to 1 by weight (fresh, active dried, instant).
      - id: c4
        kind: include
        statement: Converts the pint as an imperial pint of 568 ml.
        weight: 4
        failureLabel: us-pint
      - id: c5
        kind: include
        statement: Converts the remaining imperial weights correctly.
        weight: 2
        evidence: 3 lb is about 1.36 kg; 4 oz is about 113 g.
      - id: c6
        kind: exceptional
        statement: Adapts the method, not only the numbers.
        weight: 3
        evidence: Instant yeast goes in dry with the flour rather than being creamed with sugar and milk.
      - id: c7
        kind: exceptional
        statement: Sanity-checks the dose against the flour weight as a baker's percentage.
        weight: 3
        evidence: About 0.7 per cent instant yeast on 1.36 kg of flour; 28 g would be over 2 per cent.
    constraintChecks:
      # Floor check on the one figure the item exists to produce. Deliberately
      # narrow: 8 to 11 g scores full, 6.5 to 12.5 g scores partial, and the
      # literal 28 g conversion scores zero.
      - type: numeric
        expected: 9.5
        unit: g
        bands:
          - toleranceAbs: 1.5
            score: 100
          - toleranceAbs: 3
            score: 60
  anchors:
    - dimension: unit provenance
      definition: Whether the answer asks what the original recipe's unit referred to before converting it.
      bands:
        - band: 0
          descriptor: Converts 1 oz to 28 g of instant yeast and gives no warning.
        - band: 1
          descriptor: Converts to 28 g and suggests it seems like a lot without changing the figure.
        - band: 2
          descriptor: States that old recipes used fresh yeast but gives no instant-yeast quantity.
        - band: 3
          descriptor: Gives roughly 10 g of instant yeast without stating the ratio it came from.
        - band: 4
          descriptor: Identifies the ounce as fresh yeast, states the 3 to 1 ratio, gives about 10 g of instant and checks it against the flour weight.
  judgingNotes: >
    The question is framed as arithmetic, which is the trap: every quantity in it
    converts straight across except the one that matters. An answer giving 28 g of
    instant yeast has failed the item outright, whatever it does with the pint —
    that is three times a normal dose and would produce an inedible, collapsed,
    beery dough. Credit 8 to 12 g; credit "one and a half sachets" as equivalent.
    The imperial pint (c4) is the secondary check and an answer that uses 473 ml
    has imported a US convention into a Yorkshire kitchen. c7 is the mark of an
    answer that verified rather than recalled: 10 g on 1.36 kg of flour is about
    0.7 per cent, which is a normal enriched-dough dose, and that check is
    available to any model that thinks to make it.
  referenceAnswer: >
    Use about 10 g of instant yeast — not 28 g, which is what you get by converting
    the ounce straight across, and which would be a disaster. In a recipe written in
    the 1950s "1 oz of yeast" means fresh compressed baker's yeast, the putty-like
    block you bought from the baker, and fresh yeast is about seventy per cent
    water. The conversion between the forms is by activity rather than by weight:
    fresh to active dried to instant runs at roughly 3 : 1.5 : 1, so an ounce of
    fresh, 28 g, is about 14 g of active dried or about 10 g of instant. Sanity-check
    it against the flour: 3 lb is 1.36 kg, and 10 g of instant is about 0.7 per
    cent of that, which is a normal dose for an enriched dough. Twenty-eight grams
    would be over two per cent — the dough would race, taste of beer, and collapse.
    The other one to watch is the pint. Your grandmother's pint is imperial, 568 ml,
    not the American 473 ml; using the US figure would take about 95 ml of liquid
    out of the dough and leave it far too stiff. The rest reads straight across:
    3 lb of flour is 1.36 kg, 4 oz of lard is 113 g, 4 oz of sugar the same. One
    method change to go with the ingredient change: her fresh yeast would have been
    creamed with a little of the sugar and warmed milk and left to froth, which is
    how you proved it was alive. Instant yeast does not need that and does not like
    sitting in liquid on its own — stir it straight into the dry flour, then add the
    warmed milk and melted lard. "A warm place" means about 24 to 26 C; with a
    dough this rich expect an hour and a half to two hours for the first rise
    rather than the hour she would have got from a warm 1950s kitchen with a coal
    range in it.
  failingAnswer: >
    Straightforward conversions. 3 lb of flour is 1,360 g. 1 oz of yeast is 28 g,
    so weigh out 28 g of your instant yeast. 1 pint of milk is 473 ml. 4 oz of lard
    is 113 g and 4 oz of sugar the same. Mix the yeast into the warm milk with a
    spoonful of the sugar and leave it ten minutes until it froths, then add it to
    the flour with the melted lard, knead, and set to rise in a warm place until
    doubled.
  judgePack:
    capabilityUnderTest: >
      Asking what a historical recipe's unit referred to before converting it, and
      checking the converted quantity against an independent yardstick.
    hardConstraints:
      - The yeast quantity must be a workable dose for 1.36 kg of flour.
      - The pint must be treated as imperial.
    criteria: *conv101-criteria
    intendedOutcome:
      practical: Teacakes that rise once, at a sensible pace, and taste of butter and currants.
      historical: The 1950s method understood rather than transcribed.
    sources:
      - citation: >
          Fresh (compressed) yeast is approximately 70% water; conversion to dried
          forms is by activity, commonly quoted as fresh : active dried : instant
          = 3 : 1.5 : 1 by weight.
        confidence: medium
      - citation: Imperial pint = 568.26 ml; US liquid pint = 473.18 ml.
        confidence: high
      - citation: >
          Typical instant yeast dose for an enriched dough, 0.5-1% of flour weight
          (baker's percentage).
        confidence: medium
    solutionFamilies:
      - id: convert-by-activity
        summary: Identify the ounce as fresh, convert at 3:1 to about 10 g of instant.
        whyAcceptable: Reproduces the original dough's fermentation rate.
      - id: convert-by-percentage
        summary: Ignore the original figure and dose the flour at 0.6-0.8 per cent instant.
        whyAcceptable: >
          Arrives at the same 8-11 g from the other direction, and is what a baker
          would actually do.
        boundaries: Must still say why the literal 28 g is wrong, or it has dodged the item.
      - id: buy-fresh-yeast
        summary: Buy fresh yeast and use the recipe as written.
        whyAcceptable: Honest, and still available from supermarket bakery counters.
        boundaries: Must confirm the ounce is fresh yeast, and adapt if it cannot be found.
    commonFailureModes:
      - label: mass-for-mass-yeast
        description: Converts 1 oz to 28 g of dried yeast.
        domain: reasoning
        severity: critical
      - label: us-pint
        description: Uses 473 ml for a British recipe's pint.
        domain: reasoning
        severity: major
      - label: no-sanity-check
        description: Produces a yeast figure without testing it against the flour weight.
        domain: reasoning
        severity: major
      - label: method-untouched
        description: Tells the cook to froth instant yeast in milk as the original did with fresh.
        domain: sequencing
        severity: minor
    workedExamples:
      - kind: exceptional
        answer: >
          About 10 g of instant, not 28 g. In a 1950s recipe "1 oz of yeast" is
          fresh compressed yeast, roughly seventy per cent water; fresh : active
          dried : instant is about 3 : 1.5 : 1, so 28 g fresh is 10 g instant.
          Check it: 10 g on 1.36 kg of flour is 0.7 per cent, a normal enriched
          dose. Her pint is imperial, 568 ml, not 473. Stir instant yeast into the
