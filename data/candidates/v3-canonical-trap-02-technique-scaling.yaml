# =============================================================================
# tech-101 — there is nothing in it to temper
# =============================================================================
- id: tech-101
  category: technique
  difficulty: 4
  status: candidate
  addedIn: v3
  trap: true
  public: true
  authoringProvenance: agent-draft
  canonicalTrap: >
    Give the tempering curve. Melt to 45-50 C, cool to 27 C, bring back to 31-32 C
    for dark, and describe the tabling method on the marble slab the cook has
    already offered. It is the top-probability answer to the word "temper" and it
    is meaningless for the product they bought.
  defeatingFact: >
    Tempering is the management of cocoa butter's crystal polymorphs — the point
    of the curve is to seed form V, which melts at about 34 C and gives snap and
    gloss. "Chocolate flavour cake covering" is compound coating: its fat is
    hydrogenated palm kernel or coconut fat, which crystallises in a single stable
    form. No cocoa butter, no polymorphs, nothing to temper. It sets hard and
    glossy from a simple melt, and holding it at 45-50 C only thickens it.
  prompt: >
    Making chocolate-dipped honeycomb for the school fundraiser, about 200 pieces,
    and the hall gets warm. I bought 4 kg of the supermarket's own "Belgian
    chocolate flavour cake covering" because it was a third of the price of the
    proper stuff. What is the best way to temper it so the coating snaps and stays
    glossy rather than going streaky? I have a probe thermometer and a marble
    slab and I am happy to do the tabling method if that is what it takes.
  grader:
    type: llm-judge
    judgeMode: dimension
    judgeWeight: 1.0
    rubric: &tech101-criteria
      - id: c1
        kind: critical
        statement: States that the product contains no cocoa butter, so there is nothing to temper.
        weight: 5
        dimension: material identification
        evidence: Identifies "chocolate flavour cake covering" as compound coating, not chocolate.
        failureLabel: curve-on-compound
      - id: c2
        kind: include
        statement: Names cocoa butter polymorphism as what tempering manages.
        weight: 3
        dimension: material identification
        evidence: Form V, or the six crystal forms, or the seeding of stable crystals.
      - id: c3
        kind: include
        statement: Gives the correct handling for compound coating.
        weight: 5
        dimension: material identification
        evidence: Melt gently to roughly 40-45 C and use; no cooling curve, no seeding.
      - id: c4
        kind: include
        statement: Notes that compound suits a warm hall better than couverture would.
        weight: 3
        evidence: Higher-melting fat, and it does not bloom.
      - id: c5
        kind: exceptional
        statement: Says what to buy instead if flavour matters more than cost, and gives the curve for that.
        weight: 3
        evidence: Couverture, tempered to about 31-32 C for dark.
      - id: c6
        kind: avoid
        statement: Does not give a tempering curve for the product as bought.
        weight: 4
      - id: c7
        kind: exceptional
        statement: Warns that overheating compound coating thickens it and that water seizes it.
        weight: 2
  anchors:
    - dimension: material identification
      definition: Whether the answer establishes what the material is before prescribing a technique for it.
      bands:
        - band: 0
          descriptor: Gives a full tempering curve for the cake covering and predicts a glossy snap from it.
        - band: 1
          descriptor: Gives the curve and adds that results with cheaper chocolate vary.
        - band: 2
          descriptor: Notices the product may not be real chocolate and still recommends tempering it.
        - band: 3
          descriptor: States it contains no cocoa butter and that tempering is unnecessary, without a working temperature.
        - band: 4
          descriptor: States it contains no cocoa butter, names form V as what tempering manages, and specifies a melting temperature for the coating as bought.
  judgingNotes: >
    The cook has pre-committed to the technique — thermometer, marble slab,
    tabling — which is what makes agreeing with them the easy answer. The item
    turns entirely on c1. An answer that delivers a flawless tempering protocol
    has failed, however precise its temperatures. Credit an answer that hedges
    correctly ("if the label says cocoa butter, temper it; if it says vegetable
    fat, just melt it") provided it identifies which side "chocolate flavour cake
    covering" falls on — the phrase is a legal signal in the UK that it is not
    chocolate. Do not penalise an answer for also giving the couverture curve as
    an alternative purchase; that is criterion c5.
  referenceAnswer: >
    Good news and bad news: you cannot temper it, and you do not need to. "Chocolate
    flavour cake covering" is compound coating — the phrase is doing legal work, it
    means the cocoa butter has been replaced with a hydrogenated palm kernel or
    coconut fat. Tempering exists solely to manage cocoa butter, which sets in six
    different crystal forms of which only form V gives snap and gloss; the whole
    curve is a way of seeding form V and starving the others. Compound fat has no
    such polymorphism. It crystallises one way, and it does it by itself. So: chop
    it, melt it gently over a very low bain-marie or in short bursts in the
    microwave to about 40-45 C, stir until smooth, and dip. No cooling to 27 C, no
    tabling, no seeding — the marble slab can stay in the cupboard. Keep it under
    about 50 C; overheated compound goes thick and claggy and will not thin again,
    and a single drop of water will seize it, so dry hands and dry honeycomb. For
    your purposes this is genuinely the right buy rather than a compromise: the
    palm kernel fat melts higher than cocoa butter, so it will not go soft in a
    warm hall, and it cannot bloom, so it will still look glossy on the table at
    four o'clock. What you lose is flavour — it will taste waxy next to real
    chocolate. If that matters more than the cost and the heat, buy dark couverture
    at 55 per cent or so and temper it properly: melt to 45-50 C, cool to 27-28 C
    while stirring in reserved chopped chocolate to seed it, then bring it back to
    31-32 C and hold there while you dip. But in a warm hall, with 200 pieces to
    get through, the covering is the sensible choice.
  failingAnswer: >
    Tempering is straightforward with a probe and a slab. Melt about two-thirds of
    the covering to 45-50 C over a bain-marie, then pour three-quarters of it onto
    the marble and work it back and forth with a scraper until it cools to 27 C and
    starts to thicken. Scrape it back into the bowl with the reserved warm
    chocolate and stir until it comes up to 31-32 C, which is your working
    temperature. Test it by dipping a knife tip: it should set glossy in three
    minutes. Hold it at 31-32 C over a warm pad while you dip the honeycomb, and it
    will snap cleanly and stay shiny in the hall.
  judgePack:
    capabilityUnderTest: >
      Identifying the material before applying the technique its name suggests,
      when the cook has already named the technique.
    hardConstraints:
      - The handling advice must match a cocoa-butter-free coating.
      - The answer must still get 200 pieces coated and stable in a warm hall.
    intendedOutcome:
      practical: 200 pieces dipped in a single session, set hard and glossy, stable at room temperature.
      sensory: A clean snap and a shiny surface; flavour acknowledged as the cost of the choice.
    criteria: *tech101-criteria
    sources:
      - citation: >
          Beckett, The Science of Chocolate — cocoa butter polymorphism and the six
          crystal forms; form V melts at about 34 C.
        confidence: high
      - citation: >
          UK/EU chocolate labelling: products whose cocoa butter is substituted may
          not be sold as "chocolate", hence "chocolate flavoured coating".
        confidence: high
      - citation: Compound coating formulation — hydrogenated palm kernel and coconut fats.
        confidence: medium
    solutionFamilies:
      - id: melt-and-use
        summary: Melt the covering to about 40-45 C and dip. No tempering at all.
        whyAcceptable: Matches the material and meets the brief in the warm hall.
      - id: buy-couverture-and-temper
        summary: Return the covering, buy couverture, temper it properly.
        whyAcceptable: >
          A legitimate route if flavour is the priority; must acknowledge the heat
          and bloom risk it takes on.
        boundaries: Fails if it recommends this without naming the warm-hall trade-off.
      - id: conditional
        summary: Read the label; temper if cocoa butter is listed, melt if vegetable fat is.
        whyAcceptable: Correct decision rule, and it teaches the cook the distinction.
        boundaries: Fails if it does not say which side this product falls on.
    commonFailureModes:
      - label: curve-on-compound
        description: Prescribes a full tempering protocol for a cocoa-butter-free coating.
        domain: reasoning
        severity: critical
      - label: technique-follows-the-word
        description: Answers the technique named in the question without checking the material.
        domain: reasoning
        severity: critical
      - label: overheats
        description: Holds compound at 45-50 C, thickening it irreversibly.
        domain: feasibility
        severity: major
      - label: misses-the-hall
        description: Ignores that the coating must survive a warm room for hours.
        domain: context
        severity: minor
    workedExamples:
      - kind: exceptional
        answer: >
          You cannot temper it and do not need to — "chocolate flavour cake
          covering" means the cocoa butter has been swapped for palm kernel fat,
          and tempering exists only to seed cocoa butter's form V crystals. Melt it
          to 40-45 C and dip; keep it under 50 C or it thickens for good, and keep
          water out. For a warm hall this is the better buy: higher melting fat, no
          bloom. If you want the flavour, buy couverture and temper to 31-32 C, but
          expect it to soften in the room.
        whyItLandsHere: c1 to c4 and c7; identifies the material first.
        expectedBand: 4
      - kind: competent-ordinary
        answer: >
          That is a compound coating rather than chocolate, so tempering does not
          apply — just melt it gently and use it. It will set hard on its own.
        whyItLandsHere: c1 and c3 satisfied; no mechanism, no temperature, nothing on the hall.
        expectedBand: 3
      - kind: plausible-but-wrong
        answer: >
          Melt two-thirds to 45-50 C, table three-quarters of it on the marble down
          to 27 C, scrape it back into the warm remainder and bring it to 31-32 C.
          Hold there while you dip and it will snap cleanly and stay glossy. Test on
          a knife tip first — it should set in three minutes.
        whyItLandsHere: >
          Technically flawless as a tempering protocol, and applied to a material
          that has no crystal forms to manage. Fails c1, c3 and c6. It will also
          ruin the coating by holding it at 45-50 C.
        expectedBand: 0
        expectedScoreMax: 20
      - kind: clearly-failing
        answer: Melt it in the microwave until it is liquid and dip. It will be fine.
        whyItLandsHere: Right by accident, with no identification, temperature or reasoning.
        expectedBand: 1
        expectedScoreMax: 30
  outputContract:
    format: prose
    maxWords: 400
  classification:
    primaryCapability: technical-reasoning
    secondaryCapabilities: [execution-service]
    evidenceLayer: craft-prose
