          own-brand product contains cocoa butter the item's premise breaks.
    modelExposures:
      - modelId: anthropic/claude-opus-5
        purpose: authoring
        at: '2026-07-30'
    independentSolves: []
    verificationState: draft
  adversarialCases:
    - kind: polished-but-wrong
      answer: >
        Melt two-thirds to 45-50 C, table three-quarters of it on the marble to
        27 C, return it to the warm remainder and bring it to 31-32 C. Hold there
        while dipping. Test on a knife tip — set within three minutes means you are
        in temper.
      expect: at-most
      score: 25
      rationale: A perfect answer to a question about chocolate, applied to something that is not chocolate.
    - kind: correct-concise
      answer: >
        That is compound coating, not chocolate — no cocoa butter, so no crystal
        forms and nothing to temper. Melt to about 42 C and dip. Keep it under 50 C
        and keep water out.
      expect: at-least
      score: 75
    - kind: correct-unconventional
      answer: >
        Check the ingredients. If it lists vegetable fat rather than cocoa butter,
        the tempering question does not arise: melt it and use it. "Chocolate
        flavour cake covering" is the legal wording for exactly that, so put the
        slab away — and for a warm hall it is the better material anyway.
      expect: at-least
