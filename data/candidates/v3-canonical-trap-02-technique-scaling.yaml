        whyItLandsHere: All seven criteria including both checks.
        expectedBand: 4
      - kind: competent-ordinary
        answer: >
          That ounce will be fresh yeast, so use about 10 g of instant instead of
          28 g. The pint is an imperial pint, 568 ml. Everything else converts
