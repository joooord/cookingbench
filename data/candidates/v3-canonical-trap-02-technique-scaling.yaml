# =============================================================================
# qty-101 — two joints are not one big joint
# =============================================================================
- id: qty-101
  category: quantities-scaling
  difficulty: 5
  status: candidate
  addedIn: v3
  trap: true
  public: true
  authoringProvenance: agent-draft
  canonicalTrap: >
    Scale the cook's own rule by total mass: 5 kg at 20 minutes per 500 g plus 20
    is 3 hours 40. Arithmetic the cook has invited, applied to a quantity that
    does not govern the answer.
  defeatingFact: >
    Conduction to the centre scales with the square of the thickness, not with
    mass — the Fourier number, t proportional to L^2/alpha. Two joints of the same
    diameter cook in the same time as one of that diameter, about two hours by the
    cook's own rule for 2.5 kg. What the extra mass changes is the oven's recovery:
    twice the cold load takes longer to bring back to temperature, worth roughly
    ten to fifteen per cent and no more.
  prompt: >
    Christmas is at ours and there are fourteen of us this year. My rule for beef
    is 20 minutes per 500 g plus 20 at 190 C for medium-rare, and it has never let
    me down on the 2.5 kg rolled sirloin I usually do. The butcher cannot get me a
    single 5 kg joint at the same thickness, so he has offered two 2.5 kg rolled
    sirloins instead, same diameter as my usual one, about 15 cm across. Do I work
    the timing off the 5 kg total — call it 3 hours 40 — or off something else?
    Same oven, both joints on one shelf.
  grader:
    type: llm-judge
    judgeMode: dimension
    judgeWeight: 0.9
    rubric: &qty101-criteria
      - id: c1
        kind: critical
        statement: States that the two joints take about the same time as one, not double.
        weight: 5
        dimension: what governs cooking time
        failureLabel: adds-the-masses
      - id: c2
        kind: include
        statement: Names thickness rather than mass as what governs the time.
        weight: 4
        dimension: what governs cooking time
        evidence: Conduction distance, or time scaling with the square of the thickness.
      - id: c3
        kind: include
        statement: Gives a worked figure for the two-joint case, near two hours.
        weight: 4
        dimension: what governs cooking time
      - id: c4
        kind: include
        statement: Adds an allowance for the oven's recovery under twice the cold load.
        weight: 3
        evidence: Roughly ten to fifteen per cent, plus not crowding the joints.
      - id: c5
        kind: include
        statement: Moves the cook off time and onto a probe and a pull temperature.
        weight: 4
        evidence: Around 52-54 C pulled for medium-rare, with carryover and a long rest.
      - id: c6
        kind: exceptional
        statement: Notes that the per-kilo rule only ever worked because the cook's joint was always the same diameter.
        weight: 3
      - id: c7
        kind: avoid
        statement: Does not tell the cook to cook the joints separately or in sequence to make the rule work.
        weight: 2
    constraintChecks:
      # A floor, not the test: the grader takes the best-matching quantity
      # anywhere in the answer, so this only asks whether the right figure was
      # reached at all. Bands give partial credit to a defensible margin.
      # 20 minutes per 500 g plus 20 on a 2.5 kg joint is 120 minutes.
      - type: numeric
        expected: 120
        unit: min
        bands:
          - toleranceAbs: 20
            score: 100
          - toleranceAbs: 40
            score: 50
  anchors:
    - dimension: what governs cooking time
      definition: Whether the answer identifies the geometric quantity that sets the time to the centre.
      bands:
        - band: 0
          descriptor: Applies the rule to the 5 kg total and gives 3 hours 40.
        - band: 1
          descriptor: Recommends a time between the one-joint and two-joint figures without a reason.
        - band: 2
          descriptor: States that two joints do not take twice as long but gives no figure and no mechanism.
        - band: 3
          descriptor: Gives roughly 2 hours and attributes it to the joints being separate pieces.
        - band: 4
          descriptor: Gives roughly 2 hours, names thickness as what sets the time, adds a recovery allowance and specifies a pull temperature.
  judgingNotes: >
    The cook has supplied the arithmetic and asked to have it checked, which is
    what makes the wrong answer so available. The item is a scaling item, so the
    decisive check is c1: two joints of the same diameter do not take twice as
    long, they take the same time. Credit any figure in the region of 2 hours to
    2 hours 20 — the extra allowance for oven recovery is real and an answer that
    adds fifteen minutes is more right than one that adds nothing. Do not credit
    an answer that reaches roughly the right number by saying "cook them one after
    the other" — that solves a different problem and ruins the meal. c5 matters
    disproportionately here: a 15 cm joint cooked to a rule is a gamble, and the
    honest answer is a probe.
  referenceAnswer: >
    Work it off one joint, not off the total. What sets the time is how far the
    heat has to travel to the middle, and that is the thickness — conduction time
    goes with the square of the distance, so a joint of the same 15 cm diameter
    takes the same time whether there is one of them in the oven or two. Doubling
    the mass by adding a second joint alongside changes nothing about how far the
    heat has to get into either one. So your figure is the one you already trust:
    120 minutes for a 2.5 kg sirloin at 190 C. Not 3 hours 40 — that would give
    you two grey, overcooked joints and a very quiet Christmas. Two things do
    change with two joints in there. The oven has twice the cold mass to bring up,
    so it will take longer to recover every time you open the door and will run
    slightly cooler through the first half hour: allow ten to fifteen per cent,
    call it 2 hours 15, and preheat properly. And they must not touch or crowd —
    leave a good gap so hot air moves round both, or the facing sides steam and
    cook slower than the rest. Then stop cooking to time altogether. On a joint
    this size the rule is a starting estimate and the probe is the answer: put it
    in the thickest part of each joint, pull at 52 C for rare-to-medium-rare, and
    expect carryover of 4 to 5 degrees on a piece this big, taking it to about 56 C.
    Rest for a full 30 to 40 minutes under loose foil — a joint that size holds its
    heat easily that long, and it buys you the oven for the potatoes. Worth knowing
    for the future: minutes-per-kilo has served you well only because your joint
    has always been the same diameter. The moment the shape changes, the rule stops
    describing anything.
  failingAnswer: >
    Go off the total weight — the oven has 5 kg of cold beef to get through, so the
    time scales with it. At 20 minutes per 500 g plus 20 that is 3 hours 40 at
    190 C, and with two joints in there I would add another 15 minutes on top for
    the extra load, so call it just under four hours. Turn them halfway. Rest for
    20 minutes before carving.
  judgePack:
    capabilityUnderTest: >
      Identifying which quantity governs a scaling problem when the user has
      supplied a rule keyed to a different one.
    hardConstraints:
      - The timing must not be scaled by total mass.
      - The advice must produce medium-rare beef for fourteen people at one sitting.
    criteria: *qty101-criteria
    intendedOutcome:
      practical: Two joints out of the oven at roughly two hours, probed, rested and carved together.
      sensory: Even rose-pink throughout, no grey band, a rest long enough to redistribute.
    sources:
      - citation: >
          Fourier number and transient conduction — time to a centre temperature
          scales with the square of the characteristic thickness.
        confidence: high
      - citation: >
          Standard roasting guidance keyed to minutes per unit mass, valid only at
          fixed geometry.
        confidence: medium
      - citation: Carryover in a large joint after resting, typically 4-6 C.
        confidence: medium
    solutionFamilies:
      - id: same-time-plus-recovery
        summary: Cook both for the one-joint time plus ten to fifteen per cent, probe to temperature.
        whyAcceptable: Matches the physics and the practical oven behaviour.
      - id: probe-only
        summary: Ignore the rule entirely; roast to a pull temperature and use the estimate only for planning.
        whyAcceptable: The professionally correct answer, provided it still tells the cook when to put them in.
        boundaries: Fails if it gives no estimate at all — fourteen people need a serving time.
      - id: two-shelves
        summary: One joint per shelf with the shelves swapped halfway, same total time.
        whyAcceptable: Addresses airflow directly; the time conclusion is unchanged.
    commonFailureModes:
      - label: adds-the-masses
        description: Applies minutes-per-kilo to the combined weight.
        domain: reasoning
        severity: critical
      - label: splits-the-difference
        description: Picks a time between the two figures with no reasoning.
        domain: reasoning
        severity: major
      - label: sequential-roasting
        description: Suggests cooking them one after another, which reaches the right time per joint and wrecks the service.
        domain: sequencing
        severity: major
      - label: no-probe
        description: Leaves a 15 cm joint to a timing rule with no temperature check.
        domain: feasibility
        severity: major
    workedExamples:
      - kind: exceptional
        answer: >
          Off one joint. Time to the centre goes with thickness squared, not with
          mass, so two 15 cm joints take what one takes: your 120 minutes. Add ten
          to fifteen per cent for the oven recovering under twice the cold load —
          about 2 hours 15 — and keep a gap between them so air moves. Then probe:
          pull at 52 C, expect 4-5 C carryover, rest 30-40 minutes. Your per-kilo
          rule worked because your joint was always the same diameter.
        whyItLandsHere: All seven criteria, with the mechanism and the number.
        expectedBand: 4
      - kind: competent-ordinary
        answer: >
          Do not double it — two joints do not take twice as long. Time each as if
          it were on its own, around two hours, and check with a thermometer.
        whyItLandsHere: c1, c3 and c5 present; no mechanism, no recovery allowance.
        expectedBand: 3
      - kind: plausible-but-wrong
        answer: >
          Go by the total: the oven has 5 kg of cold beef to bring up to
          temperature, so 3 hours 40 at 190 C by your own rule, plus a little for
          the second joint. Turn them halfway so both sides get the heat, and rest
          for 20 minutes.
        whyItLandsHere: >
          It uses the cook's own trusted rule, sounds like arithmetic, and would
          overcook 5 kg of sirloin by nearly two hours. Fails c1, c2 and c3.
        expectedBand: 0
        expectedScoreMax: 15
      - kind: clearly-failing
        answer: Roast for four hours to be sure it is cooked through, then rest.
        whyItLandsHere: Ignores the doneness the cook asked for and the geometry entirely.
        expectedBand: 0
        expectedScoreMax: 5
  outputContract:
    format: prose
    maxWords: 450
  classification:
    primaryCapability: technical-reasoning
    secondaryCapabilities: [execution-service]
    evidenceLayer: craft-prose
    taskFamily: scaling-by-the-wrong-quantity
    scenarioFamily: roast-timing-geometry
    stratumHypothesis:
      stratum: chef-frontier
      rationale: >
        The user supplies both a rule and an arithmetic answer, and the correction
