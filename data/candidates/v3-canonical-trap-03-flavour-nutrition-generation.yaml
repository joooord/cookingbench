    number looks similar, and a vegan cheese is usually worse than it looks. Apples,
    berries, grapes and pineapple are all fine for her; bananas, oranges, dried
    fruit, avocado and chocolate are not. None of this needs to be visible on the
    table. It is a roast with gravy and a crumble, and she gets to eat all of it.
