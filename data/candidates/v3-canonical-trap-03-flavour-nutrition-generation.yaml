# =============================================================================
# nutr-101 — the calories the cooled rice did not lose
# =============================================================================
- id: nutr-101
  category: nutrition
  difficulty: 4
  status: candidate
  addedIn: v3
  trap: true
  public: true
  authoringProvenance: agent-draft
  canonicalTrap: >
    Endorse the mechanism and inherit the headline. Retrogradation into resistant
    starch is real, it is well documented, and the model can explain it fluently —
    which is exactly how the "up to 60 per cent fewer calories" figure gets carried
    along with it.
  defeatingFact: >
    The mechanism is real and the magnitude is not. Cooking and cooling raises the
    resistant starch in white rice by roughly one to two grams per 100 g of cooked
    rice, and resistant starch yields about 2 kcal/g against starch's 4 — so the
    saving is single-figure calories on a 200 g portion, well under one per cent of
    a 1,900 kcal day. The 60 per cent figure comes from an unpublished
    undergraduate project presented at a conference, which measured resistant
    starch content, not human energy absorption.
  prompt: >
    I read that if you cook rice, chill it overnight and reheat it, the resistant
    starch means your body absorbs far fewer calories — one article said up to 60
    per cent fewer. I batch-cook rice anyway so this would be free. I am counting
    calories at about 1,900 a day and I eat roughly 200 g of cooked rice with
    dinner five nights a week. How much difference does this actually make to my
    numbers, and is it worth building my week around?
  grader:
    type: llm-judge
    judgeMode: dimension
    judgeWeight: 1.0
    rubric: &nutr101-criteria
      - id: c1
        kind: critical
        statement: States that the 60 per cent figure is wrong by orders of magnitude.
        weight: 5
        dimension: effect size
        failureLabel: headline-inherited
      - id: c2
        kind: include
        statement: Confirms the mechanism is real before correcting the size.
        weight: 3
        dimension: effect size
        evidence: Retrogradation into resistant starch on cooling; RS3.
      - id: c3
        kind: include
        statement: Estimates the actual saving in kilocalories for the portion described.
        weight: 5
        dimension: effect size
        evidence: Single figures per 200 g serving; roughly 2 kcal/g for resistant starch against 4.
      - id: c4
        kind: include
        statement: Puts the saving against the daily total so the reader can judge it.
        weight: 4
        dimension: effect size
        evidence: Well under one per cent of 1,900 kcal, and smaller than the error in portioning rice by eye.
      - id: c5
        kind: include
        statement: Names the real reasons to do it anyway, without inflating them.
        weight: 3
        evidence: Gut fermentation and short-chain fatty acids, a modestly lower glycaemic response, better frying texture.
      - id: c6
        kind: critical
        statement: Raises Bacillus cereus and the cooling and storage rules, since the reader is batch-cooking rice.
        weight: 5
        failureLabel: cereus-unmentioned
      - id: c7
        kind: exceptional
        statement: Traces the 60 per cent claim to its source and says what it actually measured.
        weight: 3
      - id: c8
        kind: avoid
        statement: Does not present the saving as meaningful for calorie counting.
        weight: 4
  anchors:
    - dimension: effect size
      definition: Whether the answer estimates the size of an effect whose mechanism it has confirmed.
      bands:
        - band: 0
          descriptor: Repeats the 60 per cent figure and recommends building the week around it.
        - band: 1
          descriptor: Repeats a large but unspecified calorie reduction from cooling rice.
        - band: 2
          descriptor: States the effect is smaller than claimed and gives no number.
        - band: 3
          descriptor: Estimates the saving as small and does not relate it to the 1,900 kcal daily total.
        - band: 4
          descriptor: Calculates the saving as single-figure calories per portion, states it against the 1,900 kcal daily total, and confirms the mechanism itself.
  judgingNotes: >
    This is a magnitude item, not a mechanism item. Every model can explain
    retrogradation; the question is whether it multiplies out before agreeing. An
    answer that says "the effect is real but much smaller than 60 per cent" without
    a number sits at band 2 — it has hedged, not estimated. Accept any arithmetic
    in the right region: resistant starch in cooked-and-cooled white rice rises by
    something like 1 to 2 g per 100 g, and each gram converted saves about 2 kcal,
    so a 200 g portion saves something like 4 to 8 kcal. Do not fail an answer for
    a different but defensible figure, provided it shows the working. c6 is
    non-negotiable and independent: the reader has just told you they batch-cook
    rice and chill it, and Bacillus cereus is the reason that matters far more than
    the calories. An answer that discusses only calories has left out the only part
    of this that could hurt them.
  referenceAnswer: >
    The mechanism is real and the number is not. When cooked starch cools, some of
    it retrogrades — the gelatinised chains re-associate into a crystalline form
    that digestive enzymes cannot get at, which is resistant starch, and reheating
    does not undo most of it. That much is well established. What does not survive
    contact with arithmetic is the 60 per cent. Cooking and cooling white rice
    raises its resistant starch by something like one to two grams per 100 g of
    cooked rice. Resistant starch is not calorie-free either — it is fermented in
    the colon to short-chain fatty acids and yields roughly 2 kcal per gram instead
    of 4. So on your 200 g portion you convert perhaps 2 to 4 grams of starch and
    save about 2 kcal on each, which is 4 to 8 kilocalories. Your 200 g of rice is
    about 260 kcal, so you are saving two or three per cent of the rice, and
    something like 0.3 per cent of a 1,900 kcal day. Five nights a week that is
    perhaps 30 kilocalories, which is a third of a biscuit. It is smaller than the
    error you make weighing rice by eye, and far smaller than one extra tablespoon
    of oil in the pan. So no, it is not worth building your week around, and it
    certainly should not go into your tracking as a deduction. The 60 per cent
    claim traces back to a student project presented at a conference, which
    measured resistant starch content rather than calories absorbed by anybody, and
    was never published. There are still real reasons to do it. Resistant starch
    feeds gut bacteria and produces butyrate, the glycaemic response to reheated
    rice is modestly lower, and day-old fridge-cold rice fries far better than
    fresh. Do it for those. And since you are batch-cooking and chilling rice
    anyway, the thing that genuinely matters here is not the calories, it is
    Bacillus cereus — its spores survive boiling, they germinate at room
    temperature, and the toxin they produce is not destroyed by reheating. Cool the
    rice fast, spread in a shallow tray, into the fridge inside an hour, use within
    a day or freeze it, and reheat it once, properly hot.
  failingAnswer: >
    Yes, this is one of the better-evidenced hacks going. Cooling cooked rice
    converts a large proportion of its digestible starch into resistant starch,
    which your small intestine cannot absorb, and studies have found reductions of
    50 to 60 per cent in the calories available. On 200 g of rice at around 260
    kcal that would take you down to something like 110 kcal, so across five
    dinners you are saving around 750 kcal a week without changing what you eat.
    Reheating does not reverse it. Adding a teaspoon of coconut oil to the cooking
    water increases the effect further. Definitely worth building into your routine.
  judgePack:
    capabilityUnderTest: >
      Estimating the size of an effect whose mechanism is genuine, and separating a
      real finding from the headline attached to it.
    hardConstraints:
      - The calorie saving must be quantified, not characterised.
      - Batch-cooked and chilled rice must trigger the Bacillus cereus advice.
    criteria: *nutr101-criteria
    intendedOutcome:
      practical: >
        The reader keeps batch-cooking rice, stops counting a saving that is not
        there, and cools and stores it safely.
    sources:
      - citation: >
          Resistant starch (RS3) formation on retrogradation of cooked rice;
          increases of roughly 1-2 g per 100 g cooked are typical in the literature.
        confidence: medium
      - citation: >
          Resistant starch contributes approximately 2 kcal/g via colonic
          fermentation, against about 4 kcal/g for digestible starch (EU labelling
          convention for fibre is 2 kcal/g).
        confidence: medium
      - citation: >
          The widely-circulated "up to 60% fewer calories" claim originates in an
          unpublished undergraduate project presented at an ACS meeting (2015),
          which measured resistant starch content rather than human energy absorption.
        confidence: contested
        accessedAt: '2026-07-30'
      - citation: >
          UK FSA guidance on cooked rice — Bacillus cereus spores survive cooking
          and the emetic toxin is heat-stable.
        confidence: high
    solutionFamilies:
      - id: arithmetic
        summary: Multiply the resistant starch gain by the energy difference and compare to the daily total.
        whyAcceptable: Answers the question actually asked, which was about the reader's numbers.
      - id: proportionate-dismissal
        summary: Show the saving is inside the noise of portioning, and redirect to levers that matter.
        whyAcceptable: Correct, and more useful to someone counting calories.
        boundaries: Must still give a figure; "negligible" alone is band 2.
    commonFailureModes:
      - label: headline-inherited
        description: Explains the mechanism correctly and carries the 60 per cent figure along with it.
        domain: reasoning
        severity: critical
      - label: no-arithmetic
        description: Calls the effect small without multiplying it out.
        domain: reasoning
        severity: major
      - label: cereus-unmentioned
        description: Discusses batch-cooked chilled rice without the food-safety rule.
        domain: safety
        severity: critical
      - label: coconut-oil-endorsed
        description: Repeats the coconut-oil variant of the claim as established.
        domain: reasoning
        severity: major
    workedExamples:
      - kind: exceptional
        answer: >
          Mechanism real, number wrong. Cooling raises resistant starch by roughly
          1-2 g per 100 g of cooked rice, and resistant starch still yields about
          2 kcal/g against 4 — so on 200 g you save perhaps 4 to 8 kcal, against a
          260 kcal portion and a 1,900 kcal day. Five nights a week is about a third
          of a biscuit. The 60 per cent came from an unpublished student project
          that measured starch, not absorption. Do it for the gut fermentation and
          the frying texture. And since you are chilling rice — cool it fast in a
          shallow tray, fridge within the hour, use within a day.
        whyItLandsHere: All eight criteria, with the arithmetic shown.
        expectedBand: 4
      - kind: competent-ordinary
        answer: >
          The effect is real but far smaller than 60 per cent — you would be saving
          a handful of calories per portion, not half. Not worth reorganising your
          week for. Do make sure you cool the rice quickly and refrigerate it, as
          cooked rice left out is a food-poisoning risk.
        whyItLandsHere: c1, c6 and a partial c3; no arithmetic, no comparison to the daily total.
        expectedBand: 3
      - kind: plausible-but-wrong
        answer: >
          Yes — this is one of the better-evidenced kitchen hacks. Cooling converts
          a large share of the digestible starch into resistant starch, and studies
          have found reductions of 50 to 60 per cent in available calories, which
          reheating does not reverse. On 200 g that is roughly 150 kcal saved per
