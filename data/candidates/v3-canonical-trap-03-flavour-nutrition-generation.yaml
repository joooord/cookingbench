      recommending aromatics anyway.
    failureTaxonomy:
      - domain: sensory
        label: more-aromatics
      - domain: context
        label: weight-loss-ignored
      - domain: sensory
        label: umami-discarded
      - domain: reasoning
        label: no-parosmia-check
  provenance:
