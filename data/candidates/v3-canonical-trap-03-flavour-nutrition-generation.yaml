    author: agent-draft (claude-opus-5)
    authoringChain:
      - stage: agent-draft
        actor: claude-opus-5
        actorVersion: claude-opus-5, 2026-07-30 authoring session
        at: '2026-07-30'
        transformation: >
          Authored to docs/authoring/frontier-item-principle.md as the flav-013
          shape — a stated fact about a guest that inverts the canonical answer.
          No model was called.
        notes: M3.9 — agent-drafted; the chemesthesis claims need a named source before admission.
    modelExposures:
