        expectedBand: 0
        expectedScoreMax: 10
      - kind: clearly-failing
        answer: Yes, cold rice has fewer calories than hot rice. Worth doing.
        whyItLandsHere: Endorses the claim, no mechanism, no magnitude, no safety.
        expectedBand: 0
        expectedScoreMax: 5
  outputContract:
    format: prose
