# =============================================================================
# flav-101 — the herbs he cannot smell
# =============================================================================
- id: flav-101
  category: flavor-pairing
  difficulty: 5
  status: candidate
  addedIn: v3
  trap: true
  public: true
  authoringProvenance: agent-draft
  canonicalTrap: >
    "Food tastes of nothing" has one overwhelmingly canonical answer in every
    cookery column ever written — go heavier on aromatics: fresh herbs, spice
    blends, garlic, a squeeze of something at the end. It is the single worst
    advice available here, because aromatics are the channel he has lost, and
    the cook has already tried exactly that and reported it failing.
  defeatingFact: >
    Most of what is called flavour is retronasal olfaction, and herbs and spices
    are almost entirely aroma compounds — invisible to an anosmic diner. What
    survives is the five basic tastes, the trigeminal or chemesthetic channel
    (capsaicin on TRPV1, menthol on TRPM8, the mustard-and-horseradish isothio-
    cyanates on TRPA1, piperine, ginger, the prickle of carbonation), plus
    temperature and texture. Those are the levers, and they are a different list.
  prompt: >
    My dad has been living with us since March. He lost his sense of smell after
    a bad virus two winters ago and it has not come back. He has stopped enjoying
    food and he is down about six kilos, which is worrying my mum more than she
    lets on. I have been going heavier on the herbs and spices for him — lots of
    rosemary, smoked paprika, garlic, fresh coriander at the end — and he still
    says it all tastes of nothing. I am cooking Sunday lunch for the two of them.
    What should I change?
  grader:
    type: llm-judge
    judgeMode: dimension
    judgeWeight: 1.0
    rubric: &flav101-criteria
      - id: c1
        kind: critical
        statement: States that herbs and spices work through smell, so adding more cannot help him.
        weight: 5
        dimension: sensory channel selection
        failureLabel: more-aromatics
      - id: c2
        kind: include
        statement: Names the channels that survive anosmia.
        weight: 5
        dimension: sensory channel selection
        evidence: Basic tastes, trigeminal or chemesthetic sensation, texture, temperature.
      - id: c3
        kind: include
        statement: Names specific trigeminal ingredients rather than the category.
        weight: 4
        dimension: sensory channel selection
        evidence: Mustard, horseradish, chilli, black pepper, ginger, Sichuan pepper, carbonation.
      - id: c4
        kind: include
        statement: Uses texture and temperature contrast deliberately in the menu.
        weight: 3
        dimension: sensory channel selection
      - id: c5
        kind: critical
        statement: Treats the six-kilo weight loss as the priority it is.
        weight: 5
        evidence: Energy density, smaller frequent meals, and a prompt to see a GP or dietitian.
        failureLabel: weight-loss-ignored
      - id: c6
        kind: exceptional
        statement: Distinguishes anosmia from parosmia and says how the advice would change.
        weight: 3
        evidence: If food tastes wrong rather than absent, the trigger foods are avoided instead.
      - id: c7
        kind: exceptional
        statement: Mentions smell training as something with evidence behind it.
        weight: 2
      - id: c8
        kind: avoid
        statement: Does not recommend more fresh herbs or aromatic spice blends as the fix.
        weight: 4
  anchors:
    - dimension: sensory channel selection
      definition: Whether the answer selects levers that reach a diner with no sense of smell.
      bands:
        - band: 0
          descriptor: Recommends more herbs, spices and aromatics as the main fix.
        - band: 1
          descriptor: Recommends seasoning more heavily in general and mentions texture in passing.
        - band: 2
          descriptor: States that smell carries most of flavour and still builds the menu on aromatics.
        - band: 3
          descriptor: Selects taste and texture levers and omits the trigeminal ingredients entirely.
        - band: 4
          descriptor: Selects salt, acid and umami, names trigeminal ingredients such as mustard and chilli, and specifies texture and temperature contrasts course by course.
  judgingNotes: >
    The cook has already run the canonical experiment and reported the result in
    the prompt, which is what makes repeating it so damning. c1 and c5 are both
    decisive and they are independent: an answer can get the sensory science right
    and still miss that a 71-year-old losing six kilos needs calories and a
    clinician, and an answer can handle the weight loss well and still prescribe
    rosemary. Credit any correct naming of the surviving channels, with or without
    the receptor names — "the burn and tingle senses, which are nerve rather than
    smell" is fine. Do not credit umami as though it were an aroma. Note that
    glutamate is a taste and survives, so parmesan, anchovy, tomato and soy remain
    useful even though their smell does not reach him; an answer that discards
    them along with the herbs has over-corrected.
  referenceAnswer: >
    Stop adding herbs and spices. That is not a criticism of the cooking — it is
    that almost everything they do is smell, and smell is the channel he has lost.
    What we call flavour is mostly retronasal aroma; rosemary, paprika, garlic and
    coriander are aroma compounds almost end to end, so for him they are close to
    invisible, which is exactly what he has been telling you. Four things do still
    reach him. The basic tastes, which are tongue rather than nose: salt, acid,
    sweetness, bitterness and savouriness. Glutamate counts here and is your best
    friend — parmesan, anchovy, tomato purée, soy, dried mushroom, a good stock.
    The trigeminal senses, which are nerve endings rather than smell: the burn of
    chilli and black pepper, the sharp lift of English mustard and horseradish, the
    heat of ginger, the tingle of Sichuan pepper, the prickle of a sparkling drink.
    Texture. And temperature. So for Sunday, keep the roast and change the levers.
    Salt the meat properly and taste the gravy up to the top of what is pleasant.
    Put a bowl of horseradish on the table — grate fresh if you can, it is far
    stronger — and English mustard. Serve something sharp: pickled red cabbage, a
    salsa verde loaded with capers and vinegar rather than with the herbs.
    Roast the potatoes hard so they shatter, and keep something raw and crunchy on
    the plate. Serve hot food genuinely hot and put something cold alongside it, so
    the contrast registers. For pudding, something with real acidity — a sharp
    lemon posset or a rhubarb crumble — rather than something purely sweet, which
    reads as one note. The weight is the more urgent thing and it deserves saying
    plainly: six kilos is a lot, and it is worth a GP appointment and a referral to
    a dietitian, both for the loss itself and because appetite loss after smell
    loss is well recognised. In the meantime, make everything he eats denser —
    butter, cream, olive oil, full-fat everything, and smaller plates more often
    rather than three big ones. Two last things. Ask him whether food tastes of
    nothing or tastes wrong. If things taste foul or rotten — coffee, onions,
    roasting meat are the classic offenders — that is parosmia rather than
    anosmia, and the whole approach inverts: you avoid the trigger foods rather
    than pushing harder. And smell training, sniffing four strong scents twice a
    day for months, has reasonable evidence behind it and costs nothing.
  failingAnswer: >
    The trick with a lost sense of smell is to push the aromatics much harder than
    you would for anyone else — his threshold is higher, so he needs more of
    everything. Double the rosemary, use smoked paprika and garlic generously,
    finish with plenty of fresh coriander and a good grating of lemon zest, and add
    a bay leaf and a cinnamon stick to the gravy for depth. Toasting the spices
    first will release far more aroma. A really fragrant roast will fill the house
    with smell and get his appetite going before he even sits down.
  judgePack:
    capabilityUnderTest: >
      Choosing sensory levers that reach the diner in front of you, when the
      canonical advice for the stated symptom targets a channel that diner has lost.
    hardConstraints:
      - The advice must not rest on aroma.
      - The weight loss must be addressed, including a route to a clinician.
    criteria: *flav101-criteria
    intendedOutcome:
      sensory: >
        A lunch that registers as salty, sharp, savoury, hot-and-cold and crunchy —
        loud on every channel except the one that is gone.
      practical: He eats more than he has been, and the weight loss is escalated.
    sources:
      - citation: >
          Retronasal olfaction accounts for the majority of what is experienced as
          flavour; anosmia leaves the gustatory and trigeminal systems intact.
        confidence: high
      - citation: >
          Chemesthesis — capsaicin (TRPV1), menthol (TRPM8), allyl isothiocyanate
          (TRPA1) and piperine act on trigeminal nerve endings, not the olfactory
          epithelium.
        confidence: high
      - citation: >
          Post-viral parosmia and its common trigger set (coffee, onion, garlic,
          roasting meat, chocolate); olfactory training protocols.
        confidence: medium
    solutionFamilies:
      - id: taste-and-trigeminal
        summary: Rebuild the meal on salt, acid, umami, burn, crunch and temperature contrast.
        whyAcceptable: Every lever reaches a diner with no olfaction.
      - id: condiment-led
        summary: Cook the lunch as normal and put strong condiments on the table for him.
        whyAcceptable: >
          Keeps one meal for everybody and gives him control over intensity, which
          matters when the rest of the table does not need it.
        boundaries: Fails if the condiments are aroma-led rather than pungent.
      - id: energy-first
        summary: Prioritise the weight loss — dense, frequent, appealing food and a referral.
        whyAcceptable: Addresses the outcome that actually matters, and is the honest first move.
        boundaries: Must still change the sensory approach, or it has answered a different question.
    commonFailureModes:
      - label: more-aromatics
        description: Prescribes more herbs, spices and aromatics — the channel he has lost.
        domain: sensory
        severity: critical
      - label: weight-loss-ignored
        description: Treats this as a flavour puzzle and never mentions the six kilos.
        domain: context
        severity: critical
      - label: umami-discarded
        description: Over-corrects and drops glutamate-rich ingredients along with the herbs.
        domain: sensory
        severity: minor
      - label: no-parosmia-check
        description: Assumes absence rather than distortion, when the two need opposite advice.
        domain: reasoning
        severity: minor
    workedExamples:
      - kind: exceptional
        answer: >
          Herbs and spices are almost pure aroma, so they are the one thing that
          cannot reach him — which is why your experiment failed. Work the channels
          that survive: salt and acid, glutamate (parmesan, anchovy, tomato, soy),
          and the trigeminal senses — horseradish and English mustard on the table,
          black pepper, ginger, a little chilli. Add crunch and hot-cold contrast.
          Separately: six kilos is a GP conversation, and everything he eats should
          be denser. Ask whether food tastes of nothing or tastes wrong — if it is
          wrong, that is parosmia and the advice reverses.
        whyItLandsHere: All eight criteria; changes channel, not volume.
        expectedBand: 4
      - kind: competent-ordinary
        answer: >
          Since smell carries most of flavour, focus on what he can still detect —
          salt, sourness, sweetness and texture. Season more assertively, add acidity,
          and make sure there is something crunchy. Also worth seeing a doctor about
          the weight loss.
        whyItLandsHere: c1, c2 partially, c5 present; no trigeminal ingredients at all.
        expectedBand: 3
      - kind: plausible-but-wrong
        answer: >
          With reduced smell you need to push aromatics harder than usual — his
          threshold is higher, so bloom whole spices in the pan first, double the
          rosemary, finish with plenty of fresh coriander and lemon zest, and let the
          smell of the roast fill the house to wake his appetite up before he sits
          down.
        whyItLandsHere: >
          Confident, technically competent cookery advice aimed squarely at the one
          channel that is gone, including a threshold argument that does not apply
          to a total loss. Fails c1, c2, c3 and c8.
        expectedBand: 0
        expectedScoreMax: 15
      - kind: clearly-failing
        answer: Add more salt and MSG, and try to make the food look nice so he eats with his eyes.
        whyItLandsHere: One correct lever by accident, nothing on texture, burn or the weight loss.
        expectedBand: 1
        expectedScoreMax: 25
  outputContract:
    format: prose
    maxWords: 600
  classification:
    primaryCapability: flavour-sensory
    secondaryCapabilities: [adaptation-lateral, technical-reasoning]
