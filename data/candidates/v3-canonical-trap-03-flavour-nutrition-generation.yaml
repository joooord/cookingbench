# =============================================================================
# flav-102 — big flavours, big wine
# =============================================================================
- id: flav-102
  category: flavor-pairing
  difficulty: 4
  status: candidate
  addedIn: v3
  trap: true
  public: true
  authoringProvenance: agent-draft
  canonicalTrap: >
    Endorse intensity matching. "Big food needs a big wine" is the most quoted
    rule in pairing, and a bold fruity Shiraz with a spicy spread is the answer
    almost every list gives.
  defeatingFact: >
    Ethanol potentiates capsaicin. Alcohol lowers the activation threshold of
    TRPV1 — the same receptor capsaicin opens — so a 15 per cent wine measurably
    increases the burn, and tannin plus capsaicin reads as harsh and drying. The
    levers that reduce perceived heat are residual sugar, low alcohol, low tannin
    and cold; casein in dairy strips capsaicin from the receptor, which is why
    lassi works. Intensity matching is the wrong axis; the axis is what the
    ethanol and tannin do to the receptor.
  prompt: >
    Doing a proper Sichuan-ish spread for my birthday — mapo tofu, dry-fried green
    beans, cumin lamb, a lot of chilli oil and a lot of Sichuan pepper. My brother
    is bringing two bottles of 2016 Barossa Shiraz, 15 per cent and quite oaky, on
    the grounds that big flavours need a big wine. He is proud of them and will be
    hurt if we do not open them. What should we actually be drinking, and what do I
    do about the Shiraz?
  grader:
    type: llm-judge
    judgeMode: dimension
    judgeWeight: 1.0
    rubric: &flav102-criteria
      - id: c1
        kind: critical
        statement: States that a high-alcohol tannic red will amplify the chilli heat rather than match it.
        weight: 5
        dimension: pairing mechanism
        failureLabel: intensity-matching
      - id: c2
        kind: include
        statement: Names the mechanism — ethanol potentiating capsaicin, tannin reading as harsh with heat.
        weight: 4
        dimension: pairing mechanism
      - id: c3
        kind: include
        statement: Names what does work, with the properties spelled out.
        weight: 5
        dimension: pairing mechanism
        evidence: Off-dry, low alcohol, low tannin, served cold — Riesling Kabinett, Lambrusco, lager, jasmine tea.
      - id: c4
        kind: include
        statement: Solves the brother's bottles rather than dismissing them.
        weight: 4
        evidence: Serve them with the cumin lamb, or after the meal with cheese or on their own.
      - id: c5
        kind: exceptional
        statement: Notes that Sichuan pepper's tingle is a separate sensation from chilli heat.
        weight: 3
        evidence: Hydroxy-alpha-sanshool acts on touch receptors, and it numbs, which further muddles wine.
      - id: c6
        kind: exceptional
        statement: Mentions that dairy binds capsaicin, so a yoghurt drink outperforms any wine at cooling.
        weight: 2
      - id: c7
        kind: avoid
        statement: Does not recommend a bold red on the grounds that the food is bold.
        weight: 4
  anchors:
    - dimension: pairing mechanism
      definition: Whether the pairing is reasoned from what the components do to each other or from matching intensity.
      bands:
        - band: 0
          descriptor: Recommends the Shiraz on the grounds that big food needs a big wine.
        - band: 1
          descriptor: Recommends a bold fruity red and suggests chilling it slightly.
        - band: 2
          descriptor: States that high alcohol clashes with chilli and proposes no specific alternative.
        - band: 3
          descriptor: Names an off-dry low-alcohol wine and gives no reason beyond sweetness balancing heat.
        - band: 4
          descriptor: Names ethanol potentiating capsaicin, specifies an off-dry low-tannin wine served cold, and places the Shiraz where it works.
  judgingNotes: >
    The brother's premise is stated in the prompt and it is the trap: agreeing
    with it is both the canonical pairing answer and the socially easy one. c1 is
    decisive. c4 is what separates a good answer from a correct one — the bottles
    are a fixed constraint and an answer that simply says "do not open them" has
    solved the wine problem and created a family one. Credit any defensible
    placement: with the cumin lamb specifically, which is the least chilli-forward
    dish and has the fat and spice to take oak; after the food; or poured at the
    start before the heat builds. Do not require the receptor name; "alcohol makes
    the burn worse" with a consequence is enough for c2.
  referenceAnswer: >
    Your brother has the most quoted rule in wine and it is the wrong one here.
    Intensity matching works for richness; it fails for heat, because the
    interaction is not about weight but about what alcohol does to the receptor.
    Capsaicin binds TRPV1, the same receptor that responds to heat, and ethanol
    lowers that receptor's activation threshold — so a 15 per cent wine does not
    stand up to chilli, it turns the volume up on it. The tannin compounds the
    problem: with capsaicin already firing, tannin reads as harsh and drying rather
    than structured, and the oak lands as bitter. Two glasses in, everybody is
    sweating and nobody can taste the food. What actually cools and refreshes is
    the opposite profile — some residual sugar, low alcohol, low tannin, and served
    properly cold. A German Riesling Kabinett at 8 or 9 per cent is the classic and
    is genuinely hard to beat; a chilled Lambrusco if you want red in the glass; a
    cold lager; or jasmine or oolong tea, which is what the food grew up with. If
    you want the single most effective thing, it is not a wine at all — dairy
    casein physically strips capsaicin off the receptor, so a salted yoghurt drink
    cools better than anything fermented from grapes. Now, the Shiraz. Do not leave
    it in the bag. Open one at the start, before the chilli oil has built up on
    everybody's palate, and pour it with the cumin lamb — that is your least
    chilli-forward dish, and its fat and toasted spice can meet oak and 15 per cent
    on level terms. Then move the table onto the Riesling and the beer for the mapo
    tofu, and bring the second bottle back out at the end with something salty when
    the heat has faded. He gets both bottles poured, they show at their best, and
    nobody spends the evening in pain. One aside worth knowing — the Sichuan pepper
    is doing something different again. Its tingle is not heat at all but a
    vibration on the touch receptors, and it partly numbs the mouth, which is
    another reason a serious wine is wasted on that half of the table.
  failingAnswer: >
    Your brother is right — this is a case where you need a wine with enough
    presence to stand up to the food. A big Barossa Shiraz has the ripe fruit and
    the structure to take on chilli, and the sweetness of that ripe fruit balances
    the heat nicely. Serve it at cool room temperature to keep it fresh. If you
    want a second option, another full-bodied red such as a Zinfandel or a Malbec
    works on the same principle. Avoid delicate whites, which will be completely
    overwhelmed by a spread this powerful.
  judgePack:
    capabilityUnderTest: >
      Pairing from the mechanism of the interaction rather than by matching
      intensity, while solving a social constraint the cook cannot ignore.
    hardConstraints:
      - Both bottles must be opened and shown well.
      - The recommendation must reduce, not amplify, perceived heat.
    criteria: *flav102-criteria
    intendedOutcome:
      sensory: >
        Heat that stays bright rather than building; a cold, faintly sweet drink
        that resets the palate between mouthfuls.
      practical: Both Shiraz opened and enjoyed at the point in the meal where they work.
    sources:
      - citation: >
          Ethanol lowers the TRPV1 activation threshold, potentiating capsaicin-
          evoked burning (Trevisani et al., Nature Neuroscience, 2002).
        confidence: high
      - citation: >
          Casein binds capsaicin and reduces perceived pungency, which is why dairy
          outperforms water and alcohol as a coolant.
        confidence: high
      - citation: >
          Hydroxy-alpha-sanshool in Sichuan pepper produces a paraesthesia via
          mechanoreceptors, distinct from capsaicin's burn.
        confidence: medium
      - citation: Residual sugar and low alcohol reduce perceived heat; standard sommelier practice.
        confidence: medium
    solutionFamilies:
      - id: off-dry-white
        summary: Riesling Kabinett or similar, served cold, with the Shiraz placed on the cumin lamb.
        whyAcceptable: Directly counteracts the burn and still opens both bottles.
      - id: beer-and-tea
        summary: Cold lager and jasmine tea through the meal, Shiraz at the end.
        whyAcceptable: What the cuisine is actually drunk with; no pretence that wine must be present.
        boundaries: Must still place the Shiraz somewhere.
      - id: chilled-light-red
        summary: A chilled low-tannin red — Lambrusco, a light Gamay — for those who want red.
        whyAcceptable: Keeps red in the glass while removing the tannin and dropping the temperature.
    commonFailureModes:
      - label: intensity-matching
        description: Recommends a big wine because the food is big.
        domain: reasoning
        severity: critical
      - label: fruit-as-sweetness
        description: Treats ripe fruit character in a dry wine as residual sugar that will balance heat.
        domain: sensory
        severity: major
      - label: bottles-abandoned
        description: Tells the cook not to open the brother's wine, ignoring the stated constraint.
        domain: context
        severity: major
      - label: tannin-unmentioned
        description: Addresses alcohol and ignores that tannin plus capsaicin reads as harsh.
        domain: sensory
        severity: minor
    workedExamples:
      - kind: exceptional
        answer: >
          Intensity matching fails on heat: ethanol lowers the threshold of the same
          receptor capsaicin opens, so 15 per cent turns the burn up, and tannin
          with capsaicin reads as harsh. Drink off-dry, low-tannin and cold —
          Riesling Kabinett, chilled Lambrusco, cold lager or jasmine tea. Open the
          Shiraz early with the cumin lamb, which is the least chilli-forward dish
          and can take oak, and bring the second out at the end. If you want real
          relief, a salted yoghurt drink beats any wine, because casein strips
          capsaicin off the receptor.
        whyItLandsHere: All seven criteria; solves the wine, the food and the brother.
        expectedBand: 4
