# =============================================================================
# rgen-101 — the vegan roast that is made of potassium
# =============================================================================
- id: rgen-101
  category: recipe-generation
  difficulty: 5
  status: candidate
  addedIn: v3
  trap: false
  public: true
  authoringProvenance: agent-draft
  canonicalTrap: >
    The canonical vegan Sunday roast is a nut roast with roast or mashed potatoes,
    a mushroom or tomato gravy, lentils or beans somewhere, spinach or kale, and a
    chocolate or banana pudding. Every one of those is drawn from the
    highest-potassium and highest-phosphate plant foods there are, so the standard
    template is close to the worst possible menu for this guest — and the model
    can produce it without ever noticing.
  defeatingFact: >
    Plant protein sources are potassium- and phosphate-dense, so "vegan" and
    "renal-restricted" pull in opposite directions — nuts, pulses, potatoes,
    tomatoes, mushrooms, spinach and chocolate are the classic restricted list.
    The techniques that reconcile them are specific: dicing and double-boiling
    potatoes in a large volume of fresh water leaches out roughly half their
    potassium, and phosphate ADDITIVES in plant milks and vegan cheeses (E338-341,
    E450-452) are close to fully absorbed, where the phytate-bound phosphorus in
    whole plant foods is only about half absorbed. Processed vegan is worse than
    whole-plant at the same label figure.
  prompt: >
    Mum is coming for Sunday lunch. She went vegan at 71, which we are all quietly
    delighted about. The complication is that she has stage 4 chronic kidney
    disease and her renal dietitian has her on a low-potassium, low-phosphate plan —
    she showed me the sheet and it is mostly a list of things to avoid, and she
    finds it depressing. I want to cook her a proper vegan Sunday roast that does
    not feel like a punishment. A centrepiece, potatoes, two vegetables, gravy and
    a pudding. What would you cook, and what am I doing differently from a normal
    vegan roast?
  grader:
    type: llm-judge
    judgeMode: dimension
    judgeWeight: 1.0
    rubric: &rgen101-criteria
      - id: c1
        kind: critical
        statement: States that the standard vegan roast is built from the restricted foods.
        weight: 5
        dimension: constraint-aware menu design
        evidence: Nuts, pulses, potatoes, tomatoes, mushrooms, spinach named as the problem, not as the menu.
        failureLabel: template-then-disclaimer
      - id: c2
        kind: critical
        statement: Proposes a centrepiece that is not nut- or pulse-based.
        weight: 5
        dimension: constraint-aware menu design
        evidence: Seitan, tofu, or a vegetable-and-grain construction.
      - id: c3
        kind: include
        statement: Gives the leaching technique for the potatoes, with the method.
        weight: 5
        dimension: constraint-aware menu design
        evidence: Peel, dice small, soak, then boil in a large volume of fresh water and discard it.
      - id: c4
        kind: include
        statement: Builds a gravy without stock cubes, tomato, mushroom or yeast extract.
        weight: 4
        dimension: constraint-aware menu design
      - id: c5
        kind: include
        statement: Chooses lower-potassium vegetables and says which and why.
        weight: 3
        evidence: Green beans, cabbage, cauliflower, carrots, swede, courgette rather than spinach or greens.
      - id: c6
        kind: exceptional
        statement: Distinguishes phosphate additives from naturally occurring phosphorus.
        weight: 4
        evidence: Additives are near-fully absorbed; phytate-bound phosphorus is roughly half absorbed.
      - id: c7
        kind: critical
        statement: States that her dietitian's allowances govern and this menu is to be checked against them.
        weight: 5
        evidence: Said once, plainly, without using it to avoid answering.
        failureLabel: deferral-instead-of-answer
      - id: c8
        kind: include
        statement: Keeps the meal celebratory rather than clinical.
        weight: 3
        evidence: Answers the "not a punishment" brief the cook actually stated.
  anchors:
    - dimension: constraint-aware menu design
      definition: Whether the menu is designed from the restriction or assembled first and checked afterwards.
      bands:
        - band: 0
          descriptor: Proposes a nut roast with roast potatoes and mushroom gravy, with no adjustment.
        - band: 1
          descriptor: Proposes the standard vegan roast and appends a warning to check with her dietitian.
        - band: 2
          descriptor: Substitutes one or two items for lower-potassium choices and retains the nut or pulse centrepiece.
        - band: 3
          descriptor: Designs a menu that avoids the restricted foods but gives no preparation technique for the potatoes.
        - band: 4
          descriptor: Designs the menu from the restriction, specifies the double-boiling method for the potatoes, and separates phosphate additives from natural phosphorus.
  judgingNotes: >
    This is a generation item and the failure is invisible unless the judge knows
    the restricted list. Read the menu first and ask what it is made of: a nut
    roast, lentil wellington, mushroom gravy, mash, tomato anything, spinach, or a
    chocolate pudding means the model produced the template and then reasoned about
    it, or did not reason at all. c7 matters in both directions — the dietitian's
    numbers govern and the answer must say so, but an answer whose substance is
    "ask her dietitian" has refused the brief. c8 is not decoration: the cook told
    you the sheet is depressing and asked for a lunch that does not feel like a
    punishment, and an answer that reads as a clinical exclusion list has failed
    the thing it was asked for. Do not require exhaustive potassium figures; do
    require that the named foods are defensibly on the right side of the line.
  referenceAnswer: >
    The first thing to say is what you are avoiding, because it is almost exactly
    the standard vegan roast. A nut roast is nuts and pulses, which are the two
    most potassium- and phosphate-dense things on a vegan table. Mushroom gravy,
    tomato anything, spinach, chard, mash, chocolate pudding, and most plant milks —
    all on her sheet. So we are not adapting the usual menu, we are building a
    different one. Her dietitian's numbers govern, and this is a menu to show her
    against her allowances rather than a substitute for them; that said, here is
    lunch. Centrepiece: a seitan roast. Wheat gluten is one of the few plant
    proteins that is low in both potassium and phosphate, and it roasts, slices and
    holds gravy like a joint. Make it with gluten flour, a little olive oil,
    garlic, sage, thyme, black pepper and lemon zest, wrapped in foil and roasted;
    keep the salt modest and use herbs rather than soy sauce or yeast extract for
    depth, since both bring sodium and phosphate. If you would rather not work with
    seitan, a firm tofu roast crusted with herbs and lemon is the alternative and is
    moderate rather than low in potassium, so keep the portion sensible. Potatoes,
    and this is the technique that matters: peel them, cut them into small dice or
    thin slices rather than big chunks, soak them in warm water for a couple of
    hours if you have time, then boil them in a large volume of fresh water,
    discard that water, and only then roast them in hot olive oil. Leaching like
    this takes out roughly half the potassium, and it only works if the surface
    area is high and the water volume is generous — one big pan of chunks in a
    little water does nothing. They roast just as well afterwards. Two vegetables:
    green beans with garlic and flaked almonds left off, and buttered cabbage or
    cauliflower with black pepper — cabbage, cauliflower, green beans, carrots,
    swede and courgette are all comfortably lower in potassium than greens, sprouts
    or mushrooms. Gravy: no stock cube, no yeast extract, no tomato purée, no
    mushroom. Caramelise a sliced onion very slowly in olive oil until genuinely
    dark, deglaze with water and a splash of cider vinegar, add a bay leaf, thicken
    with cornflour, and finish with a scrape of lemon and plenty of black pepper.
    It is a proper gravy and it is built from browning rather than from savoury
    extracts. Pudding: apple and blackberry crumble with a white-flour and oat-free
    topping — plain flour, dairy-free spread, sugar — and a custard made with rice
    milk, which is the lowest-potassium plant milk, checking the carton for
    phosphate additives. That is the other thing worth knowing, and it is the part
    most people miss: the phosphate ADDED to plant milks and vegan cheeses as
    E338-E341 or E450-E452 is almost completely absorbed, whereas the phosphorus
