  answerText: "Here are the two distinct problems you are facing and how to fix them:\n\n\
    **Problem 1: Undissolved Sugar (The Grittiness & Beading)**\n*   **The Cause:** The\
    \ sugar was added too quickly or wasn't beaten long enough to fully dissolve into the\
    \ egg whites. When sugar doesn't dissolve, it leaves a gritty texture and causes \"\
    beading\" (little golden droplets of sugary syrup that form on top of the baked meringue).\n\
    *   **The Fix:** Use superfine (caster) sugar, as it dissolves much faster than regular\
    \ granulated sugar. Wait until the egg whites reach soft peaks, then add the sugar very\
    \ slowly—about 1 tablespoon at a time—while beating continuously. Before baking, rub\
    \ a pinch of the meringue between your fingers; if it feels gritty, keep beating until\
    \ it is completely smooth. \n\n**Problem 2: Undercooked Meringue (The Weeping)**\n*\
    \   **The Cause:** \"Weeping\" (a watery layer of liquid that pools between the pie\
    \ filling and the bottom of the meringue) happens when the egg whites are undercooked.\
    \ \n*   **The Fix:** Always spread your meringue onto a **piping hot** pie filling,\
    \ making sure to seal the meringue completely to the edges of the crust. The heat from\
    \ the hot filling immediately starts cooking the underside of the meringue, binding\
    \ it to the pie and preventing that watery layer from forming."

