  expectedScore: 100
  toleranceAbs: 10
  answerText: 'Here’s what’s likely going wrong and how to fix it:


    1. **Overcrowding the Pan** – Too many veggies release steam, lowering the pan’s temperature.
    *Fix:* Cook in batches to allow proper browning.


    2. **Low Heat** – Stir-fries need high heat to sear, not steam. *Fix:* Use the highest
    heat setting and preheat the pan well (a wok or cast-iron skillet works best).


    3. **Too Much Oil or Sauce** – Excess liquid steams veggies. *Fix:* Use just enough
    oil to coat the pan (1–2 tbsp) and add sauce at the end.


    4. **Stirring Too Often** – Constant stirring prevents charring. *Fix:* Let veggies
    sit for 30–60 seconds between stirs to develop color.


    5. **Wet Vegetables** – Water clinging to veggies creates steam. *Fix:* Pat dry or air-dry
    washed veggies before cooking.


    **Bonus Tip:** Cut veggies uniformly (thin slices or small pieces) for even cooking.
    Hard veggies (carrots, broccoli) should be pre-cooked slightly (blanched or microwaved)
    before stir-frying.'

- questionId: tech-005
  note: '[stratum: concise-vs-padded] [source: 2026-07-v2.1 anthropic/claude-opus-5] [run
    seats: gpt-5.5=100, grok-4.5=100 (disagreement 0)] PAIR 5b (padded, 3,126 chars): same
    causes as the mistral anchor expanded 3x with pan metallurgy and wok-hei digressions.
    The digressions are sound; the pair tests that neither terseness nor enthusiasm moves
    the score.'
  expectedScore: 100
  toleranceAbs: 10
  answerText: 'Soggy stir-fry almost always comes down to **too much moisture and not enough
    sustained heat**. Home burners put out a fraction of a restaurant wok range''s BTUs,
    so anything that drops the pan temperature turns your stir-fry into a braise. Here''s
    the fix list, roughly in order of impact:


    **1. Stop crowding the pan**

    This is the #1 culprit. Too much food at once tanks the pan temperature, and the vegetables
    release water faster than it can evaporate — so they simmer in their own juices. Cook
    in batches, no more than a single loose layer at a time, and combine everything at the
    end.


    **2. Dry your vegetables thoroughly**

    Water on the surface must boil off before browning can start, and that steam wilts everything
    around it. Spin washed vegetables in a salad spinner or pat them dry with towels. Same
    goes for frozen vegetables — thaw and dry them, or skip them entirely for stir-fries.


    **3. Preheat until the pan is genuinely ripping hot**

    Heat the dry pan over your highest setting for 2–3 minutes, until a flicked drop of
    water skitters and vaporizes almost instantly. *Then* add oil, swirl, and add food immediately.
    Adding oil to a cold pan and heating together loses you a lot of thermal headroom.


    **4. Use a flat-bottomed carbon steel pan or wok**

    A round-bottom wok only makes sense with a wok ring over a powerful gas flame — on a
    flat burner most of it never gets hot. Carbon steel is ideal: thin enough to get screaming
    hot, and it develops a nonstick patina. A heavy cast-iron skillet is the next best option
    because it stores heat well. Avoid thin nonstick pans, which can''t handle the temperature
    and often aren''t safe above ~450°F.


    **5. Cut for even, fast cooking, and stage your additions**

    Uniform, thin pieces cook through before they overcook outside. Add ingredients in order
    of density: onions, carrots, and broccoli stems first; peppers and snap peas next; leafy
    greens, bean sprouts, and garlic/ginger last. Hard vegetables like broccoli or carrots
    benefit from a 30–60 second blanch or a quick steam beforehand, then drained and dried
    well — you get tender interiors without lingering in the pan.


    **6. Add sauce at the very end, and keep it small**

    Pouring in liquid mid-cook instantly steams everything. Premix your sauce, add it in
    the final 30 seconds, and let it reduce and cling. If you want a thicker glaze, use
    a cornstarch slurry rather than more liquid.


    **7. Use a high-smoke-point oil**

    Peanut, grapeseed, rice bran, canola, or refined avocado oil. Save toasted sesame oil
    for finishing — it burns fast.


    **8. Let food sit still occasionally**

    Constant tossing prevents contact time. Spread the vegetables out, let them sear undisturbed
    for 20–30 seconds, then toss. That pause is where char comes from.


    **Bonus for gas stoves:** remove the wok''s contents-free "resting" habit and instead
    cook outdoors on a high-output propane wok burner if you get serious — that''s what
    actually produces *wok hei*, the smoky flavor from vaporized oil igniting above the
    pan. Indoors, you can approximate it by getting the pan hotter than feels reasonable
    and running your ventilation on full.'

