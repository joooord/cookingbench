  answerText: 'What a nice lineup. Here''s a board that works with vintage port, with one
    thing built in for your sister-in-law.


    **A note first:** vintage port''s classic partner is blue cheese, but current pregnancy
    guidance advises avoiding blue-veined cheeses and soft mould-ripened cheeses (brie,
    camembert, chèvre with a white rind) unless cooked. Hard cheeses are fine, even unpasteurised.
    So buy the blue — just make sure two or three of the four are firm, and keep the blue
    on its own end of the board with its own knife so nothing gets smeared around.


    **The four cheeses** (~150–175g each; ~750g total is plenty for six)


    1. **Stilton** — Colston Bassett or Cropwell Bishop. The pairing everyone''s expecting,
    and rightly so.

    2. **Clothbound aged Cheddar** — Montgomery''s, Westcombe, or a good Cabot Clothbound.
    Brothy, nutty, stands up to the sweetness.

    3. **Aged Gouda, 3–4 years** — Beemster XO or L''Amuse. Butterscotch and crystals; genuinely
    the sleeper hit with port.

    4. **Comté 18–24 months** (or Manchego Viejo if you want something a bit sharper). Rounds
    the board out and gives your sister-in-law a third safe option.


    **Accompaniments**

    - Walnuts (toasted) and Marcona almonds — walnuts especially with the Stilton

    - Membrillo or fig jam

    - Fresh pears or crisp apple, plus grapes

    - Dried figs and Medjool dates

    - A few squares of 70% dark chocolate — surprisingly good with vintage port

    - Oatcakes, water biscuits, and a plain baguette


    Skip sharp pickles and chutneys — vinegar fights port. Also skip pâté if you were considering
    charcuterie, as that''s off-limits in pregnancy too; cooked ham or a firm salami is
    fine.


    **For your sister-in-law to drink:** something with a bit of ceremony rather than juice
    in a tumbler. A good alcohol-free sparkling (Wild Idol or a decent alcohol-free traditional-method),
    or verjus and soda over ice with a twist. Pomegranate juice with sparkling water works
    well against the cheese too.


    **Serving the port:** decant it — vintage throws a heavy sediment — an hour or two ahead,
    and serve just below room temperature.'

