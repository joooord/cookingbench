# Judge calibration anchors — hand-scored answers the judge must reproduce
# before any paid judging run is accepted (gate: MAE ≤ 10, no anchor off by
# more than its toleranceAbs). Expected scores follow the judge-v2 deduction
# scheme: critical −40, major −15, minor −5 from 100.

- questionId: tech-003
  note: perfect answer — zero findings expected
  expectedScore: 100
  toleranceAbs: 10
  answerText: >
    Resting lets the juices redistribute through the meat as the muscle fibres
    relax, so they stay in the steak instead of running out when you cut it.
    Carryover heat also finishes the centre by a few degrees. For a thick
    ribeye, rest 5–10 minutes, loosely tented with foil so the crust doesn't
    steam.

