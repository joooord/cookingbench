    \ dried porcini, if you have it.\n  - A splash of good olive oil also helps replace\
    \ some of the richness lost from pork and cheese.\n\nA practical starting point:\n\n\
    - 2 lb meat blend\n- 1½–2 cups soft breadcrumbs, soaked and squeezed out\n- 2 eggs\n\
    - ⅓ cup nutritional yeast\n- ½ cup chopped parsley\n- 3–4 garlic cloves, finely grated\n\
    - 1 tsp mushroom powder (optional but excellent)\n- 1½–2 tsp kosher salt, depending\
    \ on the stock/breadcrumbs\n- Black pepper\n- 2 tbsp olive oil\n\nBrown one tiny test\
    \ patty before rolling everything, then adjust salt, garlic, and nutritional yeast.\
    \ That’s the easiest way to get the “Nonna” flavor right.\n\n### Important kosher and\
    \ allergy details\n\n- For your partner’s father, the meat itself should be **kosher-certified**,\
    \ not just pork-free. If he keeps kosher strictly, cookware, pans, utensils, oven, and\
    \ even the kitchen’s prior use matter too. In that case, ask your partner what level\
