    \ won't rise.\n   Diagnosis: Check the expiration date of your yeast and ensure it's\
    \ stored properly. Try using a new packet of yeast or testing its activity by mixing\
    \ it with warm water and sugar.\n\n4. **Inadequate temperature or environment**: Yeast\
    \ thrives in a warm, draft-free environment. \n   Diagnosis: Check the temperature of\
    \ your proofing area (around 75°F to 80°F is ideal). Ensure the dough is not exposed\
    \ to drafts or cold surfaces.\n\n5. **Old or low-quality flour**: Using old or low-protein\
    \ flour can result in a dense bread.\n   Diagnosis: Try using a fresh batch of bread\
    \ flour with a higher protein content (around 12%).\n\n6. **Insufficient salt or excessive\
    \ salt**: Too little salt can lead to over-proofing, while too much salt can inhibit\
    \ yeast activity.\n   Diagnosis: Check your salt quantity and adjust it according to\
    \ the recipe.\n\n7. **Inadequate kneading**: Insufficient kneading can result in under-developed\
    \ gluten, leading to a dense bread.\n   Diagnosis: Check your kneading technique and\
    \ time. Try kneading for a longer time or using a stand mixer with a dough hook attachment.\n\
    \nTo resolve the issue, start by checking the most likely causes (insufficient proofing\
    \ and overmixing) and adjust your recipe and technique accordingly."

- questionId: flav-004
  note: '[stratum: panel-split] [source: 2026-07-v2.1 anthropic/claude-opus-5] [run seats:
    gpt-5.5=60, grok-4.5=100 (disagreement 40, flagged)] Contested constraint reading: rub
    names exactly five spices, then the paste adds 6 cloves of garlic (and salt/oil, which
    the answer itself excludes from the count). Is garlic a sixth spice or an excluded aromatic?
    Seats 60/100.'
  expectedScore: 80
  toleranceAbs: 25
  answerText: '## The Rub


    For one 5–6 lb bone-in leg (scale by weight):


    | Spice | Amount | Why it''s in |

    |---|---|---|

    | **Coriander seed** | 2 tbsp | The backbone. Citrus-floral top notes (linalool) lift
    lamb''s heavy, lanolin-ish fat instead of fighting it. Also the most forgiving spice
    at high heat — it doesn''t turn bitter on a roast''s exterior. |

    | **Cumin seed** | 1 tbsp | Earthy, sulfurous-savory; it echoes the same barnyard compounds
    in lamb fat, so it reads as amplification rather than masking. This pairing is universal
    from Morocco to Xinjiang for a reason. |

    | **Fennel seed** | 2 tsp | The degreaser. Anethole (sweet anise) cuts richness and
    makes a fatty leg taste lighter by the third slice. Also caramelizes beautifully into
    the crust. |

    | **Black peppercorn** | 2 tsp | Heat plus resiny pine/citrus notes. Piperine is the
    bridge that ties the earthy and sweet spices together; without it the rub tastes flat
    and muddy. |

    | **Cinnamon (cassia), ground** | ½ tsp | The secret weapon, used *sparingly*. A warm-sweet
    undertone that gives the rub Levantine/Greek depth and rounds the cumin''s rough edges.
    More than a scant ½ tsp and it tips into dessert. |


    Plus, not "spices": **3 tbsp Diamond Crystal kosher salt** (or 2 tbsp Morton — roughly
    1% of meat weight), **6 cloves mashed garlic**, and **3 tbsp olive oil** to make it
    a paste that clings.


    ## Method


    1. **Toast** the four whole seeds in a dry pan over medium until fragrant and the fennel
    darkens slightly, ~90 seconds. Cool, then grind **coarse** — you want texture in the
    crust, not dust. Stir in cinnamon.

    2. **Score** the fat cap in a ½-inch crosshatch; poke slits and press some paste in.
    Rub the rest everywhere.

    3. **Dry-brine uncovered in the fridge 12–24 hours.** Salt penetrates, surface dries,
    crust improves dramatically.

    4. **Roast at 275°F (135°C)** to 128–130°F internal for medium-rare (~2–2½ hrs), then
    rest 20 min and blast at 475°F for 8–10 minutes to crisp — or sear-finish under the
    broiler. Reverse order protects the ground spices from scorching.


    ## Swaps within the five-spice limit


    - **Smoked paprika for cinnamon** — more color and BBQ-forward; less elegant.

    - **Sumac for cinnamon** — sour-bright, great if serving with yogurt; add after roasting
    since acid dulls in heat.

    - **Aleppo pepper for black pepper** — fruitier, gentler heat, better crust color.


    Note that rosemary, oregano, thyme, and mint are *herbs*, so they''re outside the five-spice
    constraint — but a handful of chopped rosemary in the paste is the classic sixth element
    if you''re willing to bend the rule.'

