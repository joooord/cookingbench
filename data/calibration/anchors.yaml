- questionId: tech-003
  note: '[stratum: concise-vs-padded] [source: 2026-07-v2.1 anthropic/claude-fable-5] [run
    seats: gpt-5.5=100, grok-4.5=100 (disagreement 0)] PAIR 4b (padded, 1,341 chars): same
    content as the gpt-5.4-mini anchor plus carryover numbers, warm-plate and reverse-sear
    notes - all correct, none required. Must score with its concise twin.'
  expectedScore: 100
  toleranceAbs: 10
  answerText: '# Why Rest a Ribeye?


    Resting a steak after cooking serves a few key purposes:


    1. **Juice redistribution** — During cooking, heat drives moisture toward the center
    of the steak. Resting allows the juices to redistribute throughout the meat, so they
    stay in the steak rather than flooding your cutting board when you slice it.


    2. **Muscle fibers relax** — Heat causes muscle fibers to contract and tighten. As the
    steak rests and cools slightly, the fibers relax and can better hold onto moisture.


    3. **Carryover cooking** — The internal temperature continues to rise 3–5°F (or more
    for thick cuts) after you pull it from the heat, finishing the cook gently. This means
    you should pull the steak slightly *before* your target temperature.


    # How Long?


    For a thick ribeye (1.5–2 inches):


    - **Rest 5–10 minutes** — a common rule of thumb is about 5 minutes per inch of thickness,
    or roughly half the cooking time.

    - Rest it loosely tented with foil (not tightly wrapped, or you''ll steam the crust
    and lose that sear).

    - Place it on a warm plate or rack rather than a cold surface.


    # Pro Tip


    If you use a **reverse sear** method (low oven first, then a hot sear at the end), resting
    matters less because the gentle initial cooking doesn''t drive juices to the center
    as aggressively — you can slice almost immediately after the final sear.'

