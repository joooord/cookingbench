  answerText: '# Gluten-Free Chocolate Birthday Cake (Serves 10)


    ## Cake Ingredients


    - 300g gluten-free flour blend (with xanthan gum, or add ½ tsp separately)

    - 60g cocoa powder

    - 400g caster sugar

    - 10g baking powder

    - 5g baking soda

    - 3g salt

    - 3 large eggs (room temperature)

    - 240ml buttermilk (or milk + 1 tsp lemon juice)

    - 120ml vegetable oil

    - 10ml vanilla extract

    - 240ml hot coffee (or hot water)


    ## Chocolate Frosting Ingredients


    - 250g unsalted butter, softened

    - 450g icing (powdered) sugar

    - 90g cocoa powder

    - 100ml heavy cream (or milk)

    - 5ml vanilla extract

    - Pinch of salt


    ## Method


    ### Cake


    1. Preheat oven to **175°C**. Grease and line two 20cm round cake tins.

    2. In a large bowl, whisk together flour, cocoa powder, sugar, baking powder, baking
    soda, and salt.

    3. In a separate bowl, whisk eggs, buttermilk, oil, and vanilla until combined.

    4. Pour wet ingredients into dry ingredients and mix until smooth.

    5. Slowly stir in hot coffee — batter will be thin. This is correct.

    6. Divide batter evenly between tins.

    7. Bake for **30–35 minutes**, or until a skewer inserted in the centre comes out clean.

    8. Cool in tins for 10 minutes, then turn out onto a wire rack to cool completely.


    ### Frosting


    1. Beat softened butter until pale and creamy (about 3 minutes).

    2. Sift in icing sugar and cocoa powder; beat until combined.

    3. Add cream and vanilla, then beat on high speed for 3–4 minutes until light and fluffy.

    4. Add a pinch of salt to balance sweetness.


    ### Assembly


    1. Place one cake layer on a serving plate; spread a layer of frosting on top.

    2. Add the second layer and frost the top and sides evenly.

    3. Decorate with sprinkles, chocolate shavings, or candles as desired.


    **Tip:** Store leftovers in an airtight container at room temperature for up to 3 days.'

