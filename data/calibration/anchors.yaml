  answerText: '# Three-Element Garnish for Butternut Squash Soup


    Silky squash soup is sweet, rich, and uniformly smooth — so the garnish needs to add
    **acidity, texture, and aromatic contrast**.


    ## 1. Crispy Fried Sage Leaves (Texture + Aroma)

    Fry whole sage leaves in butter for 15–20 seconds until they crisp and turn translucent.


    **Why it works:** The shattering crunch breaks up the soup''s uniform silkiness, and
    sage''s piney, slightly bitter earthiness cuts through the squash''s sweetness. Bonus:
    drizzle a little of the browned sage butter over the top for nutty depth.


    ## 2. Tangy Crème Fraîche Swirl (Acidity + Richness Contrast)

    Thin crème fraîche with a squeeze of lemon juice and swirl it across the surface just
    before serving.


    **Why it works:** Butternut squash reads as flat and sweet without acid. The lactic
    tang brightens each spoonful and keeps the richness from becoming cloying. The white
    swirl also provides visual contrast against the orange soup.


    ## 3. Toasted Spiced Pepitas (Crunch + Heat + Thematic Echo)

    Toast pumpkin seeds in a dry pan, then toss with a touch of oil, smoked paprika, cayenne,
    and flaky salt.


    **Why it works:** Pepitas echo the squash family for cohesion, deliver a second layer
    of crunch, and the gentle heat and smokiness give the palate something savory to push
    against the sweetness. The salt seasons each bite at the surface, where you taste it
    first.


    ## The Balance in Summary

    | Element | Counters |

    |---|---|

    | Fried sage | Smooth texture, sweetness |

    | Crème fraîche + lemon | Richness, lack of acid |

    | Spiced pepitas | Sweetness, monotony (adds heat/salt) |


    Plate it as a swirl of crème fraîche, a small cluster of pepitas in the center, and
    2–3 sage leaves leaning against them — height and contrast make it restaurant-worthy.'

