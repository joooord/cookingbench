- questionId: tech-004
  note: '[stratum: correct-high] [source: 2026-07-v2.1 qwen/qwen3.7-max] [run seats: claude-opus-4.8=100,
    grok-4.5=100 (disagreement 0)] Correct seeding/agitation mechanism plus all standard
    preventions (no stirring after boil, interfering agent, wash down sides/lid, clean pan).
    Zero findings expected.'
  expectedScore: 100
  toleranceAbs: 10
  answerText: '**Why it happens:**

    Sugar naturally wants to return to its stable, solid state. Once the sugar has dissolved
    and the mixture comes to a boil, agitation (stirring) or the introduction of a "seed"
    crystal (a stray, undissolved grain of sugar on the side of the pan) triggers a chain
    reaction. This causes the dissolved sucrose molecules to rapidly link together and crystallize.


    **How to prevent it:**


    *   **Stop stirring:** Once the sugar has fully dissolved and the syrup begins to boil,
    do not use a spoon or spatula. If you need to even out the cooking, gently swirl the
    pan by the handle.

    *   **Add an "interfering agent":** Add a tablespoon of light corn syrup, or a pinch
    of cream of tartar (or a few drops of lemon juice) to the sugar and water at the very
    beginning. These ingredients introduce glucose and fructose, which physically block
    sucrose molecules from forming a crystal lattice.

    *   **Wash down the sides:** Keep a pastry brush dipped in warm water nearby to brush
    down the inside walls of the pot, dissolving any stray sugar crystals. Alternatively,
    cover the pot with a lid for the first 2–3 minutes of boiling; the trapped condensation
    will naturally wash the sides clean.

    *   **Use clean equipment:** Ensure your pot and utensils are impeccably clean. Dust,
    grease, or old food residue can act as seed crystals and trigger the chain reaction.'

