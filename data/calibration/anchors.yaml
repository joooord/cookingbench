    ---


    ### **Starter: Marinated White Fish & Cucumber Bites**

    *(Prep ahead, serve at room temp—no last-minute stress)*

    **Ingredients:**

    - 150 g firm white fish (cod, hake, or pollock), skin off

    - 1 tbsp rice vinegar

    - 1 tsp honey or agave

    - ½ tsp grated fresh ginger

    - ½ small cucumber, thinly sliced into rounds

    - 1 tsp toasted sesame seeds

    - 1 tsp soy sauce (or tamari for gluten-free)

    - ½ tsp toasted sesame oil

    - Pinch of chilli flakes (optional)

    - 4–6 small lettuce leaves (e.g., Little Gem) or endive, for serving


    **Method:**

    1. *Prep ahead (30 mins before she arrives):* Cut fish into 1 cm cubes. Mix vinegar,
    honey, ginger, soy, and sesame oil. Toss fish in marinade and refrigerate.

    2. *Just before serving:* Arrange cucumber on lettuce leaves, top with marinated fish,
    sesame seeds, and chilli flakes.


    ---


    ### **Main: Pan-Seared Sea Bass with Lemon-Caper Butter, Roasted Potatoes & Greens**

    *(Active time: 20 mins; total: 45 mins)*

    **Ingredients:**

    - 2 sea bass fillets (or trout/halibut), skin-on, scaled

    - 200 g baby potatoes, halved

    - 100 g green beans or asparagus, trimmed

    - 1 tbsp olive oil

    - 15 g butter

    - 1 tbsp capers, drained

    - Zest and juice of ½ lemon

    - 1 small garlic clove, minced

    - Salt and pepper

    - 1 tsp fresh dill or parsley, chopped (no coriander!)


    **Method:**

    1. *Potatoes (start first):* Parboil potatoes for 8 mins, drain, then toss with ½ tbsp
    oil, salt, and pepper. Roast at 200°C (180°C fan) for 25–30 mins until crispy.

    2. *Fish:* Pat fillets dry. Heat ½ tbsp oil in a non-stick pan on medium-high (induction
    will work fine). Season fish, place skin-side down, press gently with a spatula for
    30 secs to prevent curling. Cook 3–4 mins until skin is crisp, flip, cook 1 min more.
    Remove and rest.

    3. *Greens:* In the same pan, add ½ tbsp oil, garlic, and greens. Sauté 2–3 mins until
    tender-crisp. Remove.

    4. *Sauce:* Lower heat, add butter, capers, lemon zest/juice, and herbs. Swirl 1 min
    until foamy. Spoon over fish.

    5. *Plate:* Potatoes, greens, fish on top, sauce drizzled.


    ---


    ### **Why This Works:**

    - **No coriander:** Uses dill/parsley for freshness.

    - **Pescatarian:** Seafood is light but impressive.

    - **Induction-friendly:** No wok needed—just a pan and oven.

    - **Timing:** Starter prepped ahead; main cooks while you chat.

    - **Flavour balance:** Bright (lemon), salty (capers), rich (butter), crisp (skin/potatoes).


    Serve with a chilled white wine (e.g., Sauvignon Blanc) or sparkling water with lemon.
    Relax—you’ve got this!'

