  answerText: "Here are two hearty, delicious vegetarian dinners tailored specifically to\
    \ her equipment, budget, and strict coeliac safety. \n\n*Shopping Tip for Coeliacs:*\
    \ Stick to naturally GF ingredients (potatoes, rice, tinned legumes) and double-check\
    \ labels on processed items (like stock cubes and sauces). Buying pre-grated cheese\
    \ and pre-shredded veg avoids needing a knife, cutting board, or grater.\n\n---\n\n\
    ### Recipe 1: Loaded Microwave Sweet Potato with Smoky Beans & Cheese\n*Warm, filling,\
    \ and takes about 8 minutes. No knife required.*\n\n* **Equipment needed:** Microwave,\
    \ Bowl, Mug, Fork, Spoon.\n* **Ingredients (Under £2.00):**\n  * 1 medium sweet potato\n\
    \  * ½ tin black beans or kidney beans (drained)\n  * 2-3 tbsp GF salsa (e.g., Doritos\
    \ salsa or supermarket own-brand marked GF)\n  * Pinch of smoked paprika or cumin (optional)\n\
    \  * Handful of pre-grated cheddar cheese\n  * 1 tbsp sour cream or Greek yoghurt (stored\
    \ in mini-fridge)\n\n**Instructions:**\n1. Wash the sweet potato, prick it all over\
    \ 6–8 times with her **fork**, and place it in the **bowl**.\n2. Microwave on high (900W)\
    \ for 4–5 minutes. Flip it over using the fork, then microwave for another 2–3 minutes\
    \ until soft all the way through. \n3. While it cooks, mix the beans, salsa, and spices\
    \ together inside her **mug** using the **spoon**.\n4. Remove the potato from the bowl.\
    \ Put the mug in the microwave for 45–60 seconds until the bean mix is piping hot.\n\
    5. Split open the sweet potato in the bowl using her spoon. Pour the hot bean mixture\
    \ over the top, cover with grated cheese (pop back in the microwave for 15 seconds to\
    \ melt if needed), and finish with a dollop of sour cream.\n\n---\n\n### Recipe 2: Kettle-Soaked\
    \ Peanut Rice Noodles with Tofu & Veg\n*Fresh, savoury, and relies entirely on the kettle\
    \ so she doesn't even need to cook.*\n\n* **Equipment needed:** Kettle, Bowl, Mug, Fork,\
    \ Spoon.\n* **Ingredients (Under £2.50):**\n  * 1 nest of thin rice vermicelli noodles\
    \ (naturally GF, check label)\n  * ½ block ready-to-eat marinated or smoked tofu (e.g.,\
    \ Taifun or supermarket brand; can be eaten cold straight from fridge)\n  * Handful\
    \ of pre-shredded carrot/cabbage slaw mix \n  * **For the sauce:** 1 tbsp smooth peanut\
    \ butter, 1 tbsp Tamari (GF soy sauce), 1 tsp honey or maple syrup, squeeze of fresh\
    \ lime juice (or bottled lime juice).\n\n**Instructions:**\n1. Place the noodle nest\
    \ in her **bowl** and pour boiling water from the **kettle** over it until fully submerged.\
    \ Let it sit for 3–4 minutes until soft. \n2. Drain the water carefully by tilting the\
    \ bowl over the sink while using her **fork** to hold the noodles back.\n3. In her **mug**,\
    \ combine the peanut butter, Tamari, honey, lime juice, and 1–2 tablespoons of hot kettle\
    \ water. Stir vigorously with her **spoon** until it turns into a smooth, glossy sauce.\n\
    4. Use her hands or fork to tear the cooked tofu into bite-sized pieces over the noodles.\n\
    5. Toss the pre-shredded veg into the bowl, pour over the peanut sauce from the mug,\
    \ and mix everything together with her fork."
