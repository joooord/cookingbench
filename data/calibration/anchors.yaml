  toleranceAbs: 25
  answerText: 'A gluey, stodgy risotto is caused by excess starch release or broken grains.
    The most likely culprits are:


    1. **Over-stirring:** Stirring too vigorously or constantly breaks the rice grains,
    releasing excess starch. Stir gently and only when necessary to prevent sticking.

    2. **Overcooking:** Cooking the rice past the *al dente* stage breaks down the grain
    structure, turning it mushy. It should always have a slight bite in the center.

    3. **Skipping the Toast (*Tostatura*):** Failing to toast the dry rice in fat (butter
    or oil) before adding liquid prevents the grain''s exterior from sealing, causing too
    much starch to leach out immediately.

    4. **Wrong Rice Variety:** Using standard short-grain rice instead of proper risotto
    rice. For the creamiest texture with the most distinct grains, use **Carnaroli**, which
    holds its shape much better than Arborio.'

