  answerText: 'Absolutely doable! Here are two dinners that work with a kettle, microwave,
    one bowl, and a mug — all vegetarian and gluten-free.


    ## 1. Loaded Microwave Baked Potato with Beans & Cheese (~£1.50)


    **Ingredients:**

    - 1 large baking potato (naturally GF)

    - ½ tin of baked beans (Heinz and most UK supermarket own-brands are gluten-free — but
    always check the label)

    - Handful of grated cheddar

    - Optional: knob of butter, black pepper


    **Method:**

    1. Wash the potato, prick it all over with the fork (important — it can burst otherwise).

    2. Microwave on high for 5 minutes, turn it over, then another 4–5 minutes until a fork
    slides in easily.

    3. Split it open in the bowl, add butter, tip beans over the top, and microwave 90 seconds
    more.

    4. Top with cheese so it melts from the heat.


    Leftover half-tin of beans keeps in the mini-fridge for tomorrow''s lunch. Add a bag
    of pre-washed spinach on the side (it wilts nicely if stirred into the hot beans).


    ## 2. Peanut Rice Noodle Bowl (~£2)


    **Ingredients:**

    - 1 nest of flat rice noodles (check they''re 100% rice — most are naturally GF, sold
    in the world foods aisle cheaply)

    - 1 heaped tbsp peanut butter

    - 1 tbsp **gluten-free** soy sauce or tamari (regular soy sauce contains wheat — this
    is the big trap!)

    - Squeeze of lemon/lime juice or a pinch of sugar

    - Handful of frozen peas or pre-shredded stir-fry veg

    - Optional: chilli flakes, spring onion


    **Method:**

    1. Put noodles and frozen peas in the bowl, cover with boiling water from the kettle,
    put a plate or the mug over the top, and leave 6–8 minutes until soft. Drain carefully
    (hold the fork across the bowl).

    2. In the mug, mix peanut butter, tamari, citrus/sugar, and a splash of boiling water
    into a sauce.

    3. Stir sauce through the noodles. Microwave 60 seconds if it''s cooled down.


    ## Coeliac survival tips for halls


    - **Tamari is her best friend** — one bottle (~£2.50) lasts weeks and unlocks loads
    of flavours. Regular stock cubes, soy sauce, and some spice mixes hide gluten.

    - Microwave rice pouches, tinned chickpeas/lentils, eggs (yes, you can microwave scrambled
    eggs in a mug — 30-second bursts, stirring), plain frozen veg, and jacket potatoes are
    her cheap GF staples.

    - If she shares a fridge/microwave with flatmates, keep her butter/spreads separate
    to avoid crumb contamination.


    One more thought: as a diagnosed coeliac in the UK, she may be entitled to some GF staples
    on prescription depending on her area — worth registering with the uni GP and asking.'

