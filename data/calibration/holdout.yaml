  answerText: "**Vegan Chocolate Traybake** (nut-free, banana-free, fridge-free)\n\nOne\
    \ 20×30 cm (or similar 9×13 inch) tray, 16–20 sturdy squares. Holds at room temperature/hot\
    \ classroom, cuts cleanly once cool, and everyone gets the same thing.\n\n### Ingredients\n\
    - 250 g plain flour  \n- 75 g cocoa powder  \n- 250 g caster sugar  \n- 1½ tsp baking\
    \ powder  \n- 1 tsp bicarbonate of soda  \n- ½ tsp fine salt  \n- 80 ml neutral oil\
    \ (sunflower/vegetable)  \n- 300 ml oat or soy milk (not almond)  \n- 1 tbsp white vinegar\
    \ or lemon juice  \n- 2 tsp vanilla extract  \n\nOptional but kid-friendly: 100 g dairy-free\
    \ dark chocolate chips (check label for nut-free facility).\n\n### Method\n1. Heat oven\
    \ to 180 °C (160 °C fan). Grease and line the tray with baking parchment, leaving overhang\
    \ for easy lifting.\n2. Stir the vinegar into the plant milk and set aside 5 minutes\
    \ (it will thicken slightly).\n3. Sift flour, cocoa, baking powder, bicarb and salt\
    \ into a large bowl. Stir in the sugar.\n4. Pour in the oil, vanilla and milk mixture.\
    \ Whisk gently until smooth and no dry pockets remain (do not over-mix). Fold in chocolate\
    \ chips if using.\n5. Scrape into the prepared tray and level the top.\n6. Bake 25–30\
    \ minutes until the top springs back and a skewer inserted in the centre comes out with\
    \ a few moist crumbs (not wet batter). \n7. Cool completely in the tin on a wire rack\
    \ — this is what makes it firm enough to cut and transport. Once cold, lift out and\
    \ cut into squares with a sharp knife.\n\nNo icing needed (it can get sticky in a warm\
    \ room). If you want a bit of shine, dust with a little icing sugar just before leaving\
    \ the house.\n\nStore/cover in the tin overnight at room temperature. Transport in the\
    \ same tin. Yields enough for 12 kids + teachers with a couple of spare pieces."

