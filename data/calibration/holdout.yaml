  toleranceAbs: 10
  answerText: '## The principle: acid balances fat


    **Sensory balance.** Fat coats the mouth, giving a rich, cloying, lingering unctuousness.
    Acidity does the opposite — it stimulates saliva, "cuts through" the coating, and refreshes
    the palate between bites, so each mouthful of oily fish tastes as vivid as the first.
    Sharp fruit like gooseberry and rhubarb adds tannic astringency too, which reinforces
    this scouring effect. It''s a contrast pairing rather than a like-with-like one.


    **Chemistry.** Oily fish develop trimethylamine and related volatile amines as they
    age — the "fishy" smell. Amines are alkaline; acid protonates them into non-volatile
    salts, so they stop reaching your nose. Lemon juice on sardines literally removes fishiness
    rather than just masking it. Acid also brightens the perception of the oxidised, slightly
    rancid notes that fish oils acquire quickly.


    **Practical origin.** Because these fish spoil fast, cooks in the days before refrigeration
    reached for whatever sharp thing was in season — and gooseberries and rhubarb happen
    to ripen exactly when mackerel are at their best, so the pairing is seasonal as well
    as logical. Hence the classic French *maquereau à la groseille*.


    ## Another pairing on the same principle


    **Salmon or eel with sorrel sauce** — sorrel''s oxalic acid provides the same lemony
    sharpness while wilting into a velvety sauce.


    Others in the same family: herring with pickled cucumber and soured cream; grilled sardines
    with salsa verde or preserved lemon; smoked mackerel with horseradish and beetroot;
    mackerel with tamarind or green mango in Southeast Asian cooking. The logic extends
    beyond fish, too: pork belly with apple sauce, duck with sour cherries, foie gras with
    Sauternes.'

