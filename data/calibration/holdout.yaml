    - 1 tin full-fat coconut milk

    - Small jar red Thai / Indian curry paste

    - Small jar peanut butter (or 2 sachets)

    - 1 onion, 1 pepper

    - 2 tins/pouches tuna, or 100g salami

    - 3 nests dried rice noodles, or 3 straight-to-wok pouches

