    - **Dark chocolate**, a small amount — surprisingly good with port and blue cheese

    - **Simple crackers or a plain baguette** — something neutral so it doesn''t compete


    ## One thing to flag


    Since your brother''s wife is pregnant, worth knowing that **soft, mould-ripened, or
    unpasteurized cheeses** are generally advised against in pregnancy (in many guidelines)
    due to listeria risk — this includes things like soft blue cheese, Brie, Camembert,
    and any unpasteurized options. Stilton is traditionally unpasteurized, and soft triple
    crèmes often are too.


    Easy fix: pick a **pasteurized blue** (many good ones are) and a **pasteurized firm
    cheese** for the softer pick, and just double-check labels when you buy. That way everyone
    can dig into everything without you needing to manage a separate plate for her.'

