    4. **A triple crème or aged goat cheese (e.g., Brillat-Savarin or a firm aged chèvre)**
    — adds a creamy or tangy counterpoint; brightens things up.


    ## Accompaniments


    - **Dried fruit**: figs, dates, dried apricots — echo the port''s own fruit

    - **Fresh fruit**: apple or pear slices, or fresh figs if in season

    - **Nuts**: toasted walnuts or Marcona almonds

