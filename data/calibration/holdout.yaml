  answerText: 'Congratulations to your brother and his wife! Here''s a board built to make
    that vintage port shine — with a note on the pregnancy consideration too.


    ## Four Cheeses


    1. **Stilton or another good English blue** — the classic port pairing for a reason;
    the salty, savory funk against the sweet, fruity port is magic.

    2. **Aged Gouda (look for one with tyrosine crystals, 18mo+)** — caramel, butterscotch
    notes that echo the port''s dried-fruit sweetness.

    3. **A firm, nutty cheese like Manchego or an aged Comté** — gives textural contrast
