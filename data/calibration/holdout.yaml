  answerText: '# Lads'' Camping Dinner Plan (Dairy-Free, No Coolbox)


    ## Night 1: Chorizo & Bean Stew with Crusty Bread


    One-pot, hearty, and the chorizo does all the flavour work for you.


    **Method:**

    1. Fry sliced chorizo in the pot until the oil renders out (no added oil needed).

    2. Add a chopped onion and a couple of cloves of garlic, soften for a few minutes.

    3. Add a tin of chopped tomatoes, a drained tin of mixed beans (or chickpeas + kidney
    beans), a crumbled stock cube, a teaspoon of smoked paprika, and a splash of water.

    4. Simmer 10–15 min until thick. Season, serve with crusty bread for dunking.


    ## Night 2: Tuna & Sweet Chilli Noodles


    Fast, uses both pans, and feels like a proper reward after 20k.


    **Method:**

    1. Boil water in the pot, cook the noodles (dried egg-free noodles or rice noodles —
    check the pack, some egg noodles contain milk derivatives anyway, so rice noodles are
    safest).

    2. Meanwhile, in the frying pan: fry a chopped onion and a pepper in oil, add drained
    tinned tuna, sweet chilli sauce, a squeeze of lime, and a handful of salted peanuts.

    3. Drain noodles, toss everything together in the pot. Done in 15 minutes.


    ## Shopping List (serves 3 hungry walkers)


    **Night 1:**

    - 2 rings cooking chorizo (~450g total, shelf-stable)

    - 1 large onion, 1 garlic bulb

    - 2 tins chopped tomatoes

    - 2 tins mixed beans / chickpeas

    - 1 beef or veg stock cube (check label — most are dairy-free but verify)

    - Smoked paprika

    - 1 large crusty loaf (check label — most plain bread is dairy-free, avoid "butter-enriched"
    anything)


    **Night 2:**

    - 3 nests rice noodles (or ~300g)

    - 3 tins tuna in oil/spring water

    - 1 onion, 2 peppers

    - 1 bottle sweet chilli sauce

    - 2 limes

    - 1 bag salted peanuts

    - Small bottle cooking oil (for both nights)


    ## Tommy-Safety Notes (Epipen Serious)


    - **Check every label** — stock cubes, bread, chorizo and noodles occasionally contain
    milk or "may contain" warnings. Buy brands you''ve verified.

    - **No shared butter/cheese** anywhere in the kit, obviously — but also watch out for
    things like milk chocolate in trail snacks and powdered milk in some instant mash/hot
    chocolate.

    - **Cross-contamination:** since it''s one pot and one pan, keep the whole trip dairy-free
    rather than trying to cook separate portions. Far safer and simpler.

    - Wipe down the pan properly between uses if anyone''s brought dairy snacks for lunches.


    **Bonus tip:** bring a small bag of tortillas as backup carbs — they keep for days unrefrigerated
    and work with both meals if the bread gets squashed.


    Enjoy the walk — and may the beer be cold only because the river is.'

