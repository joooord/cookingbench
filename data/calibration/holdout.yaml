  answerText: '## The plan

    Easiest and safest move: **make the whole trip dairy-free**. No separate pans, no cross-contamination
    worries, nobody accidentally buttering the wrong roll in the dark. Nothing here needs
    a fridge either.


    ---


    ### Night 1 — Chorizo, chickpea & tomato stew with couscous

    Big, salty, savoury — perfect after a long day.


    **Method (one pan, one pot):**

    1. Frying pan: dry-fry 200g diced chorizo until the red oil runs out. Add a chopped
    onion and a pepper, fry 5 min.

    2. Add a drained tin of chickpeas, a carton/tin of chopped tomatoes, 1 tsp smoked paprika,
    a squeeze of tomato purée. Simmer 10–15 min while it thickens.

    3. Swap to the pot: 300g couscous, 450ml boiling water, glug of olive oil, lid on, off
    the heat, 5 min. Fluff with a fork.

    4. Pile stew on couscous. Chilli flakes on top for whoever wants it.


    *Tip:* fry the chorizo first, then the couscous water can boil in the pot while the
    stew simmers if you can borrow a second burner — otherwise do couscous last, it needs
    no flame beyond boiling water.


    ---


    ### Night 2 — Coconut peanut noodles with tuna (or salami)

    Fat, carbs and protein, ready in about 12 minutes.


    **Method:**

    1. Frying pan: oil, fry a sliced onion and a handful of dried mushrooms or a pepper.
    Add 2 tbsp red or Thai curry paste, fry 1 min.

    2. Add a tin of coconut milk, 2 heaped tbsp peanut butter, splash of soy sauce, a sachet
    of tinned tuna or 100g sliced salami. Simmer 5 min.

    3. Pot: cook 3 nests of rice noodles (or use straight-to-wok pouches — no draining,
    no water carried). Stir into the sauce.

    4. Lime wedge and roasted peanuts over the top.


    ---


    ## Shopping list


    **Night 1**

    - 200g diced cooking chorizo

    - 1 onion, 1 red pepper

    - 1 tin chickpeas (or a pouch — lighter)

    - 1 carton chopped tomatoes (cartons beat tins for weight)

    - Small tube tomato purée

    - 300g couscous


