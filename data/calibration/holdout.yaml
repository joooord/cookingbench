  answerText: 'Here’s a **foolproof, nut-free, vegan, banana-free traybake** that’s easy,
    kid-friendly, and holds up well in a hot classroom. It’s a **Lemon & Coconut Traybake**—bright,
    moist, and allergy-safe (no nuts, dairy, eggs, or bananas).


    ### **Lemon & Coconut Traybake**

    *(Makes 16 squares, 23x33cm/9x13in tin)*


    #### **Ingredients**

    - **250g** plain flour (all-purpose)

    - **150g** caster sugar (superfine sugar)

    - **1 tsp** baking powder

    - **½ tsp** bicarbonate of soda (baking soda)

    - **½ tsp** salt

    - **80ml** vegetable oil (or melted coconut oil)

    - **240ml** oat milk (or any plant milk)

    - **Zest of 2 lemons** (about 2 tbsp)

    - **60ml** fresh lemon juice (about 2 lemons)

    - **1 tsp** vanilla extract

    - **50g** desiccated coconut (ensure nut-free brand)


    #### **Lemon Glaze (optional but pretty)**

    - **100g** icing sugar (powdered sugar)

    - **2–3 tbsp** lemon juice


    ---


    ### **Method**

    1. **Prep**: Preheat oven to **180°C/160°C fan/350°F**. Line a **23x33cm (9x13in) tin**
    with parchment paper.

    2. **Dry mix**: In a large bowl, whisk together flour, sugar, baking powder, bicarbonate
    of soda, and salt.

    3. **Wet mix**: In another bowl, mix oil, oat milk, lemon zest, lemon juice, and vanilla.

    4. **Combine**: Pour wet into dry, stir until *just* combined (don’t overmix). Fold
    in coconut.

    5. **Bake**: Pour into tin, smooth top, and bake for **25–30 mins** until golden and
    a toothpick comes out clean.

    6. **Glaze (optional)**: Whisk icing sugar + lemon juice until smooth. Drizzle over
    *cooled* cake. Let set 10 mins before cutting.


    ---


    ### **Why This Works**

    ✅ **Vegan**: No eggs/dairy (oil + plant milk sub).

    ✅ **Nut-free**: Coconut is a seed, not a nut (check packaging for cross-contamination
    if severe allergies).

    ✅ **Banana-free**: No risk for the allergic kid.

    ✅ **Sturdy**: Dense enough to cut into squares, no fridge needed.

    ✅ **Kid-approved**: Sweet, tangy, and slightly chewy from coconut.'

