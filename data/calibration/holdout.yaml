  answerText: "Congratulations on the upcoming addition to the family — and on finally opening\
    \ that vintage port! A well-chosen cheese board will make it a night to remember. Since\
    \ your sister-in-law is pregnant, I’ve flagged which cheeses are safe for her (hard\
    \ cheeses are generally fine, even if unpasteurised, because their low moisture content\
    \ discourages listeria; soft, mould-ripened and blue cheeses are best avoided during\
    \ pregnancy). All four below are classic port partners, and three are pregnancy-friendly.\n\
    \n### The cheeses\n**1. Stilton (blue)**  \nThe iconic port pairing. Its salty, piquant\
    \ intensity and creamy-crumbly texture are a perfect foil for the wine’s sweet, dark-fruit\
    \ richness. *Note:* Stilton is a blue cheese, so your sister-in-law should skip this\
    \ one — but the rest of you will adore it.\n\n**2. Queijo de São Jorge (or a sharp clothbound\
    \ cheddar)**  \nA nod to the port’s homeland. This Portuguese cow’s-milk cheese from\
    \ the Azores is firm, tangy, and slightly peppery with age — it cuts through the port’s\
    \ richness beautifully. If you can’t find it, a three-year-old clothbound cheddar (like\
    \ Montgomery’s) gives a similar savoury bite. *Safe for pregnancy.*\n\n**3. Aged Gouda\
    \ (18 months+, e.g., Beemster XO)**  \nFull of crunchy tyrosine crystals and deep butterscotch-caramel\
    \ notes, aged Gouda echoes the port’s dried-fruit sweetness while adding a nutty, almost\
    \ whisky-like warmth. *Safe for pregnancy.*\n\n**4. Comté (12–24 months)**  \nThis Alpine\
    \ cheese brings nutty, brown-butter flavours and a firm, silky texture. Its sweet-savoury\
    \ balance highlights the port’s complexity without overwhelming it. *Safe for pregnancy.*\n\
    \n### Accompaniments\n- **Nuts:** Toasted walnuts and Marcona almonds (their slight\
    \ bitterness and crunch are perfect).\n- **Dried fruit:** Plump dried figs, Medjool\
    \ dates, and apricots — they mirror the port’s own figgy, raisined character.\n- **Fresh\
    \ fruit:** Thin slices of ripe pear and apple; a few clusters of red grapes.\n- **Fruit\
    \ paste:** A slab of quince paste (membrillo) or a good fig jam — a tiny spoonful on\
    \ a cracker with cheese is heavenly.\n- **Dark chocolate (70%+):** Optional, but a few\
    \ shards can work if your port is very rich and sweet; some find the tannins clash,\
    \ so offer it on the side.\n- **Crackers/bread:** Plain water crackers, oatcakes, or\
    \ a crusty baguette (nothing flavoured — let the cheese and port shine).\n\n### A few\
    \ serving tips\n- Decant the vintage port a few hours ahead; serve it cool room temperature\
    \ (around 16–18°C).\n- Take the cheeses out of the fridge 60–90 minutes before serving\
    \ so they bloom.\n- Arrange the board with separate knives for each cheese, and maybe\
    \ a little card noting which one is the blue, so your sister-in-law can easily navigate.\n\
    \nEnjoy the evening — it sounds like a cracking Friday."

