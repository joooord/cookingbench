  - id: RELEASE-002
    statement: Only an approved public-release manifest in the released state may create a public result.
    status: partial
    enforcementPoints:
      - packages/core/src/evidence.ts — canPublish
      - packages/runner/src/firewall.ts — assertPublishable takes unknown and PARSES, rather than trusting an erasable type
      - packages/runner/src/lifecycle.ts — the release checklist scope is fixed and derived from the run, with no parameter that removes a check
      - packages/runner/src/lifecycle.ts — the release register decides which run is publicly current, and its reader takes no caller-supplied path
      - packages/runner/src/sync.ts — publishRun requires the publication capability, distinct from result-sync, and acts only on the grant's run
      - apps/web/lib/data.ts — the site serves the run the register approves, rather than the newest generatedAt
    tests:
      - "RELEASE-002 — publication eligibility > permits publication only from an approved public-release manifest"
      - "RELEASE-002 — publication eligibility > fails closed with a clear error for every ineligible class"
      - "adversarial round 2 — bypasses Codex reproduced on 3edf98c > rejects hand-built objects at the publication boundary at RUNTIME"
      - "RELEASE-002 — publication eligibility > marks shadow and probe surfaces non-scoring"
      - "RELEASE-002 — the checklist scope is fixed, not chosen by the caller > runs every enumerated check from the run itself, with no parameter that removes one"
      - "RELEASE-002 — the checklist scope is fixed, not chosen by the caller > refuses a checklist that omits a single check, or repeats one to pad the list"
      - "RELEASE-002 — a release cannot be bought with a supplied verdict > refuses to release even when handed a complete-looking checklist through the real call"
      - "RELEASE-002 — a release cannot be bought with a supplied verdict > ignores a caller-supplied register file on the production path"
      - "RELEASE-002 — publication validation is applied, and the run does not choose it > refuses a development artifact at every public path"
      - "runner:sync:run:publish — publishRun > refuses to publish without the publication capability, before a client exists"
      - "runner:lifecycle:register:read — readReleaseRegister > refuses a register outside the runs root, whether by traversal or by symlink"
      - "web:data:board:select — getLatestReport > serves the approved release, and refuses to promote a newer board nobody approved"
      - "a panel verdict from a non-rank-eligible class cannot reach a published surface > refuses to publish the run judgeAnswerPanel bought its verdict under"
      - "15 — unapproved publication refuses > refuses an unregistered run, an unreleased run, and a permit without the capability"
      - "16 — partial publication refuses: no reader sees a mixed version > refuses a changed, missing or unpinned artifact under a live pointer"
    status_note: >-
      The second recorded gap — the site choosing a board by newest
      generatedAt, which is a heuristic and not an approval — is closed: the
      release register decides, and its reader takes no caller-supplied path.
      The first is narrowed but real, and it needs a decision rather than a
      commit. See the gap and the proposed decision below.
    gaps:
      - >-
        `writeLeaderboard` and `writeAnalysis` still call no authorisation check
        at all. `syncRun` and `publishRun` do, so the DATABASE path is covered;
        these two write the FILES that the site reads. The registry keeps both
        risks open.
    proposedDecisions:
      - id: RELEASE-002-D1
        question: >-
          Does writing leaderboard.json or analysis.json into a draft run
          "create a public result" within the meaning of RELEASE-002?
        argument: >-
          There is a defensible reading in which it does not. Those files are
          inert until the release register points at them, and the pointer IS
          approval-gated — `getLatestReport` serves the approved release, not the
          newest board, and `16 — partial publication refuses` proves a changed
          or unpinned artifact under a live pointer is refused. On that reading
          the requirement is met and these two writers need no permit, which
          matters practically because `bench analyze` and `bench report` are
          offline derivations from committed artifacts and requiring an approval
          to run them would put a human in the loop of every re-derivation.
          The opposite reading is also defensible: a file named leaderboard.json
          inside a run is a result, and the register is a second gate rather
          than the only one.
        recommendation: >-
          Require a grant for both writers, and accept the friction. The whole
          argument of this work package is that a guard whose scope is chosen by
          the thing it guards is not a guard, and "these files are only public if
          something else points at them" makes publication depend on a property
          of a DIFFERENT artifact. But this is a scope question, not an
          implementation detail, so it is recorded here rather than decided in
          an implementation commit — which is the rule the brief sets.
        status: awaiting-decision
    limitations: []

  - id: JUDGE-001
    statement: >-
      A judge never scores a model sharing its provider or its base-model
      family, and a missing identity is treated as a conflict.
    status: partial
    enforcementPoints:
      - packages/core/src/evidence.ts — hasJudgeConflict, failing closed on unknown identity, with canonicalId folding case and whitespace
      - packages/runner/src/judge.ts — panelSeats seats from the declared roster, not the OpenRouter slug prefix
      - packages/runner/src/judge.ts — the too-few-seats error names which seat conflicted and why
      - packages/runner/src/judge.ts — the seating decision is made before any transport, so a conflicted seat is never contacted
    tests:
      - "panel seat assignment > never lets a judge score its own provider"
      - "panel seat assignment > never lets a judge score its own base model under another vendor prefix"
      - "panel seat assignment > treats an undeclared identity as conflicted rather than as distinct"
      - "panel seat assignment > compares identity case- and whitespace-insensitively"
      - "panel seat assignment > explains which seat conflicted when too few remain"
      - "JUDGE-001 is only half proved on the real roster > declares the base-model-family arm as a gap until the registry can express it"
      - "the panel route seats the conflict rule before it spends > never contacts a seat sharing the candidate provider or base model, through judgeAnswerPanel"
      - "judge routes refuse a client that was not built to judge > refuses judgeAnswerPanel a judging client for an item the permit never named"
    status_note: >-
      The RULE is enforced and now proved through the route rather than only
      against `panelSeats`. What is still open is not the code but the DATA the
      code reads, and no amount of test-writing closes it.
    gaps:
      - >-
        The base-model-family arm of the conflict rule changes NOTHING on the
        real roster, so it is proved only against a fabricated fixture. Every
        `family` in data/models.yaml sits inside exactly one provider, so the
        family test never excludes a seat the provider test had not already
        excluded. It is dead on the live registry and would only wake up for a
        rebadged model — the case it exists for — which the registry currently
        has no way to express.
      - >-
        `family` in data/models.yaml is a MARKETING TIER, not a base model.
        `claude-frontier` spans claude-fable-5, claude-opus-4.8 and
        claude-opus-5, which are three different base models, so the field the
        rule reads as `baseModelFamily` does not mean base-model family. The
        registry needs a real base-model identity (evidence.ts says as much next
        to canonicalId) before this arm can be claimed as enforced.
    limitations: []

  - id: BUDGET-001
    statement: >-
      Spend is reserved atomically before a call and settled after, so no
      concurrent set of calls can pass a check none of them has yet debited.
    status: closed
    enforcementPoints:
      - packages/runner/src/ledger.ts — reserve() checks and debits in one synchronous step, with no await inside
      - packages/runner/src/ledger.ts — three explicit terminal states; only `released-uncharged` records zero, and only when the request provably never reached the provider
      - packages/runner/src/ledger.ts — settle validates, then journals, then moves the books, so a failed write over-counts rather than losing spend
      - packages/runner/src/ledger.ts — journal replay on construction, leaf-resolved, so a resumed run inherits ITS OWN prior spend
      - packages/runner/src/ledger.ts — exclusive run lock via open(wx), with dead-holder takeover
      - packages/runner/src/ledger.ts — forTests refuses outside a test process, so the lock and the clock cannot be chosen by a production caller
      - packages/runner/src/openrouter.ts — every billable ATTEMPT takes its own reservation, priced from the request that attempt will actually send
      - packages/runner/src/openrouter.ts — an unpriced call is refused rather than reserving zero
      - packages/runner/src/calibration.ts — the write target is proved writable before the first paid judge call
    tests:
      - "the check-then-record race is closed > never authorises more concurrent calls than the cap allows"
      - "the check-then-record race is closed > counts an in-flight reservation against the cap before it settles"
      - "the check-then-record race is closed > refuses to settle or release the same reservation twice"
      - "the check-then-record race is closed > books spend against the reserved model, not against the handle it is given"
      - "spend survives the process > replays prior spend so a resumed run does not spend its cap twice"
      - "spend survives the process > refuses to run against a corrupt journal rather than assuming zero"
      - "spend survives the process > keeps the money on the books when the journal write fails"
      - "spend survives the process > writes no journal line for a settle it is going to refuse"
      - "two runners cannot each spend the whole cap > refuses a second ledger while the first holds the lock"
      - "the cap comes from the permit > lets an operator sub-cap lower the ceiling but never raise it"
      - "every completion is authorised and accounted for > stops at the cap instead of spending past it"
      - "every completion is authorised and accounted for > releases the reservation when the call fails, rather than stranding the cap"
      - "every completion is authorised and accounted for > refuses an unpriced call instead of reserving zero against the cap"
      - "the permit chain works end to end > stops the chain at the permit budget even though the manifest allows more"
      - "runner:calibration:result:write — runCalibration > preflights the write TARGET, not its directory, before the first paid call"
      - "runner:ledger:journal — the spend record is this run's own > refuses a symlinked spend journal at construction, before any call is authorised"
      - "runner:estimate:record:write — runEstimate > refuses to mint the gate record without catalog-read, before the catalog is fetched"
      - "11 — a retry that would exceed the remaining budget refuses > reserves per billable attempt, and stops the retry before the socket"
    status_note: >-
      Downgraded from closed after external review, and now closed again on the
      wider reading that review was right to insist on. BUDGET-001 says in terms
      that concurrent requests AND RETRIES cannot exceed the manifest cap. The
      concurrency race was closed; retries were not, because one reserve()
      covered up to five billable POSTs. Every attempt now takes its own
      reservation, priced from the request it is about to send, so a retry that
      raises the token budget reserves for the larger request. The refund
      question is closed by making it three states instead of two: a socket that
      died after the body was written is `retained-unreconciled`, not refunded,
      because that completion may have been generated and billed.
    gaps: []
    limitations:
      - >-
        The ledger is an in-process accounting boundary. It can refuse to
        authorise the next call and it can refuse to keep running once it
        discovers an overspend, but it cannot un-spend money that has already
        left the account, and it cannot see spend made by another process or
        another key holder. The provider-side spend limit on the OpenRouter key
        is the only control enforced by the party actually taking the money, and
        this cap must never be described as hard without saying so.

  - id: TRACE-001
    statement: >-
      Canonicalisation is deterministic, the hashes a signature covers are
      frozen against drift, and every artifact can be traced to the approval
      that authorised it.
    status: partial
    enforcementPoints:
      - packages/core/src/evidence.ts — canonicalJson, recursive key sort
      - packages/runner/src/permit.ts — manifestHash parses before hashing, so equivalent serialisations agree
      - packages/runner/test/golden-hashes.test.ts — frozen digests with a per-field mutation pass
      - packages/runner/src/redemption.ts — the redemption record links permit, key, manifest, capabilities, command and time
      - packages/runner/src/firewall.ts — recordProvenance appends the authorising approval to the RUN's own artifacts, once per authorisation
      - packages/runner/src/cli.ts — `bench run`, `bench judge` and `bench sync` each record their own provenance line after redeeming
      - packages/runner/src/regenerate.ts — the acceptance summary is regenerated from the committed artifacts and checked byte-for-byte
    tests:
      - "the canonical forms a signature covers are frozen > hashes the golden manifest to its recorded digest"
      - "the canonical forms a signature covers are frozen > hashes the golden permit body to its recorded digest"
      - "the canonical forms a signature covers are frozen > is independent of key order, at every depth"
      - "the canonical forms a signature covers are frozen > is sensitive to every field it claims to cover"
      - "single use means single use > records what was redeemed, for the audit trail"
      - "the firewall enforces exactly what the grant carries > records provenance for the run artifact"
      - "the permit chain works end to end > carries a signed file through verify, redeem, ledger, client and a call"
      - "runner:firewall:provenance:append — the approval trail lives in the run > appends one line per authorisation, and refuses to write into a published run"
      - "the acceptance summary regenerates byte-identically > produces identical bytes from a different process, timezone, locale and directory"
      - "the regeneration check can actually fail > fails, with the offending line, when the committed artifact is stale"
    status_note: >-
      Both recorded gaps are closed. `Firewall.provenance()` had existed since
      the permit layer landed and nothing that writes ever called it, so the only
      durable trail was the redemption record — which lives in data/permits,
      beside the PERMIT rather than beside the run, and is therefore traceable
      only by someone who already knows to look. The trail is now appended to the
      run itself, once per authorisation, and a corrupt trail refuses rather than
      reading as "nothing authorised this". What keeps this partial is that
      nothing yet REQUIRES the trail to be present.
    gaps:
      - >-
        No release check reads provenance.ndjson. A run can still be registered,
        released and served with an empty or absent trail, so the record is
        written but not yet load-bearing. The natural home is the release
        checklist, whose scope is fixed and derived from the run — adding
        "every artifact in this run is covered by a recorded approval" there
        would make the trail a gate rather than a note.
    limitations: []
