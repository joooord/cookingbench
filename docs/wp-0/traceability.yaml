  - id: RUN-002
    statement: >-
      A resumed run preserves every rank-affecting setting and hash. Mixed
      routes, prompts, banks, settings or methodology versions FAIL rather than
      warn. Retry ids are deterministic and idempotent.
    canonicalPlanSection: M4.2 Define the response protocol
    manifestFields: [methodologyVersion, methodologyHash, schemaVersion, gitCommit, bankHash, promptHash, judgePromptHash, validatorHash, candidateRoutes, judgeRoutes, generationSettings, callPlan]
    evidenceGate: M0.0 / WP-0 acceptance — independent Codex review
    owner: Engineering lead
    status: closed
    enforcementPoints:
      - packages/runner/src/store.ts — ProtocolViolationError on any rank-affecting change, replacing a console warning that merged the new config anyway
      - packages/runner/src/store.ts — RANK_AFFECTING_FIELDS is derived by EXCLUSION from OPERATIONAL_FIELDS, so a field this build has never seen is rank-affecting by default
      - packages/runner/src/store.ts — every batch carries its own ProtocolBinding, and a binding that had to be inferred is marked `reconstructed` rather than presented as measured
      - packages/runner/src/store.ts — retryIdFor derives an attempt id by SHA-256 over (runId, modelId, questionId, cause), so a replay across processes recognises itself
      - packages/runner/src/store.ts — writeResponse refuses to replace a stored answer with a different one, and refuses a replay carrying a different cost
      - packages/runner/src/cli.ts — non-mock candidate and judge execution refuses before attempt reads, authority, client construction or artifact writes in WP-0
    tests:
      # `it.each` — cited in TEMPLATE form, because that is what the source
      # says; vitest expands %s per case at run time, and the template is the
      # only stable identifier the case has.
      - "RUN-002 — a changed rank-affecting setting fails rather than warns > refuses a resumed batch that changes %s"
      - "RUN-002 — a changed content hash fails rather than warns > refuses a resumed batch whose %s has moved"
      - "RUN-002 — a changed rank-affecting setting fails rather than warns > refuses a model route table that changes, and one that appears"
      - "RUN-002 — a changed rank-affecting setting fails rather than warns > treats a field this build has never seen as rank-affecting"
      - "RUN-002 — a changed rank-affecting setting fails rather than warns > refuses a rank-affecting field that disappears on resume"
      - "RUN-002 — a changed rank-affecting setting fails rather than warns > refuses through the judge writer as well as the run writer"
      - "RUN-002 — a changed content hash fails rather than warns > refuses a run whose manifest changed or vanished"
      - "RUN-002 — a changed content hash fails rather than warns > accepts a manifest appearing on a previously unmanifested run"
      - "RUN-002 — an identical protocol resumes cleanly > accepts a second batch under the same protocol and unions the models"
      - "RUN-002 — an identical protocol resumes cleanly > does not mistake a reordered judge panel for a different panel"
      - "RUN-002 — an identical protocol resumes cleanly > lets operational fields move, and never lets a per-model cap rise"
      - "RUN-002 — every batch is bound to what it ran under > writes a binding per batch that survives a round trip"
      - "RUN-002 — every batch is bound to what it ran under > does not append a second record for a replayed batch"
      - "RUN-002 — every batch is bound to what it ran under > ignores a binding the caller attached to its own batch"
      - "RUN-002 — every batch is bound to what it ran under > marks a binding it had to infer as inference, not as evidence"
      - "RUN-002 — attempt ids are derived, never counted > recognises a replay of the same attempt across processes"
      - "RUN-002 — attempt ids are derived, never counted > books one charge, and refuses a second, different one"
      - "RUN-002 — attempt ids are derived, never counted > refuses a corrupt or mis-filed attempt record rather than reopening it"
      - "RUN-002 — a replayed retry stores one answer and books one charge > stores one answer and one charge when the same retry lands twice"
      - "RUN-002 — a replayed retry stores one answer and books one charge > refuses to overwrite a stored answer with a different one"
      - "RUN-002 — a replayed retry stores one answer and books one charge > keeps distinct cells distinct"
      - "4 — a changed rank-affecting setting refuses > refuses a temperature or token-cap change on resume, rather than warning"
      - "13 — a duplicate retry execution stores one answer and books one charge > recognises the replay instead of paying for it twice"
      - "v3 execution refuses unsupported or ambiguous work before side effects > keeps real candidate and judge execution outside the WP-0 offline harness"
      - "CLI paid routes refuse before side effects > cmdRun refuses a valid paid envelope before permit, estimate, client, redemption or writes"
      - "CLI paid routes refuse before side effects > cmdJudge derives mock status from the manifest and refuses a paid envelope before reads or paid side effects"
    status_note: >-
      This requirement was MISSING from this matrix entirely, and from the
      validator's hand-typed list of "every WP-0 requirement", so the suite
      reported full coverage of nine requirements while the brief specified ten.
      Found by external review, not by the machinery built to find exactly this.
      The list is now DERIVED from the brief, so a requirement added there fails
      the suite until it is answered here. Mixed protocol state fails, logical
      attempt identities are deterministic and replay-safe, and WP-0's executable
      surface is restricted to the offline/mock harness.
    gaps: []
    limitations:
      - >-
        WP-0 does not claim that the retained real-provider retry loops are a
        release-safe execution protocol. Candidate and judge network execution
        refuses before those loops are reachable. WP-3 must replace them with
        manifest-bound work and provider-attempt identities plus write-ahead
        recovery before any Development Probe or rank-bearing run is authorised;
        model and judge calls are explicit non-goals of this WP-0 acceptance.

  - id: DATA-001
    statement: Historical run artifacts are immutable inputs and can never be overwritten.
    canonicalPlanSection: M0.4 Preserve the current benchmark as a baseline
    manifestFields: [runId, parentArtifacts, evidenceClass, releaseState, outputRoot]
    evidenceGate: M0.0 / WP-0 acceptance — independent Codex review
    owner: Engineering lead
    status: closed
    enforcementPoints:
      - packages/runner/src/firewall.ts — resolveRunDir derives identity from the RESOLVED path, so an alias cannot launder a write
      - packages/runner/src/firewall.ts — readHistoricalRegistry takes no path parameter and fails closed on absent, unparseable or malformed policy
      - packages/runner/src/firewall.ts — isReleasedOnDisk freezes a run with a RELEASED marker, a released config, or a board and no policy metadata
      - packages/runner/src/firewall.ts — assertNoSymlinkComponent walks root-down including the leaf, on reads and writes
      - packages/runner/src/firewall.ts — readRunFileOrNull and readRunJsonEntries resolve the LEAF on every run-scoped read, per file inside a directory
      - packages/runner/src/analyze.ts — writeAnalysis goes through writeRunFileAtomic like every other writer
      - packages/runner/src/calibration.ts — the write target, not merely its directory, is resolved before any paid judge call
      - packages/runner/src/ledger.ts — write-mode preflight of the journal TARGET in the constructor, before any spend is authorised
    tests:
      - "DATA-001 — historical artifacts cannot be overwritten > blocks the real writers, not just the resolver"
      - "DATA-001 — historical artifacts cannot be overwritten > leaves the published artifact byte-identical after a refused write"
      - "DATA-001 — historical artifacts cannot be overwritten > refuses to operate on a malformed or unparseable registry"
      - "DATA-001 — historical artifacts cannot be overwritten > has no exported switch that can disable the guard"
      - "path confinement — the traversal that WP-0 closed > guards files inside a frozen run, and validates the final target"
      - "the cap comes from the permit > refuses to spend against a published run"
      - "the release-state guard says what it does > freezes every release state except the ones explicitly declared resumable"
      - "the release-state guard says what it does > freezes on a release state it has never heard of, and on unusable metadata"
      - "the release-state guard says what it does > still lets an in-progress run be resumed across batches"
      - "the release-state guard says what it does > decides on a membership test rather than a disjunction that is always true"
      - "runner:firewall:registry:read — readHistoricalRegistry > takes no path, so no caller can name the file that decides what is frozen"
      - "runner:store:config:write — writeRunConfig > refuses to write config.json into a published run"
      - "runner:store:config:merge — mergeRunConfig > refuses to merge a resumed batch into a published run"
      - "runner:analyze:analysis:write — writeAnalysis > refuses to write analysis.json into a published run"
      - "runner:analyze:analysis:write — writeAnalysis > refuses an analysis.json leaf symlink out of the runs tree"
      - "runner:calibration:result:write — runCalibration > refuses to write calibration.json into a published run"
      - "runner:store:responses:read — readResponses resolves its LEAF > refuses a responses directory symlinked at a run that is not this one"
      - "runner:store:responses:read — readResponses resolves its LEAF > refuses a single response file symlinked into another run"
      - "runner:store:artifacts:read — every run-scoped reader resolves its leaf > refuses a linked config.json, scores.json or attempts directory"
      - "runner:store:attempt:settle — settleAttempt > books no charge against a published run, and leaves it byte-identical"
      - "runner:adjudicate:record:write — writeAdjudicationRecord > refuses to write a decision record into a published run"
      - "runner:lifecycle:checklist:write — writeReleaseChecklist > refuses to certify a published run for release"
      - "17 — modifying the frozen historical corpus refuses > refuses every writer that could reach a published run"
    status_note: >-
      This was marked `closed` while it was not, and the reason is worth
      keeping. `writeAnalysis` was a bare `writeFileSync(join(resolveRunDir(...),
      'analysis.json'), …)`: the guard was applied to the DIRECTORY, and the
      write then followed whatever the leaf turned out to be. Probed with the
      leaf linked outside the repository, the write succeeded and overwrote the
      outside file. Five more instances of the same shape were found by sweeping
      for the pattern rather than fixing only the reported one, including two
      readers by which a scratch run could present another run's corpus as its
      own evidence. Every run-scoped path now resolves its leaf, and the
      registry's immutability risks are closed on tests that call the real
      writers rather than the resolver they happen to share.
    gaps: []
    limitations: []

