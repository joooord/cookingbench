# WP-0 requirement traceability matrix.
#
# Each requirement from the Revision 3 master plan, what enforces it, which
# named test cases prove it, and — importantly — what is still missing.
#
# Validated by packages/runner/test/traceability.test.ts, on the same principle
# as the route registry: every cited test must EXIST by exact name, every named
# enforcement file must exist, a requirement marked `closed` may not carry
# gaps, and a requirement carrying gaps may not be marked closed. A matrix that
# can drift from the code reads as coverage while providing none, which is
# worse than no matrix.
#
# ---------------------------------------------------------------------------
# GAPS vs LIMITATIONS — a distinction this revision introduces
# ---------------------------------------------------------------------------
#
# A `gap` is work not done: something that can be closed, by someone, with a
# commit. A `limitation` is a boundary of the mechanism itself, which no amount
# of work inside this repository will move — the ledger cannot un-spend money
# the provider has already taken, and no test can prove that it can.
#
# They were the same field, and that was wrong in both directions. A permanent
# limitation sitting in the gap list is noise that trains readers to skim the
# list; and burying it makes a requirement look more closed than it is. So a
# `closed` requirement MAY carry limitations, must carry no gaps, and the
# validator enforces both.
#
# ---------------------------------------------------------------------------
# What changed in this revision
# ---------------------------------------------------------------------------
#
# The previous state was 2 closed / 7 partial / 1 open with 19 gaps, and it
# described the repository as it stood roughly twenty-five commits ago. Most of
# those gaps had been closed by work that never came back to update this file —
# which is its own lesson, and the reason `bench regenerate` now derives the
# acceptance summary from this file rather than from anyone's memory.
#
# Every status below was re-derived by reading the source and running the
# cited test, not by trusting the previous entry. The final closure pass also
# exercised the CLI entry points, every formerly unbound public reader, both
# public-artifact writers and the provenance release gate. The recorded work
# gaps are now zero; permanent boundaries remain explicit as limitations.

requirements:
  - id: RUN-001
    statement: >-
      Execution is deny-by-default. Dangerous capabilities are exercised only
      under a cryptographically signed permit that cannot be replaced by a local
      boolean, and the permit's kind bounds what its capabilities may be.
    canonicalPlanSection: Evidence classes and permits
    manifestFields: [evidenceClass, methodologyHash, budgetCapUsd, callPlan, candidateRoutes, judgeRoutes]
    evidenceGate: M0.0 / WP-0 acceptance — independent Codex review
    owner: Engineering lead
    status: closed
    enforcementPoints:
      - packages/runner/src/permit.ts — Ed25519 verification over the raw signed body, before any field is acted on
      - packages/runner/src/permit.ts — grant authority is WeakSet membership, checked at runtime, not a TypeScript brand
      - packages/runner/src/permit.ts — verifyPermit/verifyPermitFile take NO trust inputs and refuse an options object carrying one, including via the prototype chain
      - packages/runner/src/permit.ts — the production verifier has one fixed committed trust root and exports no alternate verifier that can name another
      - packages/core/src/evidence.ts — CAPABILITIES_FOR_PERMIT_KIND and EVIDENCE_CLASSES_FOR_PERMIT_KIND
      - packages/runner/src/firewall.ts — Firewall.denyAll is the default posture; the constructor re-checks the grant
      - packages/runner/src/openrouter.ts — private constructor plus forCandidates/forJudging factories
      - packages/runner/src/openrouter.ts — cell and estimate are REQUIRED on a guarded call and re-checked at runtime, so no call can opt out of the cell check by omitting a field
      - packages/runner/src/firewall.ts — requireCell takes an explicit cell kind, mapped to the capability that authorises it, and refuses an unknown kind
      - packages/runner/src/supabase.ts — fixed per-capability operation sets, each bound to the GRANT's run id; the privileged client never escapes
      - packages/runner/src/redemption.ts — executionLimit enforced by an atomic on-disk redemption record
      - packages/runner/src/cli.ts — WP-0 refuses real candidate and judge execution before permit loading or any side effect; the remaining live-data and publication commands require exact manifest-bound authority
      - data/permits/fixtures — three committed permits signed off-machine, so the production loader is exercised against committed material rather than an ephemeral keypair
    tests:
      - "permit verification mints a grant > accepts a correctly signed, correctly bound permit"
      - "a grant is identity, not shape > refuses a hand-built object with the right shape"
      - "a grant is identity, not shape > refuses a forged grant pushed through the erased private constructor"
      - "signature verification > refuses a permit whose body was edited after signing"
      - "signature verification > refuses a committed key that is not Ed25519"
      - "permit kind bounds what a signature can buy > refuses a legacy-shadow permit that explicitly requests candidate-inference"
      - "revocation fails closed > refuses a revoked permit even with a valid signature"
      - "the paid client cannot be built without authorisation > refuses a candidate client to a judge-only permit"
      - "single use means single use > refuses a second redemption of a single-use permit"
      - "RUN-001 — deny by default > grants nothing without a permit"
      - "cells name the candidate and carry a kind > keeps the two kinds distinct at the same coordinate"
      - "cells name the candidate and carry a kind > refuses a cell kind it does not recognise, including an inherited one"
      - "cells name the candidate and carry a kind > authorises a judge call by the answer it scores, not by the seat scoring it"
      - "every completion is authorised and accounted for > refuses a call that names no cell, instead of skipping the check"
      - "the permit chain works end to end > carries a signed file through verify, redeem, ledger, client and a call"
      - "the permit chain works end to end > breaks the chain at the first link when the permit file is tampered with"
      - "the permit chain works end to end > refuses the second redemption of a single-use permit, after the first has spent"
      - "runner:permit:keyring:read — verifyPermit at the production boundary > refuses a self-minted key, and every way of naming the keyring that signed it"
      - "runner:permit:revocation:read — verifyPermit at the production boundary > reads the committed revocation list, and no production input can substitute another"
      - "the live-data chain refuses authority meant for another run > refuses to sync a run the permit was not issued for, before opening a connection"
      - "runner:sync:run:upsert — syncRun > refuses a run the permit does not name, before any client is constructed"
      - "runner:sync:run:publish — publishRun > refuses to publish a run the permit does not name"
      - "trust inputs are not caller parameters > flags every exported production function that names one"
      - "test seams are declared, guarded, and unreachable from production > is never called from production source"
    status_note: >-
      Closed on the third pass. It was downgraded from closed after external
      review — correctly: the machinery was real and tested while the BOUNDARY
      was not, because `verifyPermit` accepted a caller-supplied keyringDir,
      revocationListPath and clock, and production code could reach all three.
      Injectable for testability and reachable in production is not a boundary.
      All three parameters are gone and no alternate verifier is exported. The
      committed fixtures close the second half: the production loader runs
      against material signed off-machine, which is the only way to prove the
      committed keyring is the trust root rather than one a test happened to
      build. WP-0 additionally refuses real candidate and judge execution at the
      CLI boundary until the later paid-run protocol exists.
    gaps: []
    limitations:
      - >-
        No APPROVER key is committed, and none should be: the private half must
        not be reachable by Claude, Codex, the runner or CI, or the system that
        enforces approval could approve itself. So no capability can currently
        be exercised at all — verification fails closed with PERMIT_UNKNOWN_KEY
        and `Firewall.denyAll()` is the only reachable posture. That is the
        correct state for a repository under code preparation, and it means the
        end-to-end chain has been proved against fixtures rather than against a
        live approval. See data/permits/keys/README.md.

