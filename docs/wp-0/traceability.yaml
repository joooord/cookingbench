      - "route registry is acceptance-grade > covers every filesystem, network and database sink under every scan root"
      - "route registry is acceptance-grade > cites an EXACT named test case for every closed risk"
      - "route registry is acceptance-grade > requires every closed risk to cite a test that CALLS the route"
