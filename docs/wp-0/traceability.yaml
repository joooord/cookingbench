      Closed after accepting the stricter scope decision below. Neither the
      public file writers nor the database publication path may borrow approval
      from a later pointer: each exercises exact run-and-manifest authority at
      its own boundary. The writers derive their public stamp from the stored
      manifest, append command-specific provenance, and the fixed release
      checklist refuses to release unless both approvals are present and bound
      to those same bytes. The site then serves one digest-pinned approved
