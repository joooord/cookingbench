      - "CLI import and fixed-path boundaries > checkCanaries reads only the committed question directory and finds every canary"
      - "CLI import and fixed-path boundaries > cmdValidate completes over the committed dataset without touching credentials or the network"
      - "CLI paid routes refuse before side effects > requireGrant refuses missing authority before any network client can exist"
      - "CLI paid routes refuse before side effects > cmdPilot is an unconditional v3 refusal before any input or side effect"
      - "CLI paid routes refuse before side effects > cmdRun refuses a valid paid envelope before permit, estimate, client, redemption or writes"
      - "runner:store:attempts:read — readAttempts > refuses an attempt record bound to no manifest before it can count as spend"
      - "runner:calibration:result:read — readCalibration > refuses a hand-written pre-envelope calibration as gate evidence"
      - "runner:estimate:record:read — assertFreshEstimate > refuses a hand-written low estimate after recomputing the priced work from the live catalogue"
      - "web:data:analysis:read — getAnalysis > refuses a separation table from a run no approval ever named"
