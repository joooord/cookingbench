    enforcementPoints:
      - packages/core/src/evidence.ts — validatedRunManifestSchema, with rankEligible and outputRoot derived rather than asserted
      - packages/runner/src/permit.ts — the manifest is re-parsed at the permit boundary and bound by hash
      - packages/runner/src/manifest.ts — `bench manifest` computes the content hashes from the items that will actually run, and refuses a declared hash that does not describe them
      - packages/runner/src/manifest.ts — the manifest digest is persisted beside the manifest and re-checked, so a run that lost or edited its envelope refuses
      - packages/runner/src/manifest.ts — verification takes the bank from the committed dataset, not from its caller
    tests:
      - "a permit authorises one exact envelope > refuses a manifest that is not the one the permit names"
      - "a permit authorises one exact envelope > refuses a manifest that does not validate"
      - "the canonical forms a signature covers are frozen > is sensitive to every field it claims to cover"
      - "M4.1 — content hashes describe what actually runs > is stable under item order and unstable under item content"
      - "M4.1 — content hashes describe what actually runs > separates a scoring-key change from a prompt change"
      - "M4.1 — content hashes describe what actually runs > makes an edited reference answer invalidate the judge prompt"
      - "M4.1 — content hashes describe what actually runs > changes the token cap and sees it, because the cap is not provider-neutral"
      - "DATA-002 — a command writes the manifest, and it must be true > fills the content hashes and produces a manifest that parses"
      - "DATA-002 — a command writes the manifest, and it must be true > checks a declared hash instead of correcting it"
      - "DATA-002 — a command writes the manifest, and it must be true > refuses a manifest whose declared hashes do not describe the supplied items"
      - "DATA-002 — a command writes the manifest, and it must be true > is idempotent for the same envelope and immutable for a different one"
      - "DATA-002 — a command writes the manifest, and it must be true > cannot be written into a published run"
      - "DATA-002 — a changed bank cannot masquerade as the manifested one > reports drift, and names the items that moved"
      - "DATA-002 — a changed bank cannot masquerade as the manifested one > refuses when a manifested item has left the dataset, rather than passing"
      - "DATA-002 — a changed bank cannot masquerade as the manifested one > never reports ok when it could not check"
      - "DATA-002 — the manifest digest is persisted, and checked > writes the digest beside the manifest and refuses a run that lost it"
      - "DATA-002 — the manifest digest is persisted, and checked > refuses a digest that no longer matches the manifest it sits beside"
      - "DATA-002 — validatorHash covers every module that can change a score > covers the judge, the adjudicator, the statistics and the analysis, not just the graders"
      - "the verification boundary does not take its inputs from its caller > ignores a bank substituted through the production entry point"
      - "RELEASE-002 — publication validation is applied, and the run does not choose it > refuses an artifact write when the stored artifacts do not match the manifest"
      - "2 — a changed question bank refuses > cannot be swapped under a run id, and drops the scores it produced"
      - "5 — a changed code/validator hash refuses > invalidates every score, and breaks the permit binding"
    status_note: >-
      Both recorded gaps are closed. `bench manifest` writes the envelope and
      refuses to correct a declared hash rather than silently agreeing with it,
      and the release path checks a run's STORED artifacts against the hashes its
      manifest declares. The verification boundary takes the bank from the
      committed dataset rather than from its caller, which is the same rule
      RUN-001 applies to the keyring.
    gaps: []
    limitations: []

