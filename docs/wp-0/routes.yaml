# RUN-001A — curated semantic route registry.
#
# Hand-maintained, not generated. The previous inventory inferred route identity
# from auditor prose (sha256 of file|kind|symbol), which produced 41 inferred
# symbols that do not occur in the source, merged distinct sinks, and split
# single sinks across several ids. An identity derived from prose is not an
# identity.
#
# Each entry is keyed by a stable semantic route key. Every risk on a route
# carries its OWN status, severity, enforcement point and named test case; the
# route is `open` until every one of its risks is closed.
#
# ---------------------------------------------------------------------------
# What changed in this revision, and why
# ---------------------------------------------------------------------------
#
# 1. READS ARE ROUTES. The scanner previously looked for writes, network calls
#    and database calls only, so a new *reader* was never forced into the
#    registry. A read is how untrusted content crosses the boundary and how a
#    traversal escapes a root; it is not exempt. Every reader now appears. A
#    read of the committed dataset is a LOW-severity route — argued for in the
#    entry, never omitted from it.
#
# 2. apps/web IS SCANNED. The two web entries used to be hand-written and were
#    never checked against the source, which is how five further PostgREST
#    routes in apps/web/lib/supabase.ts and seven filesystem readers in
#    apps/web/lib/data.ts stayed invisible. The scan now covers every scanRoot
#    below, so a new route on the site fails the build until it is registered.
#
# 3. A CITATION MUST TOUCH THE REAL PATH. A closed risk must name a test that
#    CALLS the route's own function. A test of a helper the route happens to
#    use proves nothing about the route: it cannot fail if the route stops
#    calling the helper. Applying that rule downgraded eleven risks that read
#    as closed — see `falselyClosed` below. This is the same defect class as a
#    traceability matrix that validates itself.
#
# 4. THE ENFORCEMENT LAYER IS NOT EXEMPT FROM ITS OWN INVENTORY. firewall.ts
#    used to be skipped by the scanner because it "is the guard". A guard that
#    excludes itself from the register of dangerous routes is choosing its own
#    scope, which is the exact failure this work package exists to prevent.
#    Its eight writers and twenty-four readers are registered like any other.
#
# Completeness is checked in BOTH directions by
# packages/runner/test/route-inventory.test.ts:
#   forward  — every (file, kind) sink the scanner finds has a route here;
#   backward — every route here resolves to a sink of that kind, in that file,
#              behind a symbol that file really declares.
#
# Known granularity limit, stated rather than hidden: enforcement is at
# (file, kind), not (function, kind). Attributing a sink line to its enclosing
# symbol needs a parser, and the regex approximation misattributed roughly a
# third of sites in trial (it reads `const path = join(...)` as the enclosing
# function). A build gate that cries wolf gets suppressed. So: adding a NEW
# reader to a file that already has a registered reader will not fail the
# build. Adding the first reader to a file will. That is weaker than ideal and
# is why each sink is still enumerated by hand below.

pinnedCommit: 980dfcb5e3ff920fe1a3231121a6115e3fa48dcb

# Everything under these roots is scanned. Adding a source tree without adding
# it here is how apps/web went unchecked for two revisions.
scanRoots:
  - packages/core/src
  - packages/runner/src
  - apps/web

routeKinds: [fs-write, fs-read, fs-delete, network-out, db-write, db-read, process-exec]

# `unverified-input` and `path-escape` were added when reads entered the
# registry: neither `historical-overwrite` nor the other three write-shaped
# risks describes what a reader can do wrong. `secret-exposure` covers the one
# route that pulls credentials into the process. Widening the vocabulary is not
# a weakening — shoehorning a reader into `historical-overwrite` would have
# been, because it would have made the risk unfalsifiable.
riskKinds:
  - historical-overwrite   # a published artifact can be altered or destroyed
  - unauthorised-publish   # a public result or ranking can be created without approval
  - budget-bypass          # money can be spent outside a reservation
  - unauthorised-inference # a paid or privileged client can act without a permit
  - unverified-input       # content crosses the boundary unbound to a declared hash
  - path-escape            # the route can be steered outside its declared root
  - secret-exposure        # the route reads credentials into the process

severities: [low, medium, high]

# Risks that an earlier revision recorded as CLOSED and that the review
# reopened, each because the cited test never calls the route it certified.
#
# THIS LIST IS HISTORY, NOT CURRENT STATE, and it is deliberately not pruned.
# Eleven of the thirteen routes below are closed again now, on evidence that
# does call them — `routes-store`, `routes-judge`, `routes-firewall`,
# `routes-publication` and `routes-web` were written for exactly that. Two are
# still open: `runner:cli:pilot:record:write`, because `bench pilot` has no
# test of any kind, and the judge panel's conflict rule was reopened here and
# closed by a test that drives it through `judgeAnswerPanel`.
#
# The entries stay because the validator re-checks every one of them: an entry
# whose cited test DOES now call the route fails the suite. So this cannot rot
# into a stale accusation, and the record of how a green matrix came to be
# wrong outlives the commit message that would otherwise have carried it.
falselyClosed:
  - route: runner:store:config:write
    citedTest: "adversarial round 2 — bypasses Codex reproduced on 3edf98c > refuses a leaf symlink for every run-scoped writer"
    reason: >-
      That test iterates writeScores and writeLeaderboard. writeRunConfig is
      never called by it, so nothing proves the config writer resolves its leaf
      target — which is precisely the bug the test was written for.
  - route: runner:store:responses:read
    citedTest: "adversarial round 2 — bypasses Codex reproduced on 3edf98c > refuses a linked responses directory on read as well as write"
    reason: >-
      The test calls resolveRunFile twice. readResponses is never invoked, so a
      readResponses that stopped resolving through the firewall would still be
      green.
  - route: runner:analyze:analysis:write
    citedTest: "path confinement — the traversal that WP-0 closed > guards files inside a frozen run, and validates the final target"
    reason: >-
      Exercises resolveRunFile only. writeAnalysis in fact writes with a bare
      writeFileSync over a resolveRunDir result, so it never reaches the
      leaf-target validation that the cited test is about.
  - route: runner:calibration:result:write
    citedTest: "path confinement — the traversal that WP-0 closed > guards files inside a frozen run, and validates the final target"
    reason: Exercises resolveRunFile only; runCalibration is never called.
  - route: runner:taste:archive:replace
    citedTest: "adversarial round 2 — bypasses Codex reproduced on 3edf98c > refuses a Taste archive that loses, mutates or reorders a committed ballot"
    reason: >-
      The test calls assertArchiveGrows directly. Nothing proves
      archiveTasteVotes calls it before replacing the ballot record. The guard
      is proved; the writer that must use it is not. The test has been moved to
      the guard's own route, where it is honest.
  - route: runner:taste:votes:read
    citedTest: "the paid client cannot be built without authorisation > refuses a service-role database client without the capability"
    reason: >-
      Exercises serviceRoleClient. archiveTasteVotes is never called. The same
      citation was doing duty for four separate database routes.
  - route: runner:sync:dataset:upsert
    citedTest: "the paid client cannot be built without authorisation > refuses a service-role database client without the capability"
    reason: >-
      syncDataset is never called by it. It does construct its client through
      serviceRoleClient, but "shares a helper with a tested function" is not
      evidence about this function.
  - route: runner:sync:run:upsert
    citedTest: "the paid client cannot be built without authorisation > refuses a service-role database client without the capability"
    reason: >-
      syncRun is never called. The string 'syncRun' does appear in the test — as
      the context argument to serviceRoleClient — which is why the validator
      matches a CALL and not a mention.
  - route: runner:sync:run:publish
    citedTest: "the paid client cannot be built without authorisation > refuses a service-role database client without the capability"
    reason: >-
      publishRun is never called; 'publishRun' appears only as a string
      argument to serviceRoleClient, and RELEASE-002 already records that
      assertPublishable is not called here either.
  - route: runner:permit:keyring:read
    citedTest: "signature verification > refuses an unknown key id, and a key id that traverses"
    reason: >-
      The test drives a local verify() wrapper that supplies its own
      keyringDir. It therefore proves the behaviour of the TEST SEAM, not of
      the production trust root, and loadPublicKey's production caller is never
      the thing under test. This is the bypass RUN-001 already records as a gap.
  - route: runner:permit:revocation:read
    citedTest: "revocation fails closed > refuses when the revocation list is absent, rather than assuming nothing is revoked"
    reason: >-
      Same wrapper, and it passes revocationListPath explicitly. A production
      caller can do the same thing, so a green test here says nothing about the
      committed list.
  - route: runner:cli:pilot:record:write
    citedTest: "the paid client cannot be built without authorisation > refuses a candidate client to a judge-only permit"
    reason: >-
      Exercises OpenRouterClient.forCandidates. cmdPilot is never called, and
      RUN-001 requires `bench pilot` to be DISABLED for v3, which no test
      asserts either.
  - route: runner:judge:panel:complete
    citedTest: "panel seat assignment > never lets a judge score its own base model under another vendor prefix"
    reason: >-
      Exercises panelSeats. It does not prove judgeAnswerPanel consults the
      result before calling a seat. One sibling test does drive
      judgeAnswerPanel, and that one is retained; the provider and base-family
      arms are not covered through the route itself.

routes:
  # === packages/runner/src/store.ts ========================================
  - key: runner:regenerate:acceptance:read
    file: packages/runner/src/regenerate.ts
    function: buildAcceptanceSummary
    kind: fs-read
    operation: reads the traceability matrix and route registry to rebuild the acceptance summary
    risks:
      - risk: unverified-input
        severity: low
        status: closed
        enforcementPoint: >-
          Reads only the two committed acceptance artifacts, by fixed path. The
          caller names neither file, so the generator cannot be pointed at a
          source that would make it agree with itself.
        test: "the acceptance summary regenerates byte-identically > produces identical bytes on repeated generation"

  - key: runner:regenerate:acceptance:write
    file: packages/runner/src/regenerate.ts
    function: writeAcceptanceSummary
    kind: fs-write
    operation: writes docs/wp-0/acceptance-summary.md, the regenerable acceptance artifact
    risks:
      - risk: historical-overwrite
        severity: low
        status: closed
        enforcementPoint: >-
          One fixed path under docs/, outside data/runs and data/taste, so this
          writer cannot reach a run artifact whatever it is asked to do.
        test: "the regeneration check can actually fail > leaves the committed summary byte-identical when it is already current"

  - key: runner:store:config:write
    file: packages/runner/src/store.ts
    function: writeRunConfig
    kind: fs-write
    operation: writes config.json for a run
    risks:
      - risk: historical-overwrite
        severity: high
        status: closed
        enforcementPoint: >-
          resolveRunDir write mode, reached through writeRunFileAtomic. The refusal is
          asserted with an IDENTICAL config fed straight back, so the RUN-002 protocol
          gate cannot stand in for it, and the frozen run's fingerprint — files plus
          directory listing, so a stray staging file shows up — is compared before and
          after.
        test: "runner:store:config:write — writeRunConfig > refuses to write config.json into a published run"

  - key: runner:store:config:merge
    file: packages/runner/src/store.ts
    function: mergeRunConfig
    kind: fs-write
    operation: merges a resumed batch into an existing run config and persists it
    risks:
      - risk: historical-overwrite
        severity: high
        status: closed
        enforcementPoint: >-
          The same guard on the path an operator actually reaches: `bench run --run-id
          <published>` merges rather than writes. Proved with an identical config so
          the protocol gate is out of the picture, and paired with a control that
          drives the true merge branch at a scratch id.
        test: "runner:store:config:merge — mergeRunConfig > refuses to merge a resumed batch into a published run"

  - key: runner:store:attempt:begin
    file: packages/runner/src/store.ts
    function: beginAttempt
    kind: fs-write
    operation: opens an attempt record for one (model, question, cause) coordinate
    risks:
      - risk: historical-overwrite
        severity: high
        status: closed
        enforcementPoint: firewall.writeRunFileAtomic via resolveRunFile, in the real writer
        test: "RUN-002 — attempt ids are derived, never counted > opens no attempt record inside a frozen historical run"

  - key: runner:store:attempt:settle
    file: packages/runner/src/store.ts
    function: settleAttempt
    kind: fs-write
    operation: closes an attempt record and books its charge
    risks:
      - risk: budget-bypass
        severity: high
        status: closed
        enforcementPoint: an attempt id is derived from the coordinate, so a replay settles once
        test: "RUN-002 — attempt ids are derived, never counted > books one charge, and refuses a second, different one"
      - risk: historical-overwrite
        severity: medium
        status: closed
        enforcementPoint: >-
          writeRunFileAtomic on the attempts directory, so settling against a
          published run refuses and books no charge. Asserted on the artifact as well
          as the throw: the frozen run is byte-identical afterwards.
        test: "runner:store:attempt:settle — settleAttempt > books no charge against a published run, and leaves it byte-identical"

  - key: runner:store:response:write
    file: packages/runner/src/store.ts
    function: writeResponse
    kind: fs-write
    operation: writes one candidate response JSON
    risks:
      - risk: historical-overwrite
        severity: high
        status: closed
        enforcementPoint: firewall.writeRunFileAtomic via resolveRunFile
        test: "DATA-001 — historical artifacts cannot be overwritten > blocks the real writers, not just the resolver"
      - risk: historical-overwrite
        severity: high
        status: closed
        enforcementPoint: injective responseFileName with a byte bound, so one cell cannot land on another's file
        test: "adversarial round 2 — bypasses Codex reproduced on 3edf98c > has an injective response filename across tuple boundaries"
      - risk: path-escape
        severity: high
        status: closed
        enforcementPoint: assertSafePathComponent on the question id, at the writer boundary
        test: "filename components are validated at the writer boundary > refuses a traversing question id through the real writer"

  - key: runner:store:scores:write
    file: packages/runner/src/store.ts
    function: writeScores
    kind: fs-write
    operation: writes scores.json for a run
    risks:
      - risk: historical-overwrite
        severity: high
        status: closed
        enforcementPoint: firewall.writeRunFileAtomic via resolveRunFile
        test: "DATA-001 — historical artifacts cannot be overwritten > leaves the published artifact byte-identical after a refused write"

  - key: runner:store:leaderboard:write
    file: packages/runner/src/store.ts
    function: writeLeaderboard
    kind: fs-write
    operation: writes leaderboard.json, which the site selects from
    risks:
      - risk: historical-overwrite
        severity: high
        status: closed
        enforcementPoint: firewall.writeRunFileAtomic, re-resolved against the final leaf
        test: "adversarial round 2 — bypasses Codex reproduced on 3edf98c > refuses a leaf symlink for every run-scoped writer"
      - risk: unauthorised-publish
        severity: high
        status: open
        capability: publication
        enforcementPoint: NOT YET WIRED — needs an approved public-release manifest at the boundary
        test: null

  - key: runner:store:config:read
    file: packages/runner/src/store.ts
    function: readRunConfig
    kind: fs-read
    operation: reads a run's config.json and the protocol binding derived from it
    risks:
      - risk: path-escape
        severity: medium
        status: closed
        enforcementPoint: >-
          resolveRunFile read mode, resolving the LEAF and not merely the run
          directory. This was `join(runDir(runId), 'config.json')`, which validated
          the directory and then followed whatever config.json turned out to be.
        test: "runner:store:artifacts:read — every run-scoped reader resolves its leaf > refuses a linked config.json, scores.json or attempts directory"

  - key: runner:store:attempts:read
    file: packages/runner/src/store.ts
    function: readAttempts
    kind: fs-read
    operation: reads every attempt record for a run, to replay retries and charges
    risks:
      - risk: path-escape
        severity: medium
        status: closed
        enforcementPoint: >-
          readRunJsonEntries, which resolves the attempts directory AND each entry
          inside it. A linked attempts directory would make another run's spend
          satisfy this run's cap, since attemptChargesUsd bills against exactly these
          records.
        test: "runner:store:artifacts:read — every run-scoped reader resolves its leaf > refuses a linked config.json, scores.json or attempts directory"
      - risk: unverified-input
        severity: medium
        status: open
        enforcementPoint: >-
          NOT ENFORCED — an attempt record is parsed and trusted; nothing binds
          it to the manifest under which it was written.
        test: null

  - key: runner:store:responses:read
    file: packages/runner/src/store.ts
    function: readResponses
    kind: fs-read
    operation: reads every stored response for a run
    risks:
      - risk: path-escape
        severity: high
        status: closed
        enforcementPoint: >-
          readRunJsonEntries. Verified before the fix: a scratch run containing
          `responses -> data/runs/2026-07-v2.1/responses` returned all 2,576 frozen
          answers with no error, presented as its own evidence. Both arms are proved —
          the linked directory and a single linked file inside a real one.
        test: "runner:store:responses:read — readResponses resolves its LEAF > refuses a responses directory symlinked at a run that is not this one"

  - key: runner:store:scores:read
    file: packages/runner/src/store.ts
    function: readScores
    kind: fs-read
    operation: reads scores.json, the input to report and analyze
    risks:
      - risk: path-escape
        severity: medium
        status: closed
        enforcementPoint: >-
          readRunFileOrNull, which resolves the leaf. Absence is still absence — a run
          with no scores yet reads as empty — so the refusal is about the link and not
          about the file being missing.
        test: "runner:store:artifacts:read — every run-scoped reader resolves its leaf > refuses a linked config.json, scores.json or attempts directory"

  - key: runner:store:response:probe
    file: packages/runner/src/store.ts
    function: hasResponse
    kind: fs-read
    operation: existence probe that decides whether a paid call is skipped on resume
    risks:
      - risk: budget-bypass
        severity: medium
        status: closed
        enforcementPoint: >-
          responsePath resolves both the current and the legacy filename through the
          firewall, and the probe answers for exactly one cell. Proved in both
          directions, because the two failure modes are opposite: a false negative re-
          buys an answer that already exists, a false positive silently drops a cell.
        test: "runner:store:response:probe — hasResponse > answers for exactly one cell, so a resume neither re-buys nor drops one"

  - key: runner:store:runs:list
    file: packages/runner/src/store.ts
    function: listRuns
    kind: fs-read
    operation: enumerates run directories under data/runs
    risks:
      - risk: path-escape
        severity: low
        status: closed
        enforcementPoint: >-
          Lists the one runs root and returns bare directory names, never paths. Low
          consequence and proved as such rather than claimed to be more.
        test: "runner:store:runs:list — listRuns > returns bare directory names from the one runs root, and no path that leaves it"

  # === packages/runner/src/analyze.ts ======================================
  - key: runner:analyze:analysis:write
    file: packages/runner/src/analyze.ts
    function: writeAnalysis
    kind: fs-write
    operation: writes analysis.json, which the site reads for the separation table
    risks:
      - risk: historical-overwrite
        severity: high
        status: closed
        enforcementPoint: >-
          writeRunFileAtomic — the same writer as every other run artifact. It was a
          bare writeFileSync over a resolveRunDir result, and a probe confirmed a leaf
          symlink redirected the write to a file outside the repository. Both arms are
          proved: the published run refuses, and the link is refused with the outside
          file byte-unchanged.
        test: "runner:analyze:analysis:write — writeAnalysis > refuses to write analysis.json into a published run"
      - risk: unauthorised-publish
        severity: high
        status: open
        capability: publication
        enforcementPoint: NOT YET WIRED
        test: null

  # === packages/runner/src/calibration.ts ==================================
  - key: runner:calibration:result:write
    file: packages/runner/src/calibration.ts
    function: runCalibration
    kind: fs-write
    operation: writes calibration.json after paid judge calls
    risks:
      - risk: historical-overwrite
        severity: high
        status: closed
        enforcementPoint: >-
          writeRunFileAtomic, preflighted at the write TARGET before any paid call.
          The preflight was `join(resolveRunDir(...), 'calibration.json')` and `join`
          validates nothing, so on an unfrozen run the leaf was only checked after the
          judge loop had billed.
        test: "runner:calibration:result:write — runCalibration > refuses to write calibration.json into a published run"
      - risk: budget-bypass
        severity: high
        status: closed
        enforcementPoint: >-
          Order, not arithmetic. The write target is resolved before the first seat is
          contacted, and the assertion is the client's call COUNT: a preflight that
          ran after the loop would throw the same error and still have spent the
          money.
        test: "runner:calibration:result:write — runCalibration > preflights the write TARGET, not its directory, before the first paid call"

  - key: runner:calibration:anchors:read
    file: packages/runner/src/calibration.ts
    function: loadAnchors
    kind: fs-read
    operation: reads data/calibration/anchors.yaml, the hand-scored gate
    risks:
      - risk: unverified-input
        severity: medium
        status: closed
        enforcementPoint: >-
          A fixed module path with no caller input. The claim proved is the one
          recorded — every path the route opens lies inside the committed calibration
          directory — and not some stronger binding it does not have.
        test: "runner:calibration:anchors:read — loadAnchors > reads only the committed anchors, which decide which judges may be paid"

  - key: runner:calibration:result:read
    file: packages/runner/src/calibration.ts
    function: readCalibration
    kind: fs-read
    operation: reads a prior calibration result to decide whether the gate must run again
    risks:
      - risk: unverified-input
        severity: medium
        status: open
        enforcementPoint: >-
          NOT ENFORCED — a stale or hand-edited calibration.json reads as a
          passed gate. Untested.
        test: null

  # === packages/runner/src/adjudicate.ts ===================================
  - key: runner:adjudicate:queue:write
    file: packages/runner/src/adjudicate.ts
    function: writeAdjudicationQueue
    kind: fs-write
    operation: writes the human-review queue for a run, or its shadow equivalent
    risks:
      - risk: historical-overwrite
        severity: high
        status: closed
        enforcementPoint: writeRunFileAtomic for the runs family; the shadow family writes to its own output root
        test: "artifact writes go through the firewall > refuses to write an adjudication queue into a published run"

  - key: runner:adjudicate:record:write
    file: packages/runner/src/adjudicate.ts
    function: writeAdjudicationRecord
    kind: fs-write
    operation: writes the reviewer's decisions, which gate whether a run may report
    risks:
      - risk: historical-overwrite
        severity: high
        status: closed
        enforcementPoint: >-
          resolveRunDir write mode through writeAdjudicationRecord, plus run-id
          validation. The published run is fingerprinted with its directory listing,
          because this writer creates a file the frozen run does not contain.
        test: "runner:adjudicate:record:write — writeAdjudicationRecord > refuses to write a decision record into a published run"

  - key: runner:adjudicate:record:read
    file: packages/runner/src/adjudicate.ts
    function: readAdjudicationRecord
    kind: fs-read
    operation: reads the decisions that permit or block a report
    risks:
      - risk: unverified-input
        severity: high
        status: closed
        enforcementPoint: >-
          The reader refuses an unparseable record and a record whose decisions do not
          validate, rather than reading either as 'no disputes' — which is the failure
          that matters, because a report gate that treats corruption as an all-clear
          publishes disputed scores.
        test: 'runner:adjudicate:record:read — readAdjudicationRecord > refuses an unparseable record rather than reading it as "no disputes"'

  # === packages/runner/src/dataset.ts ======================================
  - key: runner:dataset:questions:read
    file: packages/runner/src/dataset.ts
    function: loadQuestions
    kind: fs-read
    operation: reads the committed question bank
    risks:
      - risk: unverified-input
        severity: low
        status: closed
        enforcementPoint: >-
          A fixed module path with no caller input; the reader cannot be steered
          outside the committed bank. Binding the bank to a declared hash is
          DATA-002's manifest check, which is a different route.
        test: "runner:dataset:questions:read — loadQuestions > reads only the committed bank, and takes no input that could steer it"

  - key: runner:dataset:models:read
    file: packages/runner/src/dataset.ts
    function: loadModels
    kind: fs-read
    operation: reads data/models.yaml, the roster that supplies judge conflict identity
    risks:
      - risk: unverified-input
        severity: medium
        status: closed
        enforcementPoint: >-
          A fixed module path with no caller input. This roster supplies the judge
          conflict identity, so the containment claim is the load-bearing one.
        test: "runner:dataset:models:read — loadModels > reads only the committed roster that supplies judge conflict identity"

  # === packages/runner/src/derive.ts =======================================
  - key: runner:derive:responses:inherit
    file: packages/runner/src/derive.ts
    function: deriveRun
    kind: fs-write
    operation: hard-links or copies a source run's responses into a new run id
    risks:
      - risk: historical-overwrite
        severity: high
        status: closed
        enforcementPoint: the target is resolved for write and the source only for read; in-place and self-derivation are refused
        test: "DATA-001 — a re-scoring run inherits answers instead of overwriting them > refuses the shortcuts that would break immutability"
      - risk: unauthorised-publish
        severity: high
        status: closed
        enforcementPoint: a derived run starts at releaseState draft and inherits no score, board or analysis
        test: "DATA-001 — a re-scoring run inherits answers instead of overwriting them > carries the answers, the lineage and nothing that was earned"

  - key: runner:derive:inheritance:verify
    file: packages/runner/src/derive.ts
    function: verifyDerivation
    kind: fs-read
    operation: re-reads inherited responses and checks them against the recorded lineage hash
    risks:
      - risk: unverified-input
        severity: high
