        test: "web:data:models:read — getModelNames > reads only the committed roster, and degrades to slugs rather than failing open"

  # === apps/web/lib/supabase.ts ============================================
  # These are PostgREST calls made with `fetch`, not through a database driver,
  # which is why the kind is network-out rather than db-write. The previous
  # registry recorded castTasteVote as db-write; that would now fail the
  # backward check, because no database sink exists in this file to resolve to.
  - key: web:supabase:vote:insert
    file: apps/web/lib/supabase.ts
    function: castTasteVote
    kind: network-out
    operation: anonymous ballot insert from the public site
    risks:
      - risk: unauthorised-publish
        severity: medium
        capability: live-db-write
        status: closed
        enforcementPoint: >-
          The insert posts to the ballot table and nowhere else, and a ballot the
          server refuses is reported as NOT cast — a vote must never be lost silently,
          and it must never be shown as saved when it was not.
        test: "web:supabase:vote:insert — castTasteVote > posts only to the ballot table, and reports a refused ballot as not cast"

  - key: web:supabase:flight-ballot:insert
    file: apps/web/lib/supabase.ts
    function: castFlightBallot
    kind: network-out
    operation: anonymous tasting-flight ballot insert
    risks:
      - risk: unauthorised-publish
        severity: medium
        capability: live-db-write
        status: closed
        enforcementPoint: >-
          A refused ballot stays distinguishable from a recorded one, and the client
          sets no evidence class — the class is the server's to decide, never the
          browser's.
        test: "web:supabase:flight-ballot:insert — castFlightBallot > keeps a refused ballot apart from a recorded one, and sets no evidence class"

  - key: web:supabase:ballot-reason:insert
    file: apps/web/lib/supabase.ts
    function: castBallotReason
    kind: network-out
    operation: anonymous free-text reason attached to a flight ballot
    risks:
      - risk: unauthorised-publish
        severity: medium
        capability: live-db-write
        status: closed
        enforcementPoint: >-
          The body carries an index and a nonce, never free text from the public
          internet.
        test: "web:supabase:ballot-reason:insert — castBallotReason > sends an index and a nonce, never free text from the public internet"

  - key: web:supabase:votes:read
    file: apps/web/lib/supabase.ts
    function: getAllTasteVotes
    kind: network-out
    operation: pages the whole ballot table out of the live project for the Taste board
    risks:
      - risk: unverified-input
        severity: low
        status: closed
        enforcementPoint: >-
          Reads the RLS-limited ballot view, and discards a partial read entirely
          rather than fitting a ranking on part of the ballots.
        test: "web:supabase:votes:read — getAllTasteVotes > reads the RLS-limited ballot view, and discards a partial read entirely"

  - key: web:supabase:winrates:read
    file: apps/web/lib/supabase.ts
    function: getTasteWinrates
    kind: network-out
    operation: reads the taste_winrates view
    risks:
      - risk: unverified-input
        severity: low
        status: closed
        enforcementPoint: >-
          Reads the tally view only, and returns null rather than an empty ranking —
          an empty board and an unavailable board must not look the same.
        test: "web:supabase:winrates:read — getTasteWinrates > reads the tally view only, and returns null rather than an empty ranking"

  - key: web:supabase:flight-ballots:read
    file: apps/web/lib/supabase.ts
    function: getFlightBallots
    kind: network-out
    operation: reads flight ballots back for the Taste board
    risks:
      - risk: unverified-input
        severity: low
        status: closed
        enforcementPoint: >-
          Throws away every page when any page fails, rather than fitting a board on
          the pages that happened to load.
        test: "web:supabase:flight-ballots:read — getFlightBallots > throws away every page when any page fails, rather than fitting a board on part of them"
