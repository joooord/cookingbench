# RUN-001A — curated semantic route registry.
#
# Hand-maintained, not generated. The previous inventory inferred route identity
# from auditor prose (sha256 of file|kind|symbol), which produced 41 inferred
# symbols that do not occur in the source, merged distinct sinks, and split
# single sinks across several ids. An identity derived from prose is not an
# identity.
#
# Each entry is keyed by a stable semantic route key. Every dangerous risk on a
# route carries its OWN status, enforcement point, capability and named test
# case; the route is `open` until every one of its risks is closed. Raw auditor
# observations are attached by the generator from the committed input.
#
# Completeness is checked bidirectionally: every route here must resolve to a
# real sink in the source, and every filesystem/network/database sink found by
# the scanner must appear here.

pinnedCommit: 980dfcb5e3ff920fe1a3231121a6115e3fa48dcb
routeKinds: [fs-write, fs-read, fs-delete, network-out, db-write, db-read, process-exec]

routes:
  # --- run artifact writers -------------------------------------------------
  - key: runner:store:config:write
    file: packages/runner/src/store.ts
    function: writeRunConfig
    kind: fs-write
    operation: writes config.json for a run
    risks:
      - risk: historical-overwrite
        status: closed
        enforcementPoint: firewall.writeRunFileAtomic via resolveRunFile
        test: "adversarial round 2 — bypasses Codex reproduced on 3edf98c > refuses a leaf symlink for every run-scoped writer"

  - key: runner:store:response:write
    file: packages/runner/src/store.ts
    function: writeResponse
    kind: fs-write
    operation: writes one candidate response JSON
    risks:
      - risk: historical-overwrite
        status: closed
        enforcementPoint: firewall.writeRunFileAtomic via resolveRunFile
        test: "DATA-001 — historical artifacts cannot be overwritten > blocks the real writers, not just the resolver"
      - risk: historical-overwrite
        status: closed
        enforcementPoint: injective responseFileName with byte bound
        test: "adversarial round 2 — bypasses Codex reproduced on 3edf98c > has an injective response filename across tuple boundaries"

  - key: runner:store:scores:write
    file: packages/runner/src/store.ts
    function: writeScores
    kind: fs-write
    operation: writes scores.json for a run
    risks:
      - risk: historical-overwrite
        status: closed
        enforcementPoint: firewall.writeRunFileAtomic via resolveRunFile
        test: "DATA-001 — historical artifacts cannot be overwritten > leaves the published artifact byte-identical after a refused write"

  - key: runner:store:leaderboard:write
    file: packages/runner/src/store.ts
    function: writeLeaderboard
    kind: fs-write
    operation: writes leaderboard.json, which the site selects from
    risks:
      - risk: historical-overwrite
        status: closed
        enforcementPoint: firewall.writeRunFileAtomic via resolveRunFile
        test: "adversarial round 2 — bypasses Codex reproduced on 3edf98c > refuses a leaf symlink for every run-scoped writer"
      - risk: unauthorised-publish
        status: open
        capability: publication
        enforcementPoint: "NOT YET WIRED — needs an approved public-release manifest at the boundary"
        test: null

  - key: runner:analyze:analysis:write
    file: packages/runner/src/analyze.ts
    function: writeAnalysis
    kind: fs-write
    operation: writes analysis.json, which the site reads for the separation table
    risks:
      - risk: historical-overwrite
        status: closed
        enforcementPoint: firewall.resolveRunDir write mode
        test: "path confinement — the traversal that WP-0 closed > guards files inside a frozen run, and validates the final target"
      - risk: unauthorised-publish
        status: open
        capability: publication
        enforcementPoint: "NOT YET WIRED"
        test: null

  - key: runner:calibration:result:write
    file: packages/runner/src/calibration.ts
    function: runCalibration
    kind: fs-write
    operation: writes calibration.json after paid judge calls
    risks:
      - risk: historical-overwrite
        status: closed
        enforcementPoint: firewall.writeRunFileAtomic, re-resolved immediately before write
        test: "path confinement — the traversal that WP-0 closed > guards files inside a frozen run, and validates the final target"

  # --- run artifact readers -------------------------------------------------
  - key: runner:store:responses:read
    file: packages/runner/src/store.ts
    function: readResponses
    kind: fs-read
    operation: reads every stored response for a run
    risks:
      - risk: historical-overwrite
        status: closed
        enforcementPoint: resolveRunDir read mode rejects symlink components
        test: "adversarial round 2 — bypasses Codex reproduced on 3edf98c > refuses a linked responses directory on read as well as write"

  # --- taste ---------------------------------------------------------------
  - key: runner:taste:archive:replace
    file: packages/runner/src/taste.ts
    function: archiveTasteVotes
    kind: fs-write
    operation: replaces the permanent ballot archive and ratings snapshot
    risks:
      - risk: historical-overwrite
        status: closed
        enforcementPoint: assertArchiveGrows superset check plus atomic replace
        test: "adversarial round 2 — bypasses Codex reproduced on 3edf98c > refuses a Taste archive that loses, mutates or reorders a committed ballot"

  - key: runner:taste:votes:read
    file: packages/runner/src/taste.ts
    function: archiveTasteVotes
    kind: db-read
    operation: reads every row of the live taste_votes table
    risks:
      - risk: unauthorised-inference
        status: closed
        capability: result-sync
        enforcementPoint: supabase.serviceRoleClient — the only construction path, capability-checked
        test: "the paid client cannot be built without authorisation > refuses a service-role database client without the capability"

  # --- network -------------------------------------------------------------
  - key: runner:openrouter:completion:post
    file: packages/runner/src/openrouter.ts
    function: complete
    kind: network-out
    operation: paid completion call to a candidate or judge model
    risks:
      - risk: unauthorised-inference
        status: closed
        capability: candidate-inference
        enforcementPoint: private constructor plus runtime grant check; forCandidates/forJudging split
        test: "the paid client cannot be built without authorisation > refuses a candidate client to a judge-only permit"
      - risk: unauthorised-inference
        status: closed
        capability: candidate-inference
        enforcementPoint: per-call requireCell before any transport
        test: "every completion is authorised and accounted for > refuses a cell the permit does not name, without making the call"
      - risk: budget-bypass
        status: closed
        capability: candidate-inference
        enforcementPoint: ReservationLedger reserve/settle/release around each call
        test: "every completion is authorised and accounted for > stops at the cap instead of spending past it"

  - key: runner:openrouter:catalog:get
    file: packages/runner/src/openrouter.ts
    function: fetchCatalog
    kind: network-out
    operation: live catalog and pricing fetch
    risks:
      - risk: unauthorised-inference
        status: closed
        capability: catalog-read
        enforcementPoint: capability check before the request; reclassified from benign because it is still network activity
        test: "the paid client cannot be built without authorisation > refuses the live catalog without catalog-read, before any request"

  # --- derivation --------------------------------------------------------------
  - key: runner:derive:responses:inherit
    file: packages/runner/src/derive.ts
    function: deriveRun
    kind: fs-write
    operation: hard-links or copies a source run's responses into a new run id
    risks:
      - risk: historical-overwrite
        status: open
        enforcementPoint: "NOT YET REVIEWED — writes via linkSync/copyFileSync; needs confirming these go through the firewall resolver rather than around it"
        test: null
      - risk: unauthorised-publish
        status: open
        capability: publication
        enforcementPoint: "NOT YET WIRED — a derived run must not inherit its source's release state"
        test: null

  # --- permits ---------------------------------------------------------------
  - key: runner:permit:keyring:read
    file: packages/runner/src/permit.ts
    function: loadPublicKey
    kind: fs-read
    operation: reads a committed Ed25519 public verification key
    risks:
      - risk: unauthorised-inference
        status: closed
        enforcementPoint: key id pattern, symlink refusal, ed25519 key-type pin
        test: "signature verification > refuses an unknown key id, and a key id that traverses"
      - risk: unauthorised-publish
        status: closed
        enforcementPoint: absent keyring refuses rather than defaulting to trust
        test: "signature verification > refuses when the keyring is absent"

  - key: runner:permit:revocation:read
    file: packages/runner/src/permit.ts
    function: revokedPermitIds
    kind: fs-read
    operation: reads the committed permit revocation list
    risks:
      - risk: unauthorised-inference
        status: closed
        enforcementPoint: absent or malformed list refuses; revoked ids rejected after signature
        test: "revocation fails closed > refuses when the revocation list is absent, rather than assuming nothing is revoked"

  - key: runner:permit:redemption:write
    file: packages/runner/src/redemption.ts
    function: redeemPermit
    kind: fs-write
    operation: records one use of a permit against its execution limit
    risks:
      - risk: unauthorised-inference
        status: closed
        enforcementPoint: "open(wx) per redemption slot — the filesystem arbitrates, so there is no count-then-write window"
        test: "single use means single use > refuses a second redemption of a single-use permit"
      - risk: unauthorised-inference
        status: closed
        enforcementPoint: durable on-disk record, so a restarted runner cannot replay
        test: "single use means single use > survives the process, because the record is on disk"
      - risk: historical-overwrite
        status: closed
        enforcementPoint: resolveRunFile write mode
        test: "single use means single use > cannot record a redemption against a published run"

  - key: runner:judge:seating:conflict
    file: packages/runner/src/judge.ts
    function: panelSeats
    kind: process-exec
    operation: chooses which judges may score a candidate answer
    risks:
      - risk: unauthorised-publish
        status: closed
        enforcementPoint: "hasJudgeConflict on declared provider AND base-model family, from the roster"
        test: "panel seat assignment > never lets a judge score its own base model under another vendor prefix"
      - risk: unauthorised-publish
        status: closed
        enforcementPoint: an undeclared identity counts as a conflict, not as distinct
        test: "panel seat assignment > treats an undeclared identity as conflicted rather than as distinct"

  - key: runner:permit:envelope:read
    file: packages/runner/src/permit.ts
    function: verifyPermitFile
    kind: fs-read
    operation: reads a signed permit envelope from disk
    risks:
      - risk: unauthorised-inference
        status: closed
        enforcementPoint: verifyPermit — signature before any field is acted on, then kind/class/cell/budget binding
        test: "permit kind bounds what a signature can buy > refuses a legacy-shadow permit that explicitly requests candidate-inference"
      - risk: unauthorised-publish
        status: closed
        enforcementPoint: grant identity is WeakSet membership, not object shape
        test: "a grant is identity, not shape > refuses a hand-built object with the right shape"

  # --- budget --------------------------------------------------------------
  - key: runner:ledger:spend:journal
    file: packages/runner/src/ledger.ts
    function: ReservationLedger
    kind: fs-write
    operation: atomic spend reservation, journalled to data/runs/<id>/spend.ndjson
    risks:
      - risk: budget-bypass
        status: closed
        capability: candidate-inference
        enforcementPoint: reserve() checks and debits in one synchronous step; no await inside
        test: "the check-then-record race is closed > never authorises more concurrent calls than the cap allows"
      - risk: budget-bypass
        status: closed
        capability: candidate-inference
        enforcementPoint: journal replay on construction, so a resumed run inherits prior spend
        test: "spend survives the process > replays prior spend so a resumed run does not spend its cap twice"
      - risk: budget-bypass
        status: closed
        capability: candidate-inference
        enforcementPoint: exclusive run lock via open(wx), with dead-holder takeover
        test: "two runners cannot each spend the whole cap > refuses a second ledger while the first holds the lock"
      - risk: historical-overwrite
        status: closed
        enforcementPoint: write-mode resolveRunDir preflight in the constructor
        test: "the cap comes from the permit > refuses to spend against a published run"

  # --- web -----------------------------------------------------------------
  - key: web:data:board:select
    file: apps/web/lib/data.ts
    function: getLatestReport
    kind: fs-read
    operation: selects the published board by newest generatedAt
    risks:
      - risk: unauthorised-publish
        status: open
        capability: publication
        enforcementPoint: "NOT YET WIRED — heuristic selection, not an approved manifest"
        test: null

  - key: web:supabase:vote:insert
    file: apps/web/lib/supabase.ts
    function: castTasteVote
    kind: db-write
    operation: anonymous ballot insert from the public site
    risks:
      - risk: unauthorised-publish
        status: open
        capability: live-db-write
        enforcementPoint: "NOT YET WIRED — RLS only; no signed ballot"
        test: null

  # --- sinks the validator found that the first registry missed -------------
  - key: runner:sync:dataset:upsert
    file: packages/runner/src/sync.ts
    function: syncDataset
    kind: db-write
    operation: upserts models and questions into Supabase
    risks:
      - risk: unauthorised-publish
        status: closed
        capability: result-sync
        enforcementPoint: supabase.serviceRoleClient — the only construction path, capability-checked
        test: "the paid client cannot be built without authorisation > refuses a service-role database client without the capability"

  - key: runner:sync:run:upsert
    file: packages/runner/src/sync.ts
    function: syncRun
    kind: db-write
    operation: upserts run, responses and scores into Supabase
    risks:
      - risk: unauthorised-publish
        status: closed
        capability: result-sync
        enforcementPoint: supabase.serviceRoleClient requires result-sync
        test: "the paid client cannot be built without authorisation > refuses a service-role database client without the capability"
      - risk: unauthorised-publish
        status: open
        capability: publication
        enforcementPoint: "NOT YET WIRED — the capability is checked but the run's own manifest is not"
        test: null

  - key: runner:sync:run:publish
    file: packages/runner/src/sync.ts
    function: publishRun
    kind: db-write
    operation: makes a synced run publicly readable
    risks:
      - risk: unauthorised-publish
        status: closed
        capability: publication
        enforcementPoint: serviceRoleClient requires the publication capability, distinct from result-sync
        test: "the paid client cannot be built without authorisation > refuses a service-role database client without the capability"
      - risk: unauthorised-publish
        status: open
        capability: publication
        enforcementPoint: "NOT YET WIRED — assertPublishable is still not called here, so the capability is checked but the artifact is not"
        test: null

  - key: runner:estimate:record:write
    file: packages/runner/src/estimate.ts
    function: runEstimate
    kind: fs-write
    operation: writes data/.estimate.json, the gate hash for a paid run
    risks:
      - risk: budget-bypass
        status: open
        capability: candidate-inference
        enforcementPoint: "NOT YET WIRED — gate record is unguarded and gitignored"
        test: null

  - key: runner:cli:pilot:record:write
    file: packages/runner/src/cli.ts
    function: cmdPilot
    kind: fs-write
    operation: writes data/pilot/<batch>.json admission records
    risks:
      - risk: unauthorised-inference
        status: closed
        capability: candidate-inference
        enforcementPoint: cmdPilot requires a grant and builds its client through forCandidates
        test: "the paid client cannot be built without authorisation > refuses a candidate client to a judge-only permit"
