        test: null

  - key: runner:cli:run:complete
    file: packages/runner/src/cli.ts
    function: cmdRun
    kind: network-out
    operation: the candidate execution command; buys an answer per (model, question)
    risks:
      - risk: unauthorised-inference
        severity: high
        status: open
        enforcementPoint: >-
          UNPROVEN — it builds its client through forCandidates, which is
          guarded and tested, but no test drives cmdRun, so the wiring between
          the command and the guard is unverified.
        test: null

  - key: runner:cli:pilot:complete
    file: packages/runner/src/cli.ts
    function: cmdPilot
    kind: network-out
    operation: the admission gate; buys answers from a ceiling and a mid model
    risks:
      - risk: unauthorised-inference
        severity: high
        status: open
        capability: candidate-inference
        enforcementPoint: >-
          NOT ENFORCED — RUN-001 requires `bench pilot` to be DISABLED for v3,
          and it is not. No test asserts the disablement, and the previous
          citation exercised forCandidates rather than cmdPilot. See
          falselyClosed.
        test: null

  # === apps/web/lib/data.ts ================================================
  # Server-side readers behind the public site. None of them has any test:
  # apps/web contains no test file at all, which is why every risk here is
  # open. That is a statement of fact, not a judgement about the code.
  - key: web:data:board:select
    file: apps/web/lib/data.ts
    function: getLatestReport
    kind: fs-read
    operation: selects the published board by newest generatedAt
    risks:
      - risk: unauthorised-publish
        severity: high
        capability: publication
        status: closed
        enforcementPoint: >-
          The site serves the run the release register approves, and refuses to
          promote a newer board nobody approved — the generatedAt heuristic this
          replaced would have published whichever board was written last.
        test: "web:data:board:select — getLatestReport > serves the approved release, and refuses to promote a newer board nobody approved"

  - key: web:data:analysis:read
    file: apps/web/lib/data.ts
    function: getAnalysis
    kind: fs-read
    operation: reads analysis.json for the separation and places tables
    risks:
      - risk: unauthorised-publish
        severity: high
        status: open
        capability: publication
        enforcementPoint: >-
          NOT YET WIRED — the separation claims the site publishes come from a
          file selected by the same timestamp heuristic as the board.
        test: null

  - key: web:data:run-config:read
    file: apps/web/lib/data.ts
    function: getRunConfig
    kind: fs-read
    operation: reads a run's config.json for the methodology labels shown on the site
    risks:
      - risk: unverified-input
        severity: medium
        status: open
        enforcementPoint: NOT ENFORCED — parsed and rendered with no binding to a manifest.
        test: null

  - key: web:data:run-cost:read
    file: apps/web/lib/data.ts
    function: getRunCost
    kind: fs-read
    operation: reads config and calibration files to show what a run cost
    risks:
