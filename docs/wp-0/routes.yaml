  # === packages/runner/src/firewall.ts =====================================
  # Registered rather than exempt: a guard that leaves itself out of the
  # register of dangerous routes is choosing its own scope.
  - key: runner:firewall:registry:read
    file: packages/runner/src/firewall.ts
    function: readHistoricalRegistry
    kind: fs-read
    operation: reads data/historical-runs.json, the list of frozen run ids
    risks:
