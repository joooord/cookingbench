# RUN-001A — curated semantic route registry.
#
# Hand-maintained, not generated. The previous inventory inferred route identity
# from auditor prose (sha256 of file|kind|symbol), which produced 41 inferred
# symbols that do not occur in the source, merged distinct sinks, and split
# single sinks across several ids. An identity derived from prose is not an
# identity.
#
# Each entry is keyed by a stable semantic route key. Every risk on a route
# carries its OWN status, severity, enforcement point and named test case; the
# route is `open` until every one of its risks is closed.
#
# ---------------------------------------------------------------------------
# What changed in this revision, and why
# ---------------------------------------------------------------------------
#
# 1. READS ARE ROUTES. The scanner previously looked for writes, network calls
#    and database calls only, so a new *reader* was never forced into the
#    registry. A read is how untrusted content crosses the boundary and how a
#    traversal escapes a root; it is not exempt. Every reader now appears. A
#    read of the committed dataset is a LOW-severity route — argued for in the
#    entry, never omitted from it.
#
# 2. apps/web IS SCANNED. The two web entries used to be hand-written and were
#    never checked against the source, which is how five further PostgREST
#    routes in apps/web/lib/supabase.ts and seven filesystem readers in
#    apps/web/lib/data.ts stayed invisible. The scan now covers every scanRoot
#    below, so a new route on the site fails the build until it is registered.
#
# 3. A CITATION MUST TOUCH THE REAL PATH. A closed risk must name a test that
#    CALLS the route's own function. A test of a helper the route happens to
#    use proves nothing about the route: it cannot fail if the route stops
#    calling the helper. Applying that rule downgraded eleven risks that read
#    as closed — see `falselyClosed` below. This is the same defect class as a
#    traceability matrix that validates itself.
#
# 4. THE ENFORCEMENT LAYER IS NOT EXEMPT FROM ITS OWN INVENTORY. firewall.ts
#    used to be skipped by the scanner because it "is the guard". A guard that
#    excludes itself from the register of dangerous routes is choosing its own
#    scope, which is the exact failure this work package exists to prevent.
#    Its eight writers and twenty-four readers are registered like any other.
#
# Completeness is checked in BOTH directions by
# packages/runner/test/route-inventory.test.ts:
#   forward  — every (file, kind) sink the scanner finds has a route here;
#   backward — every route here resolves to a sink of that kind, in that file,
#              behind a symbol that file really declares.
#
# Known granularity limit, stated rather than hidden: enforcement is at
# (file, kind), not (function, kind). Attributing a sink line to its enclosing
# symbol needs a parser, and the regex approximation misattributed roughly a
# third of sites in trial (it reads `const path = join(...)` as the enclosing
# function). A build gate that cries wolf gets suppressed. So: adding a NEW
# reader to a file that already has a registered reader will not fail the
# build. Adding the first reader to a file will. That is weaker than ideal and
# is why each sink is still enumerated by hand below.

pinnedCommit: 980dfcb5e3ff920fe1a3231121a6115e3fa48dcb

# Everything under these roots is scanned. Adding a source tree without adding
# it here is how apps/web went unchecked for two revisions.
scanRoots:
  - packages/core/src
  - packages/runner/src
  - apps/web

routeKinds: [fs-write, fs-read, fs-delete, network-out, db-write, db-read, process-exec]

# `unverified-input` and `path-escape` were added when reads entered the
# registry: neither `historical-overwrite` nor the other three write-shaped
# risks describes what a reader can do wrong. `secret-exposure` covers the one
# route that pulls credentials into the process. Widening the vocabulary is not
# a weakening — shoehorning a reader into `historical-overwrite` would have
# been, because it would have made the risk unfalsifiable.
riskKinds:
  - historical-overwrite   # a published artifact can be altered or destroyed
  - unauthorised-publish   # a public result or ranking can be created without approval
  - budget-bypass          # money can be spent outside a reservation
  - unauthorised-inference # a paid or privileged client can act without a permit
  - unverified-input       # content crosses the boundary unbound to a declared hash
  - path-escape            # the route can be steered outside its declared root
  - secret-exposure        # the route reads credentials into the process

severities: [low, medium, high]

# Risks that the previous revision recorded as CLOSED and that this revision
# reopened, each because the cited test never calls the route it certified.
# Recorded, not fixed: fixing the underlying code is not this task's remit.
falselyClosed:
  - route: runner:store:config:write
    citedTest: "adversarial round 2 — bypasses Codex reproduced on 3edf98c > refuses a leaf symlink for every run-scoped writer"
    reason: >-
      That test iterates writeScores and writeLeaderboard. writeRunConfig is
      never called by it, so nothing proves the config writer resolves its leaf
      target — which is precisely the bug the test was written for.
  - route: runner:store:responses:read
    citedTest: "adversarial round 2 — bypasses Codex reproduced on 3edf98c > refuses a linked responses directory on read as well as write"
    reason: >-
      The test calls resolveRunFile twice. readResponses is never invoked, so a
      readResponses that stopped resolving through the firewall would still be
      green.
  - route: runner:analyze:analysis:write
    citedTest: "path confinement — the traversal that WP-0 closed > guards files inside a frozen run, and validates the final target"
    reason: >-
      Exercises resolveRunFile only. writeAnalysis in fact writes with a bare
      writeFileSync over a resolveRunDir result, so it never reaches the
      leaf-target validation that the cited test is about.
  - route: runner:calibration:result:write
    citedTest: "path confinement — the traversal that WP-0 closed > guards files inside a frozen run, and validates the final target"
    reason: Exercises resolveRunFile only; runCalibration is never called.
  - route: runner:taste:archive:replace
    citedTest: "adversarial round 2 — bypasses Codex reproduced on 3edf98c > refuses a Taste archive that loses, mutates or reorders a committed ballot"
    reason: >-
      The test calls assertArchiveGrows directly. Nothing proves
      archiveTasteVotes calls it before replacing the ballot record. The guard
      is proved; the writer that must use it is not. The test has been moved to
      the guard's own route, where it is honest.
  - route: runner:taste:votes:read
    citedTest: "the paid client cannot be built without authorisation > refuses a service-role database client without the capability"
    reason: >-
      Exercises serviceRoleClient. archiveTasteVotes is never called. The same
      citation was doing duty for four separate database routes.
  - route: runner:sync:dataset:upsert
    citedTest: "the paid client cannot be built without authorisation > refuses a service-role database client without the capability"
    reason: >-
      syncDataset is never called by it. It does construct its client through
      serviceRoleClient, but "shares a helper with a tested function" is not
      evidence about this function.
  - route: runner:sync:run:upsert
    citedTest: "the paid client cannot be built without authorisation > refuses a service-role database client without the capability"
    reason: >-
      syncRun is never called. The string 'syncRun' does appear in the test — as
      the context argument to serviceRoleClient — which is why the validator
      matches a CALL and not a mention.
  - route: runner:sync:run:publish
    citedTest: "the paid client cannot be built without authorisation > refuses a service-role database client without the capability"
    reason: >-
      publishRun is never called; 'publishRun' appears only as a string
      argument to serviceRoleClient, and RELEASE-002 already records that
      assertPublishable is not called here either.
  - route: runner:permit:keyring:read
    citedTest: "signature verification > refuses an unknown key id, and a key id that traverses"
    reason: >-
      The test drives a local verify() wrapper that supplies its own
      keyringDir. It therefore proves the behaviour of the TEST SEAM, not of
      the production trust root, and loadPublicKey's production caller is never
      the thing under test. This is the bypass RUN-001 already records as a gap.
  - route: runner:permit:revocation:read
    citedTest: "revocation fails closed > refuses when the revocation list is absent, rather than assuming nothing is revoked"
    reason: >-
      Same wrapper, and it passes revocationListPath explicitly. A production
      caller can do the same thing, so a green test here says nothing about the
      committed list.
  - route: runner:cli:pilot:record:write
    citedTest: "the paid client cannot be built without authorisation > refuses a candidate client to a judge-only permit"
    reason: >-
      Exercises OpenRouterClient.forCandidates. cmdPilot is never called, and
      RUN-001 requires `bench pilot` to be DISABLED for v3, which no test
      asserts either.
  - route: runner:judge:panel:complete
    citedTest: "panel seat assignment > never lets a judge score its own base model under another vendor prefix"
    reason: >-
      Exercises panelSeats. It does not prove judgeAnswerPanel consults the
      result before calling a seat. One sibling test does drive
      judgeAnswerPanel, and that one is retained; the provider and base-family
      arms are not covered through the route itself.

routes:
  # === packages/runner/src/store.ts ========================================
  - key: runner:regenerate:acceptance:read
    file: packages/runner/src/regenerate.ts
    function: buildAcceptanceSummary
    kind: fs-read
    operation: reads the traceability matrix and route registry to rebuild the acceptance summary
    risks:
      - risk: unverified-input
        severity: low
        status: closed
        enforcementPoint: >-
          Reads only the two committed acceptance artifacts, by fixed path. The
          caller names neither file, so the generator cannot be pointed at a
          source that would make it agree with itself.
        test: "the acceptance summary regenerates byte-identically > produces identical bytes on repeated generation"

  - key: runner:regenerate:acceptance:write
    file: packages/runner/src/regenerate.ts
    function: writeAcceptanceSummary
    kind: fs-write
    operation: writes docs/wp-0/acceptance-summary.md, the regenerable acceptance artifact
    risks:
      - risk: historical-overwrite
        severity: low
        status: closed
        enforcementPoint: >-
          One fixed path under docs/, outside data/runs and data/taste, so this
          writer cannot reach a run artifact whatever it is asked to do.
        test: "the regeneration check can actually fail > leaves the committed summary byte-identical when it is already current"

  - key: runner:store:config:write
    file: packages/runner/src/store.ts
    function: writeRunConfig
    kind: fs-write
    operation: writes config.json for a run
    risks:
      - risk: historical-overwrite
        severity: high
        status: open
        enforcementPoint: >-
          UNPROVEN — writeRunFileAtomic is on the path by inspection, but no
          test calls writeRunConfig against a frozen run. See falselyClosed.
        test: null

  - key: runner:store:config:merge
    file: packages/runner/src/store.ts
    function: mergeRunConfig
    kind: fs-write
    operation: merges a resumed batch into an existing run config and persists it
    risks:
      - risk: historical-overwrite
        severity: high
        status: open
        enforcementPoint: >-
          UNPROVEN — the 24 protocol tests that drive mergeRunConfig all use a
          scratch run id; none drives it at a published one.
        test: null

  - key: runner:store:attempt:begin
    file: packages/runner/src/store.ts
    function: beginAttempt
    kind: fs-write
    operation: opens an attempt record for one (model, question, cause) coordinate
    risks:
      - risk: historical-overwrite
        severity: high
        status: closed
        enforcementPoint: firewall.writeRunFileAtomic via resolveRunFile, in the real writer
        test: "RUN-002 — attempt ids are derived, never counted > opens no attempt record inside a frozen historical run"

  - key: runner:store:attempt:settle
    file: packages/runner/src/store.ts
    function: settleAttempt
    kind: fs-write
    operation: closes an attempt record and books its charge
    risks:
      - risk: budget-bypass
        severity: high
        status: closed
        enforcementPoint: an attempt id is derived from the coordinate, so a replay settles once
        test: "RUN-002 — attempt ids are derived, never counted > books one charge, and refuses a second, different one"
      - risk: historical-overwrite
        severity: medium
        status: open
        enforcementPoint: >-
          UNPROVEN through this entry point — beginAttempt is tested against a
          frozen run, settleAttempt is not.
        test: null

  - key: runner:store:response:write
    file: packages/runner/src/store.ts
    function: writeResponse
    kind: fs-write
    operation: writes one candidate response JSON
    risks:
      - risk: historical-overwrite
        severity: high
        status: closed
        enforcementPoint: firewall.writeRunFileAtomic via resolveRunFile
        test: "DATA-001 — historical artifacts cannot be overwritten > blocks the real writers, not just the resolver"
      - risk: historical-overwrite
        severity: high
        status: closed
        enforcementPoint: injective responseFileName with a byte bound, so one cell cannot land on another's file
        test: "adversarial round 2 — bypasses Codex reproduced on 3edf98c > has an injective response filename across tuple boundaries"
      - risk: path-escape
        severity: high
        status: closed
        enforcementPoint: assertSafePathComponent on the question id, at the writer boundary
        test: "filename components are validated at the writer boundary > refuses a traversing question id through the real writer"

  - key: runner:store:scores:write
    file: packages/runner/src/store.ts
    function: writeScores
    kind: fs-write
    operation: writes scores.json for a run
    risks:
      - risk: historical-overwrite
        severity: high
        status: closed
        enforcementPoint: firewall.writeRunFileAtomic via resolveRunFile
