  # === packages/runner/src/permit.ts =======================================
  # `function` names the REACHABLE BOUNDARY, not the private sink.
  #
  # The sink is `loadPublicKey`, which is module-private and always was. A
  # citation rule that demands the cited test call `route.function` therefore
  # made this risk permanently open for a boundary that is in fact closed —
  # the rule is right in general and wrong here, and weakening the rule to fit
  # would cost far more than it buys. So the route names the only path by which
  # the sink is reachable, and `operation` still names the sink. What makes
  # that honest rather than convenient is asserted, not assumed: the same test
  # proves neither internal is exported, so `verifyPermit` really is the only
  # way in. If either is ever exported, the test fails and this route must be
  # split again.
  - key: runner:permit:keyring:read
    file: packages/runner/src/permit.ts
    function: verifyPermit
    kind: fs-read
    operation: >-
      reads a committed Ed25519 public verification key (loadPublicKey, private;
      reachable only through verifyPermit / verifyPermitFile)
    risks:
      - risk: unauthorised-inference
        severity: high
        status: closed
        enforcementPoint: >-
          The trust root is fixed. `verifyPermit` takes no keyring parameter,
          refuses an options object carrying one — including via the prototype
          chain — and ignores an extra positional argument. Proved with the
          committed fixture's permit body signed by a self-minted key: the
          refusal names the committed keyring directory and lists its contents,
          so a green test cannot be coming from a caller-supplied keyring. A
          traversing key id is rejected as a bad identifier, never sanitised
          into a plausible one.
        test: "runner:permit:keyring:read — verifyPermit at the production boundary > refuses a self-minted key, and every way of naming the keyring that signed it"

  - key: runner:permit:revocation:read
    file: packages/runner/src/permit.ts
    function: verifyPermit
    kind: fs-read
    operation: >-
      reads the committed permit revocation list (revokedPermitIds, private;
      reachable only through verifyPermit / verifyPermitFile)
    risks:
      - risk: unauthorised-inference
        severity: high
        status: closed
        enforcementPoint: >-
          Revocation is consulted before the clock, so the fixture — which is
          both revoked and expired — refuses as REVOKED, which is only
          reachable if the committed list was genuinely read. Every arrangement
          of the production input that would substitute an empty list is
          refused rather than ignored, and after every attempt the permit is
          still revoked.
        test: "runner:permit:revocation:read — verifyPermit at the production boundary > reads the committed revocation list, and no production input can substitute another"

  - key: runner:permit:envelope:read
    file: packages/runner/src/permit.ts
