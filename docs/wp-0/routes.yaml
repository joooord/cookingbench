        test: "runner:firewall:registry:read — readHistoricalRegistry > takes no path, so no caller can name the file that decides what is frozen"
      - risk: path-escape
        severity: high
        status: closed
        enforcementPoint: >-
          The parameter is gone. `readHistoricalRegistry()` takes no argument,
          so a production caller cannot name the file that decides which runs
          are frozen; an extra positional argument is ignored rather than
          honoured. The path form moved to `readHistoricalRegistryForTests`,
