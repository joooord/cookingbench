        severity: high
        status: open
        enforcementPoint: >-
          NOT ENFORCED — these are the numbers the public sees, read straight
          off disk with no hash check against the manifest that produced them.
        test: null

  - key: web:data:responses:read
    file: apps/web/lib/data.ts
    function: getResponses
    kind: fs-read
    operation: reads stored candidate answers for the model and question pages
    risks:
      - risk: unverified-input
        severity: medium
        status: open
        enforcementPoint: NOT ENFORCED — answers are rendered as published without a lineage check.
        test: null

  - key: web:data:questions:read
    file: apps/web/lib/data.ts
    function: getQuestions
    kind: fs-read
    operation: reads the question bank for the public questions page
    risks:
      - risk: unverified-input
        severity: low
        status: closed
        enforcementPoint: >-
          A fixed path with no caller input; every path the reader opens lies inside
          the committed bank. Low severity, and the claim proved is exactly that.
        test: "web:data:questions:read — getQuestions > reads only the committed question bank, and takes no input that could steer it"

