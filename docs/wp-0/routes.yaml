        test: "runner:sync:dataset:upsert — syncDataset > refuses to upsert the dataset without result-sync, before any client is constructed"

  - key: runner:sync:run:upsert
    file: packages/runner/src/sync.ts
    function: syncRun
    kind: db-write
    operation: upserts run, responses and scores into Supabase
    risks:
      - risk: unauthorised-publish
        severity: high
        capability: result-sync
        status: closed
        enforcementPoint: >-
          syncRun refuses a run the permit does not name, before any client is
          constructed. The run id comes from the grant, so a caller cannot sync one
          run under another run's approval.
        test: "runner:sync:run:upsert — syncRun > refuses a run the permit does not name, before any client is constructed"
      - risk: unauthorised-publish
        severity: high
        capability: publication
        status: closed
        enforcementPoint: >-
          The capability itself, and the payload: a rows array carrying another run's
          responses is refused before a client exists, so an approved run id cannot be
          used to smuggle foreign rows.
        test: "runner:sync:run:upsert — syncRun > refuses a payload carrying rows from another run, before any client is constructed"

  - key: runner:sync:run:publish
    file: packages/runner/src/sync.ts
    function: publishRun
    kind: db-write
    operation: makes a synced run publicly readable
    risks:
      - risk: unauthorised-publish
        severity: high
        capability: publication
        status: closed
        enforcementPoint: >-
          publishRun requires the publication capability, and refuses before a client
          exists.
        test: "runner:sync:run:publish — publishRun > refuses to publish without the publication capability, before a client exists"
      - risk: unauthorised-publish
        severity: high
        capability: publication
        status: closed
        enforcementPoint: >-
          And refuses a run the permit does not name: the run id is the grant's, never
          the caller's argument.
        test: "runner:sync:run:publish — publishRun > refuses to publish a run the permit does not name"

  # === packages/runner/src/taste.ts ========================================
  - key: runner:taste:archive:replace
    file: packages/runner/src/taste.ts
    function: archiveTasteVotes
    kind: fs-write
    operation: replaces the permanent ballot archive and ratings snapshot
    risks:
      - risk: historical-overwrite
        severity: high
        status: closed
        enforcementPoint: >-
          assertArchiveGrows is called BY archiveTasteVotes, proved through the route
          rather than through the guard: a replacement set that loses a committed
          ballot is refused. The ballots, not the board, are the permanent record.
        test: "runner:taste:archive:replace — archiveTasteVotes > refuses to replace the ballot record with a set that loses committed ballots"

  - key: runner:taste:archive:guard
    file: packages/runner/src/taste.ts
    function: assertArchiveGrows
    kind: fs-read
    operation: reads the committed ballot archive and refuses any replacement that is not a superset
    risks:
      - risk: historical-overwrite
        severity: high
        status: closed
        enforcementPoint: superset check over the committed lines, refusing loss, mutation, reordering and duplication
        test: "adversarial round 2 — bypasses Codex reproduced on 3edf98c > refuses a Taste archive that loses, mutates or reorders a committed ballot"

  - key: runner:taste:votes:read
    file: packages/runner/src/taste.ts
    function: archiveTasteVotes
    kind: db-read
    operation: reads every row of the live taste_votes table
    risks:
      - risk: unauthorised-inference
        severity: high
        capability: result-sync
        status: closed
        enforcementPoint: >-
          Reading the live ballot table requires result-sync, refused before a client
          exists — asserted through archiveTasteVotes itself, not through
          serviceRoleClient, which was the citation four database routes shared.
        test: "runner:taste:votes:read — archiveTasteVotes > refuses to read the live ballot table without result-sync, before a client exists"

  # === packages/runner/src/cli.ts ==========================================
  - key: runner:cli:env:load
    file: packages/runner/src/cli.ts
    function: envPath
    kind: fs-read
    operation: module-scope .env loader that pulls OPENROUTER_API_KEY and the Supabase service-role key into process.env
    risks:
      - risk: secret-exposure
        severity: medium
        status: open
        enforcementPoint: >-
          NOT ENFORCED — it runs at import time, before any command decides
          whether it needs credentials, so importing the CLI for any reason
          loads every secret in the file. Untested.
        test: null

  - key: runner:cli:methodology:read
    file: packages/runner/src/cli.ts
    function: frozenMethodologyHash
    kind: fs-read
    operation: reads the methodology checksum sidecar a permit is bound to
    risks:
      - risk: unverified-input
        severity: high
        status: open
        enforcementPoint: >-
          NOT ENFORCED — a missing sidecar does fail closed, but the sidecar is
          an ordinary working-tree file, so the revision a permit binds to can
          be changed by editing it. Untested.
        test: null

  - key: runner:cli:permit:require
    file: packages/runner/src/cli.ts
    function: requireGrant
    kind: fs-read
