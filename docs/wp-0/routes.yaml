    risks:
      - risk: unauthorised-inference
        severity: high
        status: open
        enforcementPoint: >-
          UNPROVEN — the verification it delegates to is well tested, but no
          test drives requireGrant itself, so nothing proves a command cannot
          reach a client without it.
        test: null

  - key: runner:cli:canaries:read
    file: packages/runner/src/cli.ts
    function: checkCanaries
    kind: fs-read
    operation: reads every question file to check the contamination canaries
    risks:
      - risk: unverified-input
        severity: low
        status: open
        enforcementPoint: >-
          NOT ENFORCED, and low consequence — it reads a fixed directory and
          only reports. Registered because a read of the committed dataset is a
          low-risk route, not an exempt one.
        test: null

  - key: runner:cli:validate:read
    file: packages/runner/src/cli.ts
    function: cmdValidate
    kind: fs-read
    operation: reads the dataset, the graders' own reference answers and the run boards for validation
    risks:
      - risk: unverified-input
        severity: low
        status: open
        enforcementPoint: NOT ENFORCED, and low consequence — read-only, and it writes nothing.
        test: null

  - key: runner:cli:pilot:record:write
    file: packages/runner/src/cli.ts
